name: CI/CD Pipeline
run-name: CI/CD Pipeline sur le ${{ github.ref_name }}, ref commit ${{ github.sha }}

on:
  push:
    branches-ignore:
      - 'younouss'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci || npm install

      - name: 🏗️ Build du projet (Vérification)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AUTH_DISABLED: 'true'

      - name: 🚀 Déploiement via SCP (Uniquement sur deploiement)
        if: github.ref == 'refs/heads/deploiement' || (github.event_name == 'pull_request' && github.base_ref == 'deploiement')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist"
          target: "web"
          strip_components: 1
