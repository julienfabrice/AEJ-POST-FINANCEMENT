    /* Étape 5 · Partenaire financier — saisie directe des lignes de décaissement.
       L'AGR n'a pas de plan de décaissement : le partenaire décaisse après approbation. */
    function openDecaissementAgr(pid) {
      if (roleCode() !== 'PF') { toast("Seul le partenaire financier peut saisir un décaissement"); return; }
      const p = DB.projets.find(x => x.id === pid); if (estGele(p, true)) return;
      const b = DB.budgets.find(x => x.projet_id === pid);
      if (!b || b.approbation !== 'APPROUVE') { toast("Le dossier doit d'abord être approuvé"); return; }
      const faits = DB.decaissements.filter(d => d.projet_id === pid);
      const verse = faits.reduce((a, d) => a + d.montant, 0);
      const reste = Math.max(0, b.montant - verse);
      const ov = el(`<div class="ov"><div class="modal" style="max-width:540px"><div class="mh"><h3>Décaissement — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <p style="margin:0 0 14px;color:var(--slate);font-size:13px">${p.titre} — ${ref('jeunes', p.jeune_id)}</p>
   <div class="grid g3" style="gap:10px;margin-bottom:16px">
     <div class="kpi"><div class="lab">Crédit accordé</div><div class="val">${money(b.montant).replace(' F', '')} <small>F</small></div></div>
     <div class="kpi"><div class="lab">Déjà décaissé</div><div class="val" style="color:var(--green)">${money(verse).replace(' F', '')} <small>F</small></div></div>
     <div class="kpi"><div class="lab">Reste à décaisser</div><div class="val" style="color:var(--orange)">${money(reste).replace(' F', '')} <small>F</small></div></div>
   </div>
   ${faits.length ? `<div class="sect-t">Décaissements déjà effectués</div>${faits.map(d => `<div class="lgn done"><div class="num">${d.tranche || 1}</div><div class="in"><b>${d.reference || '—'}</b><span>${d.date || '—'}${d.justificatif && d.justificatif !== '—' ? ' · ' + d.justificatif : ''}</span></div><span class="amt">${money(d.montant)}</span></div>`).join('')}` : ''}
   <div class="sect-t">Nouveau décaissement</div>
   <div class="frow"><div class="field half"><label>N° de décaissement *</label><input id="dcRef" value="VIR-${Math.floor(Math.random() * 90000 + 10000)}"></div>
     <div class="field half"><label>Date *</label><input id="dcDate" type="date" value="${new Date().toISOString().slice(0, 10)}"></div></div>
   <div class="frow"><div class="field half"><label>Montant (F) *</label><input id="dcMt" type="number" max="${reste}" value="${reste}"></div>
     <div class="field half"><label>Bénéficiaire du décaissement</label><input id="dcBen" value="${p.titre}"></div></div>
   <div class="field"><label>Justificatif</label><input id="dcJus" placeholder="bordereau_virement.pdf"></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}Enregistrer le décaissement</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const mt = +ov.querySelector('#dcMt').value || 0;
        if (!mt) { toast("Le montant est requis"); return; }
        if (mt > reste) { toast(`Le montant ne peut pas dépasser le reste à décaisser (${money(reste)})`); return; }
        const jus = ov.querySelector('#dcJus').value.trim();
        DB.decaissements.push({
          id: uid('dc'), budget_id: b.id, projet_id: pid, tranche: faits.length + 1, montant: mt,
          date: ov.querySelector('#dcDate').value, reference: ov.querySelector('#dcRef').value.trim(),
          beneficiaire: ov.querySelector('#dcBen').value.trim(), justificatif: jus || '—', statut: 'VALIDE'
        });
        b.deblocage = (verse + mt) >= b.montant ? 'DEBLOQUE' : 'PARTIEL';
        // dès le premier décaissement, le suivi terrain peut démarrer (compte rendu, étape 6)
        if (!faits.length) avancer(p);
        notify('AGR_DECAISSEMENT', {
          titre: `Décaissement — ${p.code}`, icone: 'money', cls: 'gr', projet_id: pid, agence_id: p.agence_id,
          msg: `${money(mt)} versés le ${ov.querySelector('#dcDate').value} · ${p.titre}.`
        });
        close(); toast('Décaissement enregistré'); route();
      };
    }

   <div class="frow"><div class="field half"><label>Catégorie</label><select id="dcat">${cats.map(c => `<option ${c === d?.categorie ? 'selected' : ''}>${c}</option>`).join('')}</select></div><div class="field half"><label>Date</label><input id="ddate" type="date" value="${d?.date_depense || new Date().toISOString().slice(0, 10)}"></div></div>
   <div class="frow"><div class="field half"><label>Intitulé</label><input id="dlib" placeholder="Ex. Achat de matériel" value="${d?.intitule || ''}"></div><div class="field half"><label>Montant (F)</label><input id="dmt" type="number" placeholder="0" value="${d?.montant_depense || ''}"></div></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${isEdit ? 'Enregistrer' : 'Ajouter la dépense'}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close;
      ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const lib = $('#dlib').value.trim(); const mt = +$('#dmt').value;
        if (!lib || !mt) { toast('Renseignez l\'intitulé et le montant'); return; }
        if (isEdit) { Object.assign(d, { categorie: $('#dcat').value, intitule: lib, montant_depense: mt, date_depense: $('#ddate').value }); toast('Dépense modifiée'); }
        else { DB.depenses.push({ id: uid('dp'), micro_projet_id: p.id, categorie: $('#dcat').value, intitule: lib, montant_depense: mt, date_depense: $('#ddate').value, saisi_par: SESSION.id }); toast('Dépense enregistrée'); }
        close(); vBenefDepenses();
      };
    }

    function vBenefRemb() {
      setTop("Mes remboursements", "Suivi de vos échéances de remboursement.");
      const mine = myProjets(); const rb = DB.remboursements.filter(r => mine.some(p => p.id === r.projet_id));
      const du = rb.reduce((a, r) => a + r.du, 0), paye = rb.reduce((a, r) => a + r.paye, 0);
      const rows = rb.map(r => {
        const cls = { PAYE: 'gr', PARTIEL: 'am', IMPAYE: 'rd' }[r.statut], lab = { PAYE: 'Payé', PARTIEL: 'Partiel', IMPAYE: 'Impayé' }[r.statut];
        return `<tr><td>${DB.projets.find(p => p.id === r.projet_id)?.code}</td><td>${r.echeance}</td><td class="mono">${money(r.du)}</td><td class="mono" style="color:var(--green)">${money(r.paye)}</td><td class="mono">${money(r.du - r.paye)}</td><td>${badge(lab, cls)}</td></tr>`;
      }).join('');
      $('#view').innerHTML = `<div class="grid g4" style="margin-bottom:16px">
   <div class="kpi"><div class="lab">Total dû</div><div class="val">${money(du).replace(' F', '')} <small>F</small></div></div>
   <div class="kpi"><div class="lab">Déjà remboursé</div><div class="val" style="color:var(--green)">${money(paye).replace(' F', '')} <small>F</small></div></div>
   <div class="kpi"><div class="lab">Reste à payer</div><div class="val" style="color:var(--orange-deep)">${money(du - paye).replace(' F', '')} <small>F</small></div></div>
   <div class="kpi"><div class="lab">Taux</div><div class="val">${du ? Math.round(paye / du * 100) : 0}%</div></div>
 </div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Projet</th><th>Échéance</th><th>Dû</th><th>Payé</th><th>Reste</th><th>Statut</th></tr></thead><tbody>${rows || '<tr><td colspan="6"><div class="empty">Aucune échéance</div></td></tr>'}</tbody></table></div></div>`;
    }
    /* ---- MON PLAN DE DÉCAISSEMENT (validation par le bénéficiaire) ----
       « Le plan de décaissement est partagé aux bénéficiaires qui valident avec
         l'application mobile. » (compte rendu DFP, MPE étape 4 / Start-Up étape 3.1) */
    function mesPlans() { const mine = myProjets(); return DB.plans_decaissement.filter(pl => mine.some(p => p.id === pl.projet_id)); }
    /* le bénéficiaire n'a pas à connaître le vocabulaire interne de la chaîne de validation */
    const PLAN_STATUT_BENEF = {
      BROUILLON: ["En cours de préparation par votre conseiller", 'gy'],
      EN_VALIDATION: ["En cours de validation par l'AEJ", 'or'],
      AJOURNE: ["Renvoyé à votre conseiller pour correction", 'rd'],
      TRANSMIS_PF: ["Transmis à votre partenaire financier", 'gr']
    };
    function vBenefPlan() {
      setTop("Mon plan de décaissement", "Les tranches de financement prévues pour votre projet. Votre validation est nécessaire pour que le dossier avance.");
      const plans = mesPlans();
      if (!plans.length) {
        $('#view').innerHTML = `<div class="card"><div class="bd"><div class="empty">${ic('money')}<b>Aucun plan de décaissement</b><span>Votre conseiller en insertion professionnelle le saisira une fois votre financement accordé.</span></div></div></div>`;
        return;
      }
      const cards = plans.map(pl => {
        const p = DB.projets.find(x => x.id === pl.projet_id);
        const L = lignesDuPlan(pl.id); const tot = L.reduce((a, l) => a + l.montant, 0);
        const recu = L.filter(l => l.statut === 'EXECUTE').reduce((a, l) => a + l.montant, 0);
        const st = PLAN_STATUT_BENEF[pl.statut] || [pl.statut, 'gy'];
        return `<div class="card" style="margin-bottom:16px"><div class="hd">
     <h3>${p.titre}</h3><div class="sp"></div><span class="mono badge or">${p.code}</span>${badge(...st)}</div><div class="bd">
     ${p.gele ? `<div class="gel-banner">${ic('lock')} Ce dossier est gelé — contactez votre conseiller.</div>` : ''}
     <div class="grid g3" style="gap:10px;margin-bottom:14px">
       <div class="kpi"><div class="lab">Total prévu</div><div class="val">${money(tot).replace(' F', '')} <small>F</small></div></div>
       <div class="kpi"><div class="lab">Déjà reçu</div><div class="val" style="color:var(--green)">${money(recu).replace(' F', '')} <small>F</small></div></div>
       <div class="kpi"><div class="lab">Tranches</div><div class="val">${L.filter(l => l.statut === 'EXECUTE').length} <small>/ ${L.length}</small></div></div>
     </div>
     ${pl.note ? `<div class="sect-t">Note de votre conseiller</div><p style="margin:0 0 6px;font-size:13px;color:var(--slate)">${pl.note}</p>` : ''}
     <div class="sect-t">Tranches prévues</div>
     ${numerosDuPlan(pl.id).map(num => numeroHTML(pl.id, num, L, 'lecture')).join('') || '<p style="margin:0;color:var(--slate);font-size:13px">Aucune tranche saisie pour le moment.</p>'}
     ${L.length ? totalHTML(L) : ''}
     <div style="margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
       ${pl.valide_benef
            ? `${badge('✔ Vous avez validé ce plan', 'gr')}<span class="tmuted" style="font-size:12.5px">Merci — votre dossier suit son cours auprès de l'AEJ.</span>`
            : (L.length && !p.gele
              ? `<button class="btn pri" data-val="${pl.id}">${ic('check')}Je valide mon plan de décaissement</button><span class="tmuted" style="font-size:12.5px">Vérifiez les montants et les dates avant de valider.</span>`
              : `<span class="tmuted" style="font-size:12.5px">Plan en cours de préparation — vous serez notifié dès qu'il sera prêt.</span>`)}
     </div>
   </div></div>`;
      }).join('');
      const wrap = el(`<div>${cards}</div>`);
      wrap.querySelectorAll('[data-val]').forEach(b => b.onclick = () => validerPlanBeneficiaire(b.dataset.val));
      $('#view').innerHTML = ''; $('#view').appendChild(wrap);
    }
    function validerPlanBeneficiaire(planId) {
      const pl = DB.plans_decaissement.find(x => x.id === planId);
      const p = DB.projets.find(x => x.id === pl.projet_id); if (estGele(p, true)) return;
      const L = lignesDuPlan(pl.id); const tot = L.reduce((a, l) => a + l.montant, 0);
      confirmValider("Valider mon plan de décaissement",
        `Vous validez le plan de <b>${p.titre}</b> : ${L.length} tranche(s) pour un total de <b>${money(tot)}</b>. Votre conseiller pourra ensuite le transmettre à l'AEJ pour validation.`,
        "Je valide", () => {
          pl.valide_benef = true;
          notify('PLAN_VALIDE_BENEF', {
            titre: `Plan validé par le bénéficiaire — ${p.code}`, icone: 'check', cls: 'gr',
            projet_id: p.id, agence_id: p.agence_id,
            cibles: ['ADMIN', 'CIP', 'AC', 'CAR', 'AGENT_DIR', 'CSFM', 'SDRF', 'DPF'],
            msg: `${SESSION.prenoms} ${SESSION.nom} a validé son plan de décaissement (${money(tot)}).`
          });
          toast('Merci, votre plan est validé'); vBenefPlan();
        });
    }

    const BENEF_ROUTES = { benef_dashboard: vBenefHome, benef_projet: vBenefProjet, benef_plan: vBenefPlan, benef_documents: vBenefDocs, benef_depenses: vBenefDepenses, benef_suivi: vBenefSuivi, benef_remb: vBenefRemb };

    /* ---- MON PROFIL (agent ou bénéficiaire) ---- */
    function openProfil() {
      const u = SESSION;
      const ov = el(`<div class="ov"><div class="modal"><div class="mh"><h3>Mon profil</h3><button class="x">${ic('x')}</button></div>
   <div class="mb">
     <div class="frow"><div class="field half"><label>Prénoms</label><input id="pf_prenoms" value="${u.prenoms || ''}"></div><div class="field half"><label>Nom</label><input id="pf_nom" value="${u.nom || ''}"></div></div>
     <div class="frow"><div class="field half"><label>Email</label><input id="pf_email" type="email" value="${u.email || ''}"></div><div class="field half"><label>Téléphone</label><input id="pf_tel" value="${u.telephone || ''}"></div></div>
     <div class="field"><label>Rôle</label><input value="${u.kind === 'benef' ? 'Bénéficiaire (promoteur)' : (DB.roles.find(r => r.id === u.role_id)?.libelle || '')}" disabled></div>
     <div class="sect-t" style="margin-top:4px">Changer le mot de passe</div>
     <div class="frow"><div class="field half"><label>Nouveau mot de passe</label><input id="pf_p1" type="password" placeholder="••••••••"></div><div class="field half"><label>Confirmer</label><input id="pf_p2" type="password" placeholder="••••••••"></div></div>
   </div>
   <div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}Enregistrer</button></div>
 </div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer(); ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const p1 = $('#pf_p1').value, p2 = $('#pf_p2').value;
        if (p1 && p1 !== p2) { toast('Les mots de passe ne correspondent pas'); return; }
        u.prenoms = $('#pf_prenoms').value; u.nom = $('#pf_nom').value; u.email = $('#pf_email').value; u.telephone = $('#pf_tel').value;
        toast('Profil mis à jour'); close(); renderWho(); route();
      };
    }

    renderLogin();

  </script>
</body>

</html>
