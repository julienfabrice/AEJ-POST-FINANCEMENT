   </div>
   <div class="fkpis">
     <div class="fkpi"><div class="lab">Dossiers concernés</div><div class="val">${totalN}</div></div>
     <div class="fkpi"><div class="lab">Montant total engagé</div><div class="val">${money(totalM)}</div></div>
     <div class="fkpi"><div class="lab">Montant moyen / dossier</div><div class="val">${money(Math.round(avgM))}</div></div>
     <div class="fkpi"><div class="lab">${dl}(s) représenté(s)</div><div class="val">${rows.length}</div></div>
   </div>
   <div class="fnarr">${ficheNarrative(rows, totalN, totalM, dl)}</div>
   <div class="fsec"><h2>Répartition — ${dl}</h2>${barRows}</div>
   <div class="fsec"><h2>Détail chiffré</h2>
     <table><thead><tr><th>${dl}</th><th>Nb projets</th><th>Montant engagé</th><th>Part</th></tr></thead>
     <tbody>${tblRows}</tbody>
     <tfoot><tr><td>Total général</td><td class="mono">${totalN}</td><td class="mono">${money(totalM)}</td><td class="mono">100%</td></tr></tfoot></table>
   </div>
   <div class="ffoot"><span>Document généré automatiquement par ${c.nom_systeme} — données issues du périmètre filtré au moment de la génération.</span><span>${c.sigle_systeme}</span></div>
 </div>
 </body></html>`;
    }
    function genererFicheSynthese(rows, R, st, dl, totalN, totalM) {
      const html = ficheSyntheseHTML(rows, R, st, dl, totalN, totalM);
      const w = window.open('', '_blank');
      if (!w) { toast("Autorisez les pop-ups pour générer la fiche de synthèse."); return; }
      w.document.open(); w.document.write(html); w.document.close();
    }

    /* ---- PARAMÉTRAGE DES WORKFLOWS (admin, CRUD étapes & sous-étapes) ---- */
    function vAdminWorkflows() {
      setTop("Paramétrage des workflows", "Configuration des étapes et sous-étapes de chaque guichet (réservé aux administrateurs).", `${ic('flow')} <b>Administration</b>`);
      const wfId = (window._awf && WORKFLOWS[window._awf]) ? window._awf : DB.dispositifs[0].id;
      window._awf = wfId;
      const wf = WORKFLOWS[wfId];
      const tabs = `<div class="tabs">${DB.dispositifs.map(x => `<button data-wf="${x.id}" class="${x.id === wfId ? 'on' : ''}">${x.libelle}</button>`).join('')}</div>`;
      const cyclesHTML = wf.cycles.map((c, ci) => {
        const subs = c.subs.map((s, si) => `<div class="sub"><h5 style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span>${s.t}</span><span style="display:flex;gap:4px;flex:none"><button class="iconbtn" data-edit-sub="${ci}:${si}" title="Modifier">${ic('edit')}</button><button class="iconbtn del" data-del-sub="${ci}:${si}" title="Supprimer">${ic('trash')}</button></span></h5><div class="meta">
     <span class="m">${ic('users')} <b>${s.acteurs || '—'}</b></span>
     ${s.liv ? `<span class="m">${ic('doc')} ${s.liv}</span>` : ''}
     ${s.delai ? `<span class="m">${ic('clock')} ${s.delai}</span>` : ''}
   </div></div>`).join('') || '<div class="empty" style="padding:6px 0">Aucune sous-étape</div>';
        return `<div class="cy"><div class="num">${c.n}</div><div class="cyc-card"><div class="ch" style="cursor:default"><div><h4>${c.t}</h4><div class="code mono">${c.code}</div></div><div class="sp"></div>
     <button class="iconbtn" data-edit-cycle="${ci}" title="Modifier l'étape">${ic('edit')}</button>
     <button class="iconbtn del" data-del-cycle="${ci}" title="Supprimer l'étape">${ic('trash')}</button>
   </div><div class="cb" style="display:block">${subs}<div style="margin-top:12px"><button class="btn sm" data-add-sub="${ci}">${ic('plus')}Ajouter une sous-étape</button></div></div></div></div>`;
      }).join('');
      const wrap = el(`<div>${tabs}<div style="margin:16px 0"><button class="btn pri sm" id="addCycle">${ic('plus')}Ajouter une étape</button></div><div class="wf" style="max-width:820px">${cyclesHTML}</div></div>`);
      $('#view').innerHTML = ''; $('#view').appendChild(wrap);
      wrap.querySelectorAll('[data-wf]').forEach(b => b.onclick = () => { window._awf = b.dataset.wf; vAdminWorkflows(); });
      wrap.querySelector('#addCycle').onclick = () => openCycleForm(wfId);
      wrap.querySelectorAll('[data-edit-cycle]').forEach(b => b.onclick = () => openCycleForm(wfId, +b.dataset.editCycle));
      wrap.querySelectorAll('[data-del-cycle]').forEach(b => b.onclick = () => {
        const ci = +b.dataset.delCycle; const c = wf.cycles[ci];
        const nb = DB.projets.filter(p => p.dispositif_id === wfId && p.etape === c.n).length;
        confirmAction(`Supprimer l'étape « ${c.t} » ?` + (nb ? ` ${nb} dossier(s) sont actuellement à cette étape.` : ''), () => {
          wf.cycles.splice(ci, 1); toast('Étape supprimée'); vAdminWorkflows();
        });
      });
      wrap.querySelectorAll('[data-add-sub]').forEach(b => b.onclick = () => openSubForm(wfId, +b.dataset.addSub));
      wrap.querySelectorAll('[data-edit-sub]').forEach(b => b.onclick = () => { const [ci, si] = b.dataset.editSub.split(':').map(Number); openSubForm(wfId, ci, si); });
      wrap.querySelectorAll('[data-del-sub]').forEach(b => b.onclick = () => {
        const [ci, si] = b.dataset.delSub.split(':').map(Number); const s = wf.cycles[ci].subs[si];
        confirmAction(`Supprimer la sous-étape « ${s.t} » ?`, () => { wf.cycles[ci].subs.splice(si, 1); toast('Sous-étape supprimée'); vAdminWorkflows(); });
      });
    }
    function openCycleForm(wfId, ci) {
      const wf = WORKFLOWS[wfId]; const isEdit = ci != null; const c = isEdit ? wf.cycles[ci] : null;
      const nextN = isEdit ? c.n : (Math.max(0, ...wf.cycles.map(x => x.n)) + 1);
      const ov = el(`<div class="ov"><div class="modal" style="max-width:460px"><div class="mh"><h3>${isEdit ? 'Modifier' : 'Ajouter'} une étape</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <div class="frow">
     <div class="field half"><label>Numéro d'étape</label><input id="cN" type="number" value="${nextN}" ${isEdit ? 'disabled' : ''}></div>
     <div class="field half"><label>Code</label><input id="cCode" value="${isEdit ? c.code : wf.code + '.' + nextN}"></div>
   </div>
   <div class="field"><label>Intitulé de l'étape</label><input id="cTitle" value="${isEdit ? c.t : ''}"></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${isEdit ? 'Enregistrer' : 'Ajouter'}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const t = $('#cTitle').value.trim(); if (!t) { toast("L'intitulé est requis"); return; }
        const code = $('#cCode').value.trim();
        if (isEdit) { c.t = t; c.code = code; }
        else { wf.cycles.push({ n: +$('#cN').value || nextN, code, t, subs: [] }); }
        toast(isEdit ? 'Étape modifiée' : 'Étape ajoutée'); close(); vAdminWorkflows();
      };
    }
    function openSubForm(wfId, ci, si) {
      const wf = WORKFLOWS[wfId]; const isEdit = si != null; const s = isEdit ? wf.cycles[ci].subs[si] : null;
      const ov = el(`<div class="ov"><div class="modal" style="max-width:520px"><div class="mh"><h3>${isEdit ? 'Modifier' : 'Ajouter'} une sous-étape</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <div class="field"><label>Intitulé</label><input id="sTitle" value="${isEdit ? s.t : ''}"></div>
   <div class="field"><label>Acteurs</label><input id="sActeurs" value="${isEdit ? (s.acteurs || '') : ''}"></div>
   <div class="frow">
     <div class="field half"><label>Livrable</label><input id="sLiv" value="${isEdit ? (s.liv || '') : ''}"></div>
     <div class="field half"><label>Délai</label><input id="sDelai" value="${isEdit ? (s.delai || '') : ''}"></div>
   </div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${isEdit ? 'Enregistrer' : 'Ajouter'}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const t = $('#sTitle').value.trim(); if (!t) { toast("L'intitulé est requis"); return; }
        const data = { t, acteurs: $('#sActeurs').value.trim(), liv: $('#sLiv').value.trim(), delai: $('#sDelai').value.trim() };
        if (isEdit) { Object.assign(s, data); } else { wf.cycles[ci].subs.push(data); }
        toast(isEdit ? 'Sous-étape modifiée' : 'Sous-étape ajoutée'); close(); vAdminWorkflows();
      };
    }

    /* ---- PROFILS & PERMISSIONS (matrix) ---- */
    function vProfils() {
      const tab = window._ptab || 'matrix';
      setTop("Profils & permissions", "Rôles fonctionnels et matrice des droits par module.", `${ic('shield')} <b>Administration</b>`);
      const bar = el(`<div class="tabs"><button data-t="matrix" class="${tab === 'matrix' ? 'on' : ''}">Matrice des droits</button><button data-t="list" class="${tab === 'list' ? 'on' : ''}">Liste des profils</button></div>`);
      const host = el('<div></div>'); const wrap = document.createElement('div'); wrap.appendChild(bar); wrap.appendChild(host);
      $('#view').innerHTML = ''; $('#view').appendChild(wrap);
      bar.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { window._ptab = b.dataset.t; vProfils(); });
      if (tab === 'list') { host.appendChild(resourceView('roles')); return; }
      const editable = can('admin_profils', 'e');
      const roles = DB.roles;
      const head = `<th>Module</th>${roles.map(r => `<th style="text-align:center">${r.code}</th>`).join('')}`;
      const body = MODULES.map(m => {
        const cells = roles.map(r => {
          const p = PERMS[r.code] || {}; const mp = p[m.k] || (p['*'] ? ALL : {});
          const b = (a, lb) => `<span class="perm ${a} ${mp[a] ? 'on' : ''}" data-r="${r.code}" data-m="${m.k}" data-a="${a}" title="${{ v: 'Voir', c: 'Créer', e: 'Modifier', d: 'Supprimer' }[a]}">${lb}</span>`;
          return `<td><div class="cell">${b('v', 'V')}${b('c', 'C')}${b('e', 'E')}${b('d', 'D')}</div></td>`;
        }).join('');
        return `<tr><td class="mod">${m.label}</td>${cells}</tr>`;
      }).join('');
      host.innerHTML = `<div class="card">
   <div class="hd"><h3>Matrice rôles × modules</h3><div class="sp"></div><span class="count">V voir · C créer · E modifier · D supprimer${editable ? ' · cliquez pour basculer' : ' · lecture seule'}</span></div>
   <div class="tbl-wrap" style="max-height:64vh;overflow:auto"><table class="matrix"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
 </div>`;
      if (editable) host.querySelectorAll('.perm').forEach(c => c.onclick = () => {
        const { r, m, a } = c.dataset; if (r === 'ADMIN') { toast("Le profil Administrateur n'est pas modifiable depuis cet écran"); return; }
        PERMS[r] = PERMS[r] || {}; PERMS[r][m] = PERMS[r][m] || {};
        PERMS[r][m][a] = PERMS[r][m][a] ? 0 : 1; c.classList.toggle('on');
        if (r === roleCode()) { renderNav(); }
      });
    }

    /* ---- PARAMÈTRES SYSTÈME ---- */
    function vParametres() {
      const c = DB.configurations;
      setTop("Paramètres système", "Configuration globale de la plateforme (singleton).", `${ic('gear')} <b>Administration</b>`);
      const canE = can('admin_parametres', 'e');
      const sec = (title, inner) => `<div class="card" style="margin-bottom:16px"><div class="hd"><h3>${title}</h3></div><div class="bd">${inner}</div></div>`;
      const fi = (id, lbl, val, type = 'text', half = 1) => `<div class="field${half ? ' half' : ''}"><label>${lbl}</label><input id="cfg_${id}" type="${type}" value="${val ?? ''}" ${canE ? '' : 'disabled'}></div>`;
      const sw = (id, lbl, val) => `<div class="field" style="display:flex;align-items:center;justify-content:space-between"><label style="margin:0">${lbl}</label><label class="switch"><input type="checkbox" id="cfg_${id}" ${val ? 'checked' : ''} ${canE ? '' : 'disabled'}><span class="sl"></span></label></div>`;
      const row = (a, b) => `<div class="frow">${a}${b}</div>`;
      $('#view').innerHTML =
        sec("Identité de la structure",
          row(fi('nom_structure', 'Nom de la structure', c.nom_structure), fi('nom_systeme', 'Nom du système', c.nom_systeme)) +
          row(fi('sigle_systeme', 'Sigle du système', c.sigle_systeme), fi('email_contact', 'Email de contact', c.email_contact, 'email')) +
          row(fi('telephone', 'Téléphone', c.telephone), fi('devise', 'Devise', c.devise))) +
        sec("Sécurité & sessions",
          row(fi('delai_inactivite', 'Délai d\'inactivité (min)', c.delai_inactivite, 'number'), fi('max_sessions', 'Sessions simultanées max', c.max_sessions, 'number')) +
          row(fi('max_tentatives', 'Tentatives de connexion max', c.max_tentatives, 'number'), fi('delai_mdp', 'Délai changement mot de passe (j)', c.delai_mdp, 'number'))) +
        sec("Intégrations",
          row(fi('whatsapp', 'WhatsApp Business', c.whatsapp), fi('smtp_hote', 'Serveur SMTP', c.smtp_hote)) +
          row(fi('smtp_port', 'Port SMTP', c.smtp_port, 'number'), fi('smtp_user', 'Utilisateur SMTP', c.smtp_user)) +
          sw('whatsapp_actif', 'Notifications WhatsApp activées', c.whatsapp_actif) + sw('smtp_tls', 'SMTP — chiffrement TLS', c.smtp_tls)) +
        sec("Maintenance", sw('maintenance', 'Activer le mode maintenance (accès restreint aux administrateurs)', c.maintenance)) +
        (canE ? `<div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn pri" id="saveCfg">${ic('check')}Enregistrer les paramètres</button></div>` : `<div class="deny" style="padding:20px">${ic('lock')}<div>Votre profil peut consulter mais non modifier ces paramètres.</div></div>`);
      if (canE) $('#saveCfg').onclick = () => {
        ['nom_structure', 'nom_systeme', 'sigle_systeme', 'email_contact', 'telephone', 'devise', 'whatsapp', 'smtp_hote', 'smtp_user'].forEach(k => c[k] = $('#cfg_' + k).value);
        ['delai_inactivite', 'max_sessions', 'max_tentatives', 'delai_mdp', 'smtp_port'].forEach(k => c[k] = +$('#cfg_' + k).value);
        ['whatsapp_actif', 'smtp_tls', 'maintenance'].forEach(k => c[k] = $('#cfg_' + k).checked);
        toast('Paramètres enregistrés'); setTop("Paramètres système", "Configuration globale de la plateforme (singleton).", `${ic('gear')} <b>Administration</b>`);
      };
    }

    /* ====================================================================
       CIRCUIT DE FINANCEMENT — écrans issus du compte rendu
       « Réunion DFP sur les procédures »
       ==================================================================== */

    /* guichet sélectionné depuis la page d'accueil des guichets */
    function guichetCourant() { return (window._guichet && DB.dispositifs.some(d => d.id === window._guichet)) ? window._guichet : null; }

    /* ---- Page d'accueil : présentation des guichets, redirection vers l'interface choisie ---- */
    function vGuichets() {
      setTop("Guichets opérationnels", "Choisissez le guichet dont vous voulez suivre les dossiers.", `${ic('flag')} <b>${DB.configurations.nom_structure}</b>`);
      const cards = DB.dispositifs.map(d => {

    /* simulation d'échéancier — calcul pur, aucun effet de bord sur DB (aperçu uniquement) */
    function mensualite(montant, tauxAnnuel, duree) {
      if (!montant || !duree) return 0;
      const i = (tauxAnnuel || 0) / 100 / 12;
      return i ? montant * i / (1 - Math.pow(1 + i, -duree)) : montant / duree;
    }
    function genererEcheancier(montant, tauxAnnuel, duree, dateDebut) {
      if (!montant || !duree) return [];
      const m = Math.round(mensualite(montant, tauxAnnuel, duree));
      const total = m * duree;
      const d0 = dateDebut ? new Date(dateDebut) : new Date();
      const lignes = [];
      for (let n = 1; n <= duree; n++) {
        const d = new Date(d0.getFullYear(), d0.getMonth() + n, 0);
        lignes.push({ n, echeance: d.toISOString().slice(0, 10), du: n === duree ? total - m * (duree - 1) : m });
      }
      return lignes;
    }

   <div class="frow"><div class="field half"><label>Durée du prêt (mois)</label><input id="fDp" type="number" value="${b.duree_pret || d.duree}"></div>
     <div class="field half"><label>Durée du remboursement (mois)</label><input id="fDr" type="number" value="${b.duree_remboursement || d.duree}"></div></div>
   <div class="frow"><div class="field half"><label>Tableau d'amortissement</label><input id="fAm" value="${b.amortissement || ''}" placeholder="tableau_amortissement_${p.code}.xlsx"></div>
      <div class="field half"><label>Copie du contrat / convention de prêt</label><input id="fCv" value="${b.piece_convention || ''}" placeholder="convention_pret_${p.code}.pdf"></div></div>
   <div class="field"><label>Motif (en cas de rejet)</label><textarea id="fMr" rows="2">${b.motif_rejet || ''}</textarea></div>
   <div class="imp-modele">${ic('doc')} Modèle « tableau d'amortissement » <em>— à fournir par l'AEJ, import possible</em></div>
   <div id="fSimu"></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}Enregistrer</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      const rafraichirSimu = () => {
        const mt = +ov.querySelector('#fMt').value || 0, tx = +ov.querySelector('#fTx').value || 0,
          dr = +ov.querySelector('#fDr').value || 0, dt = ov.querySelector('#fDate').value;
        const lignes = genererEcheancier(mt, tx, dr, dt);
        const simu = ov.querySelector('#fSimu');
        if (!lignes.length) { simu.innerHTML = ''; return; }
        const m = Math.round(mensualite(mt, tx, dr));
        simu.innerHTML = `<div class="sect-t" style="margin-top:14px">Simulation du tableau d'amortissement</div>
     <div class="frow" style="margin-bottom:8px">
       <span class="m">Mensualité <b class="mono">${money(m)}</b></span>
       <span class="m">Total à rembourser <b class="mono">${money(lignes.reduce((s, l) => s + l.du, 0))}</b></span>
     </div>
     <div class="tbl-wrap" style="max-height:220px;overflow:auto">
       <table style="width:100%"><thead><tr><th>#</th><th>Échéance</th><th>Montant</th></tr></thead>
       <tbody>${lignes.map(l => `<tr><td>${l.n}</td><td>${l.echeance}</td><td class="mono">${money(l.du)}</td></tr>`).join('')}</tbody></table>
     </div>`;
      };
      ['#fMt', '#fTx', '#fDr', '#fDate'].forEach(sel => { const el = ov.querySelector(sel); el.addEventListener('input', rafraichirSimu); el.addEventListener('change', rafraichirSimu); });
      rafraichirSimu();
      ov.querySelector('[data-s]').onclick = () => {
        const dec = ov.querySelector('#fApp').value;
        Object.assign(b, {
          date_ouverture_compte: ov.querySelector('#fDate').value, approbation: dec,
          montant: +ov.querySelector('#fMt').value || p.montant, taux_interet: +ov.querySelector('#fTx').value || 0,
          duree_pret: +ov.querySelector('#fDp').value || 0, duree_remboursement: +ov.querySelector('#fDr').value || 0,
          amortissement: ov.querySelector('#fAm').value.trim(), piece_convention: ov.querySelector('#fCv').value.trim(),
          motif_rejet: ov.querySelector('#fMr').value.trim()
        });
        if (dec === 'APPROUVE') b.convention = 'SIGNEE';
        appliquerDecisionPf(p, b, dec);
        close(); toast(`${p.code} — ${dec === 'APPROUVE' ? 'approuvé' : dec === 'REJETE' ? 'rejeté' : 'enregistré'}`); vPfEspace();
      };
    }

    /* conséquences d'une décision du partenaire : avancement + notification bénéficiaire et AEJ */
    function appliquerDecisionPf(p, b, dec) {
      if (dec === 'APPROUVE') {
        // AGR : traitement partenaire → décaissement ; MPE/MEPS et Start-Up : imputation puis plan
        if (p.dispositif_id === 'wf-agr') { if (p.statut === 'TRAITEMENT_PF') avancer(p); }
        else if (p.statut === 'TRANSMISSION') avancer(p);
        notify('PF_APPROUVE', {
          titre: `${p.code} approuvé par le partenaire`, icone: 'check', cls: 'gr', projet_id: p.id,
          msg: `${p.titre} — crédit de ${money(b.montant)} sur ${b.duree_pret || '—'} mois au taux de ${b.taux_interet || '—'}%.`
        });
      } else if (dec === 'REJETE') {
        notify('PF_REJETE', {
          titre: `${p.code} rejeté par le partenaire`, icone: 'flag', cls: 'rd', projet_id: p.id,
          msg: `${p.titre}${b.motif_rejet ? ' — ' + b.motif_rejet : ''}.`
        });
      }
    }

    /* traitement par import Excel d'un lot entier */
    function importTraitementPf(lotId) {
      const lot = DB.lots.find(l => l.id === lotId);
      const P = DB.projets.filter(p => p.lot_id === lotId && !p.gele);
      openImportExcel({
        titre: `Traitement du lot ${lot.reference}`,
        soustitre: "Le fichier renvoyé par le partenaire est rapproché des dossiers par le N° de dossier. Les dossiers importés sont marqués approuvés avec les conditions de crédit du courrier de transmission.",
        colonnes: ["N° de dossier", "Date d'ouverture du compte", "Approbation", "Montant du crédit", "Durée du prêt", "Taux d'intérêt", "Durée du remboursement"],
        modele: "Fichier Excel de retour du partenaire financier",
        lignes: P.map(p => ({ titre: `${p.code} — ${p.titre}`, detail: `${money(p.montant)} · ${ref('jeunes', p.jeune_id)}`, _id: p.id })),
        libelleAction: "Importer le traitement",
        onRows: rows => {
          const d = DB.dispositifs.find(x => x.id === lot.dispositif_id);
          rows.forEach(r => {
            const p = DB.projets.find(x => x.id === r._id); if (estGele(p)) return;
            let b = DB.budgets.find(x => x.projet_id === p.id);
            if (!b) { b = { id: uid('b'), projet_id: p.id }; DB.budgets.push(b); }
            Object.assign(b, {
              date_ouverture_compte: lot.date_transmission, approbation: 'APPROUVE', montant: p.montant,
              taux_interet: d.taux, duree_pret: lot.duree_remboursement, duree_remboursement: lot.duree_remboursement,
              convention: 'SIGNEE', deblocage: b.deblocage || 'NON',
              amortissement: b.amortissement || `tableau_amortissement_${p.code}.xlsx`,
              piece_convention: b.piece_convention || `convention_pret_${p.code}.pdf`,
              reference_convention: lot.reference_convention
            });
            appliquerDecisionPf(p, b, 'APPROUVE');
          });
          toast(rows.length + ' dossier(s) traité(s) par import'); vPfEspace();
        }
      });
    }

    /* renvoi du lot au chef de service développement des ressources de financement */
    function renvoyerLot(lotId) {
      const lot = DB.lots.find(l => l.id === lotId);
      confirmValider("Renvoyer le lot à l'AEJ",
        `Le lot ${lot.reference} sera retourné au chef de service développement des ressources de financement. Tous les profils de l'AEJ et les agences concernées seront notifiés.`,
        "Renvoyer le lot", () => {
          lot.statut = 'RETOURNE';
          DB.projets.filter(p => p.lot_id === lotId).forEach(p => { const b = DB.budgets.find(x => x.projet_id === p.id); if (b) b.retourne_sdrf = new Date().toISOString().slice(0, 10); });
          notify('LOT_RETOURNE', {
            titre: `Lot ${lot.reference} retourné par le partenaire`, icone: 'dl', cls: 'bl',
            msg: `Traitement terminé par ${ref('organismes', lot.organisme_id)} — dossiers disponibles au service développement des ressources de financement.`
          });
          new Set(DB.projets.filter(p => p.lot_id === lotId).map(p => p.agence_id)).forEach(ag => {
            if (ag)
              notify('LOT_RETOURNE_AGENCE', {
                titre: "Retour du partenaire sur vos dossiers", icone: 'dl', cls: 'bl', agence_id: ag,
                cibles: ['CAR', 'CIP', 'AC'], msg: `Lot ${lot.reference} — consultez les dossiers de votre zone.`
              });
          });
          toast('Lot renvoyé au chef de service'); vPfEspace();
        });
    }

    /* listes séparées « approuvés » et « rejetés » exigées par le compte rendu */
    function pfListeDecision(dec) {
      const B = DB.budgets.filter(b => b.approbation === dec && inScope('budgets', b));
      const rows = B.map(b => {
        const p = DB.projets.find(x => x.id === b.projet_id); if (!p) return '';
        return `<div class="lgn" data-p="${p.id}" style="cursor:pointer"><div class="num">${ic('folder')}</div>
     <div class="in"><b>${p.code} — ${p.titre}</b><span>${ref('jeunes', p.jeune_id)} · ${ref('organismes', p.organisme_id)} · ${ref('agences', p.agence_id)}${b.motif_rejet ? ' · ' + b.motif_rejet : ''}</span></div>
     <span class="amt">${money(b.montant)}</span>
     ${b.amortissement ? badge('Amortissement', 'gy') : ''}${b.piece_convention ? badge('Convention', 'gy') : ''}</div>`;
      }).join('');
      const host = el(`<div class="card"><div class="hd"><h3>${dec === 'APPROUVE' ? 'Dossiers approuvés' : 'Dossiers rejetés'}</h3><div class="sp"></div>${badge(B.length, dec === 'APPROUVE' ? 'gr' : 'rd')}</div><div class="bd">${rows || `<div class="empty">Aucun dossier ${dec === 'APPROUVE' ? 'approuvé' : 'rejeté'}</div>`}</div></div>`);
      host.querySelectorAll('[data-p]').forEach(r => r.onclick = () => openProjet(r.dataset.p));
      return host;
    }

    /* ====================================================================
       PLANS DE DÉCAISSEMENT — saisie, validation hiérarchique,
       puis autorisation (partenaire) / exécution (agence) ligne par ligne
       ==================================================================== */

    /* en-tête du modèle papier : point focal du partenaire financier, déduit du dossier (personne PF liée
       à l'organisme si elle existe, sinon coordonnées de l'organisme) */
    function pointFocalBanque(p) {
      if (!p.organisme_id) return '—';
      const u = DB.personnels.find(x => x.role_id === 'r-pf' && x.organisme_id === p.organisme_id);
      if (u) return `${u.prenoms} ${u.nom} · ${ref('organismes', p.organisme_id)}`;
      const o = DB.organismes.find(x => x.id === p.organisme_id);
      return o ? `${o.libelle}${o.contact ? ' · ' + o.contact : ''}` : '—';
    }
    const planDuProjet = pid => DB.plans_decaissement.find(pl => pl.projet_id === pid);
    const lignesDuPlan = plid => DB.lignes_plan.filter(l => l.plan_id === plid).sort((a, b) => a.num - b.num);
    /* un numéro regroupe une ou plusieurs lignes (prestataires différents) : l'autorisation et
       l'exécution se font par numéro, en bloc — conforme au modèle papier du plan de décaissement */
    const numerosDuPlan = plid => { const L = lignesDuPlan(plid); return [...new Set(L.map(l => l.num))].sort((a, b) => a - b); };

    function exporterPlanDecaissement(pid) {
      const p = DB.projets.find(x => x.id === pid); if (!p) return;
      const pl = planDuProjet(pid);
      if (!pl) { toast("Aucun plan de décaissement pour ce projet"); return; }
      const L = lignesDuPlan(pl.id);
      if (!L.length) { toast("Aucune ligne dans le plan de décaissement"); return; }
      const tot = L.reduce((s, l) => s + l.montant, 0);
      let csv = 'Numero;Libelle;Montant (F);Statut\n' + L.map(l => `${l.num};${(l.libelle || '').replace(/;/g, ',')};${l.montant};${(LIGNE_STATUT[l.statut] || [l.statut])[0]}`).join('\n');
      csv += `\nTOTAL;;${tot};`;
      const bl = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = `plan_decaissement_${p.code}.csv`; a.click();
      toast(`Plan de décaissement exporté (${p.code})`);
    }

    /* le partenaire n'autorise le numéro n+1 qu'une fois le numéro n intégralement exécuté */
    function peutAutoriserNumero(num, lignes) {
      const grp = lignes.filter(l => l.num === num);
      if (!grp.length || !grp.every(l => l.statut === 'PREVU')) return false;
      const prec = lignes.filter(l => l.num < num);
      return prec.every(l => l.statut === 'EXECUTE');
    }
    const peutExecuterNumero = (num, lignes) => { const grp = lignes.filter(l => l.num === num); return grp.length > 0 && grp.every(l => l.statut === 'AUTORISE'); };
    /* motif de blocage, affiché en infobulle sur le bouton désactivé */
    function motifBlocageNumero(num, lignes) {
      const prec = lignes.filter(l => l.num < num && l.statut !== 'EXECUTE');
      if (prec.length) return `Le numéro ${prec[0].num} doit d'abord être exécuté par l'agence régionale.`;
      return '';
    }

    /* petite fenêtre « date + justificatif » commune à l'autorisation et à l'exécution */
    function saisieJustificatif(titre, libelle, onOk, avecObservation = false) {
      const ov = el(`<div class="ov"><div class="modal" style="max-width:440px"><div class="mh"><h3>${titre}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <div class="field"><label>Date *</label><input id="jDate" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
   <div class="field"><label>Justificatif (référence de la pièce)</label><input id="jRef" placeholder="bordereau.pdf"></div>
   ${avecObservation ? `<div class="field"><label>Observation</label><textarea id="jObs" rows="2" placeholder="Remarques sur l'exécution…"></textarea></div>` : ''}
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${libelle}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const d = ov.querySelector('#jDate').value; if (!d) { toast('La date est requise'); return; }
        const obsEl = ov.querySelector('#jObs');
        close(); onOk(d, ov.querySelector('#jRef').value.trim(), obsEl ? obsEl.value.trim() : undefined);
      };
    }

    function autoriserNumero(planId, num, apres) {
      const pl = DB.plans_decaissement.find(x => x.id === planId);
      const p = DB.projets.find(x => x.id === pl.projet_id); if (estGele(p, true)) return;
      const lignes = lignesDuPlan(planId);
      if (!peutAutoriserNumero(num, lignes)) { toast(motifBlocageNumero(num, lignes)); return; }
      const grp = lignes.filter(l => l.num === num); const total = grp.reduce((a, l) => a + l.montant, 0);
      saisieJustificatif(`Autoriser le décaissement ${num}`, "Autoriser", (date, ref) => {
        grp.forEach(l => { l.statut = 'AUTORISE'; l.date_autorisation = date; l.justif_autorisation = ref; });
        // la toute première autorisation fait sortir le dossier de « Traitement partenaire » —
        // le relais devient ensuite dynamique (numeroEnCoursDecaissement) pour la suite du va-et-vient
        if (num === Math.min(...lignes.map(l => l.num)) && p.statut === 'TRAITEMENT_PF') avancer(p);
        notify('LIGNE_AUTORISEE', {
          titre: `Numéro ${num} autorisé — ${p.code}`, icone: 'money', cls: 'am', projet_id: p.id, agence_id: p.agence_id,
          msg: `${grp.length} ligne(s) · ${money(total)} — exécution attendue de l'agence régionale.`
        });
        toast(`Numéro ${num} autorisé`); (apres || vPfEspace)();
      }, false);
    }
    function executerNumero(planId, num, apres) {
      const pl = DB.plans_decaissement.find(x => x.id === planId);
      const p = DB.projets.find(x => x.id === pl.projet_id); if (estGele(p, true)) return;
      const lignes = lignesDuPlan(planId);
      if (!peutExecuterNumero(num, lignes)) { toast("Ce numéro doit d'abord être autorisé par le partenaire financier"); return; }
      const grp = lignes.filter(l => l.num === num); const total = grp.reduce((a, l) => a + l.montant, 0);
      saisieJustificatif(`Exécuter le décaissement ${num}`, "Exécuter", (date, ref, obs) => {
        const b = DB.budgets.find(x => x.projet_id === p.id);
        grp.forEach(l => {
          l.statut = 'EXECUTE'; l.date_execution = date; l.justif_execution = ref; l.observation_execution = obs || '';
          // chaque ligne du numéro alimente le suivi financier existant, avec son propre prestataire
          DB.decaissements.push({
            id: uid('dc'), budget_id: b ? b.id : null, projet_id: p.id, tranche: l.num, montant: l.montant,
            date, reference: ref || ('VIR-' + Math.floor(Math.random() * 90000 + 10000)), statut: 'VALIDE',
            beneficiaire: l.ordre || p.titre, justificatif: ref || '—'
          });
        });
        const toutes = lignesDuPlan(planId);
        if (b) b.deblocage = toutes.every(x => x.statut === 'EXECUTE') ? 'DEBLOQUE' : 'PARTIEL';
        // première exécution : le dossier entre en phase décaissement / suivi terrain
        if (num === Math.min(...toutes.map(l => l.num)) && (p.statut === 'VALIDATION' || p.statut === 'TRAITEMENT_PF')) avancer(p);
        notify('LIGNE_EXECUTEE', {
          titre: `Numéro ${num} exécuté — ${p.code}`, icone: 'money', cls: 'gr', projet_id: p.id,
          msg: `${grp.length} ligne(s) · ${money(total)} décaissé le ${date}.`
        });
        toast(`Numéro ${num} exécuté`); (apres || vPlansDec)();
      }, true);
    }

    /* rendu d'un numéro (bloc de lignes), avec le bouton correspondant au profil connecté —
       l'autorisation/exécution porte sur le numéro entier, pas sur chaque ligne */
    function numeroHTML(planId, num, lignes, mode) {
      const grp = lignes.filter(l => l.num === num);
      const total = grp.reduce((a, l) => a + l.montant, 0);
      const statut = grp.every(l => l.statut === 'EXECUTE') ? 'EXECUTE' : (grp.every(l => ['AUTORISE', 'EXECUTE'].includes(l.statut)) ? 'AUTORISE' : 'PREVU');
      const cls = statut === 'EXECUTE' ? 'done' : (statut === 'AUTORISE' ? 'auth' : '');
      let btn = '';
      if (mode === 'pf') {
        const ok = peutAutoriserNumero(num, lignes);
        btn = statut === 'PREVU' ? `<button class="btn sm pri" data-authn="${planId}|${num}" ${ok ? '' : 'disabled'} title="${ok ? '' : motifBlocageNumero(num, lignes)}">Autoriser le décaissement</button>` : '';
      } else if (mode === 'agence') {
        btn = peutExecuterNumero(num, lignes) ? `<button class="btn sm grn" data-execn="${planId}|${num}">Exécuter le décaissement</button>` : '';
      }
      const sousLignes = grp.map(l => {
        const modeLbl = l.mode === 'VIREMENT' ? 'Virement' : (l.mode === 'CHEQUE' ? 'Chèque' : '');
        const infos = [l.ordre ? `Prestataire : ${l.ordre}` : '', modeLbl, l.fournisseur_compte ? `Cpte ${l.fournisseur_compte}` : '', l.observations || ''].filter(Boolean).join(' · ');
        const decaisse = l.statut === 'EXECUTE' ? l.montant : 0;
        return `<div class="sub-lgn"><div class="in"><b>${l.libelle}</b><span>${infos || '—'}</span></div>
     <span class="amt pri">${money(l.montant)}</span>
     <span class="amt">décaissé ${money(decaisse)}</span>
     <span class="amt">reste ${money(l.montant - decaisse)}</span></div>`;
      }).join('');
      const g0 = grp[0] || {};
      const detail = [g0.date_prevue ? `prévu le ${g0.date_prevue}` : '',
      g0.date_autorisation ? `autorisé le ${g0.date_autorisation}${g0.justif_autorisation ? ' · ' + g0.justif_autorisation : ''}` : '',
      g0.date_execution ? `exécuté le ${g0.date_execution}${g0.justif_execution ? ' · ' + g0.justif_execution : ''}` : ''].filter(Boolean).join(' · ');
      return `<div class="lgn-grp ${cls}"><div class="lgn"><div class="num">${num}</div>
   <div class="in"><b>Numéro ${num} — ${grp.length} ligne(s)</b><span>${detail || '—'}</span></div>
   <span class="amt">${money(total)}</span>
   ${badge(...(LIGNE_STATUT[statut] || [statut, 'gy']))}${btn}</div>
   ${sousLignes}</div>`;
    }
    /* ligne de total en bas du plan, exigée par le modèle papier */
    function totalHTML(L) {
      const total = L.reduce((a, l) => a + l.montant, 0);
      const decaisse = L.filter(l => l.statut === 'EXECUTE').reduce((a, l) => a + l.montant, 0);
      return `<div class="lgn total"><div class="num">Σ</div><div class="in"><b>TOTAL</b><span>décaissé ${money(decaisse)}</span></div><span class="amt">RESTE À DÉCAISSER : ${money(total - decaisse)}</span></div>`;
    }
    /* attache les boutons data-authn / data-execn (format "planId|num") d'un conteneur donné */
    function wireNumeroButtons(host, apres) {
      host.querySelectorAll('[data-authn]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.authn.split('|'); autoriserNumero(pid, +n, apres); });
      host.querySelectorAll('[data-execn]').forEach(b => b.onclick = () => { const [pid, n] = b.dataset.execn.split('|'); executerNumero(pid, +n, apres); });
    }

    /* barre de la chaîne de validation */
    function chainHTML(pl) {
      const ch = chaineDe(pl);
      return `<div class="chain">${ch.map((rc, i) => {
        let cls = '';
        if (pl.statut === 'TRANSMIS_PF') cls = 'done';
        else if (pl.statut === 'AJOURNE' && i === pl.cran) cls = 'ko';
        else if (pl.statut === 'EN_VALIDATION') { cls = i < pl.cran ? 'done' : (i === pl.cran ? 'cur' : ''); }
        else if (pl.statut === 'BROUILLON') cls = i === 0 ? 'cur' : '';
        return `<div class="step ${cls}" title="${CHAINE_LIB[rc] || rc}"><span class="n">${i + 1}</span><b>${rc}</b></div>`;
      }).join('')}<div class="step ${pl.statut === 'TRANSMIS_PF' ? 'done' : ''}" title="Partenaire financier"><span class="n">${ic('build')}</span><b>PF</b></div></div>`;
    }

    /* ---- écran des plans de décaissement ---- */
    function vPlansDec() {
      const rc = roleCode();
      const tous = DB.plans_decaissement.filter(pl => inScope('plans_decaissement', pl));
      const aValider = tous.filter(pl => validateurAttendu(pl) === rc);
      const miens = tous.filter(pl => pl.saisi_par === SESSION.id || pl.statut === 'BROUILLON' || pl.statut === 'AJOURNE');
      const defaut = aValider.length ? 'valider' : (can('plans_dec', 'c') ? 'saisie' : 'tous');
      const tab = window._pltab || defaut;
      setTop("Plans de décaissement", "Saisie en agence ou à la Direction, validation hiérarchique puis autorisation du partenaire.",
        `${ic('money')} <b>Circuit de financement</b>`,
        can('plans_dec', 'c') ? `<button class="btn pri" id="newPlan">${ic('plus')}Nouveau plan</button>` : '');
      const bar = el(`<div class="tabs">
   <button data-t="valider" class="${tab === 'valider' ? 'on' : ''}">À valider <span class="cnt">${aValider.length}</span></button>
   ${can('plans_dec', 'c') ? `<button data-t="saisie" class="${tab === 'saisie' ? 'on' : ''}">Saisie en cours <span class="cnt">${miens.length}</span></button>` : ''}
   <button data-t="tous" class="${tab === 'tous' ? 'on' : ''}">Tous les plans <span class="cnt">${tous.length}</span></button>
   <button data-t="exec" class="${tab === 'exec' ? 'on' : ''}">Lignes à exécuter <span class="cnt">${DB.lignes_plan.filter(l => l.statut === 'AUTORISE' && inScope('lignes_plan', l)).length}</span></button>
 </div>`);
      const host = el('<div></div>');
      const wrap = document.createElement('div'); wrap.appendChild(bar); wrap.appendChild(host);
      $('#view').innerHTML = ''; $('#view').appendChild(wrap);
      bar.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { window._pltab = b.dataset.t; vPlansDec(); });
      const np = $('#newPlan'); if (np) np.onclick = () => openNouveauPlan();
      if (tab === 'exec') return host.appendChild(lignesAExecuter());
      const liste = tab === 'valider' ? aValider : (tab === 'saisie' ? miens : tous);
      host.appendChild(listePlans(liste, tab === 'valider' ? "Aucun plan n'attend votre décision" : "Aucun plan de décaissement", tab === 'valider'));
    }

    /* sélection multiple, réservée à l'onglet « À valider » — Ajourner reste une action individuelle,
       chaque renvoi devant garder son propre motif */
    function listePlans(liste, vide, bulk, rerender) {
      rerender = rerender || vPlansDec;
      const sel = window._plsel || (window._plsel = new Set());
      if (bulk) { const ids = new Set(liste.map(pl => pl.id));[...sel].forEach(id => { if (!ids.has(id)) sel.delete(id); }); }
      const selectionnables = bulk ? liste.filter(pl => { const p = DB.projets.find(x => x.id === pl.projet_id); return p && !p.gele; }) : [];
      const barreSel = (bulk && selectionnables.length) ? `<div class="card" style="margin-bottom:14px"><div class="bd" style="display:flex;flex-direction:column;gap:10px">
   <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
     <button class="btn sm" id="plAll">${sel.size === selectionnables.length ? 'Tout désélectionner' : 'Tout sélectionner'}</button>
     <span class="tmuted" style="font-size:12.5px">${sel.size} sélectionné(s) sur ${selectionnables.length}</span>
   </div>
   <div class="field" style="margin:0"><label>Observation (facultatif, appliquée à tous les plans sélectionnés)</label><textarea id="plMotif" rows="2"></textarea></div>
   <button class="btn grn" id="plValiderSel" style="align-self:flex-start" ${sel.size ? '' : 'disabled'}>${ic('check')}Valider la sélection (${sel.size})</button>
 </div></div>`: '';
      const host = el(`<div>${barreSel}${liste.map(pl => {
        const p = DB.projets.find(x => x.id === pl.projet_id); if (!p) return '';
        const L = lignesDuPlan(pl.id); const tot = L.reduce((a, l) => a + l.montant, 0);
        const att = validateurAttendu(pl);
        return `<div class="card" style="margin-bottom:14px"><div class="hd">
     ${(bulk && !p.gele) ? `<input type="checkbox" class="plsel" value="${pl.id}" ${sel.has(pl.id) ? 'checked' : ''} style="margin-right:6px;width:16px;height:16px">` : ''}
     <h3>${p.code} — ${p.titre}</h3><div class="sp"></div>
     ${p.gele ? badge('Prêt annulé', 'rd') : ''}
     ${badge(...(PLAN_STATUT[pl.statut] || [pl.statut, 'gy']))}
     <button class="btn sm ghost" data-exp-plan="${p.id}" title="Exporter le plan de décaissement">${ic('dl')} Exporter</button>
      <button class="btn sm" data-open="${pl.id}">Ouvrir ${ic('chev')}</button>
   </div><div class="bd">
     <div class="meta" style="margin-bottom:10px">
       <span class="m">${ref('jeunes', p.jeune_id)}</span>
       <span class="m">${ref('agences', p.agence_id)}</span>
       <span class="m">Voie <b>${pl.voie === 'DIRECTION' ? 'Direction' : 'Agence'}</b></span>
       <span class="m">${L.length} ligne(s) · <b class="mono">${money(tot)}</b></span>
       <span class="m">Bénéficiaire <b>${pl.valide_benef ? 'validé' : 'en attente'}</b></span>
       ${att ? `<span class="m" style="background:var(--orange-soft);color:var(--orange-deep);border-color:transparent">En attente de ${CHAINE_LIB[att] || att}</span>` : ''}
     </div>
     ${chainHTML(pl)}
   </div></div>`;
      }).join('') || `<div class="empty">${ic('money')}<b>${vide}</b></div>`}</div>`);
      host.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openPlan(b.dataset.open));
      host.querySelectorAll('[data-exp-plan]').forEach(b => b.onclick = e => { e.stopPropagation(); exporterPlanDecaissement(b.dataset.expPlan); });
      if (bulk) {
        host.querySelectorAll('.plsel').forEach(c => c.onchange = () => { c.checked ? sel.add(c.value) : sel.delete(c.value); rerender(); });
        const all = host.querySelector('#plAll'); if (all) all.onclick = () => {
          if (sel.size === selectionnables.length) sel.clear(); else selectionnables.forEach(pl => sel.add(pl.id));
          rerender();
        };
        const vs = host.querySelector('#plValiderSel'); if (vs) vs.onclick = () => validerPlansEnMasse(host.querySelector('#plMotif').value.trim(), rerender);
      }
      return host;
    }

    /* validation groupée des plans cochés — même déroulé que « Valider » individuellement,
       appliqué à chaque plan sélectionné avec une observation commune (facultative) */
    function validerPlansEnMasse(motif, rerender) {
      rerender = rerender || vPlansDec;
      const sel = window._plsel || new Set();
      const rc = roleCode();
      const ids = [...sel].filter(id => {
        const pl = DB.plans_decaissement.find(x => x.id === id); if (!pl) return false;
        const p = DB.projets.find(x => x.id === pl.projet_id);
        return p && !p.gele && validateurAttendu(pl) === rc;
      });
      if (!ids.length) { toast('Sélectionnez au moins un plan'); return; }
      ids.forEach(id => appliquerValidation(DB.plans_decaissement.find(x => x.id === id), motif));
      sel.clear();
      toast(`${ids.length} plan(s) validé(s)`); rerender();
    }

    /* numéros autorisés par le partenaire, en attente d'exécution par l'agence — regroupés par (plan, numéro) */
    function lignesAExecuter() {
      const L = DB.lignes_plan.filter(l => l.statut === 'AUTORISE' && inScope('lignes_plan', l));
      const groupes = {};
      L.forEach(l => { const k = l.plan_id + '|' + l.num; (groupes[k] = groupes[k] || { plan_id: l.plan_id, num: l.num, lignes: [] }).lignes.push(l); });
      const items = Object.values(groupes);
      const peut = can('plans_dec', 'e');
      const host = el(`<div class="card"><div class="hd"><h3>Numéros autorisés par le partenaire</h3><div class="sp"></div>${badge(items.length, 'am')}</div><div class="bd">
   ${items.map(g => {
        const pl = DB.plans_decaissement.find(x => x.id === g.plan_id); const p = DB.projets.find(x => x.id === pl.projet_id);
        const total = g.lignes.reduce((a, l) => a + l.montant, 0); const l0 = g.lignes[0];
        return `<div class="lgn auth"><div class="num">${g.num}</div><div class="in"><b>${p.code} — Numéro ${g.num} (${g.lignes.length} ligne(s))</b><span>${p.titre} · autorisé le ${l0.date_autorisation || '—'}${l0.justif_autorisation ? ' · ' + l0.justif_autorisation : ''}</span></div><span class="amt">${money(total)}</span>${peut ? `<button class="btn sm grn" data-execn="${g.plan_id}|${g.num}">Exécuter</button>` : ''}</div>`;
      }).join('') || '<div class="empty">Aucun numéro en attente d\'exécution</div>'}
 </div></div>`);
      wireNumeroButtons(host, vPlansDec);
      return host;
    }

    /* ---- tiroir d'un plan de décaissement ---- */
    function openPlan(id) {
      const pl = DB.plans_decaissement.find(x => x.id === id);
      const p = DB.projets.find(x => x.id === pl.projet_id);
      const j = DB.jeunes.find(x => x.id === p.jeune_id);
      const L = lignesDuPlan(pl.id); const tot = L.reduce((a, l) => a + l.montant, 0);
      // le bouton d'ajout disparaît une fois le montant du crédit atteint par les lignes déjà saisies
      const plafondPlan = (DB.budgets.find(b => b.projet_id === p.id) || {}).montant || p.montant;
      const restePlan = Math.max(0, plafondPlan - tot);
      const rc = roleCode();
      // l'administrateur consulte le plan (mode lecture) sans pouvoir autoriser/exécuter à la place du circuit
      const mode = rc === 'PF' ? 'pf' : (['CAR', 'CIP', 'AC', 'AGENT_DIR', 'CSFM'].includes(rc) ? 'agence' : 'lecture');
      const estSaisisseur = (pl.saisi_par === SESSION.id) || (pl.voie === 'AGENCE' ? ['CIP', 'AC'].includes(rc) : rc === 'AGENT_DIR');
      const peutSoumettre = estSaisisseur && ['BROUILLON', 'AJOURNE'].includes(pl.statut) && !p.gele;
      const monTour = validateurAttendu(pl) === rc && !p.gele;
      const hist = DB.validations.filter(v => v.plan_id === pl.id);
      const F = (k, v) => `<div class="f"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      const ov = el(`<div class="drawer-ov"></div>`);
      const dr = el(`<div class="drawer">
   <div class="dh" style="display:flex;align-items:center;gap:12px"><div>
     <div style="font-size:11px;color:var(--slate)"><span class="mono">${p.code}</span> · plan de décaissement · voie ${pl.voie === 'DIRECTION' ? 'Direction' : 'Agence'}</div>
     <h1 style="font-size:17px">${p.titre}</h1>
     <div style="font-size:12px;color:var(--slate)">${j.prenoms} ${j.nom} · ${ref('agences', p.agence_id)}</div>
   </div><div class="sp" style="flex:1"></div>${badge(...(PLAN_STATUT[pl.statut] || [pl.statut, 'gy']))}<button class="x">${ic('x')}</button></div>
   <div class="db">
     ${p.gele ? `<div class="gel-banner">${ic('lock')} Prêt annulé — toute action est gelée sur ce dossier${p.motif_gel ? ' (' + p.motif_gel + ')' : ''}.</div>` : ''}
     <div class="sect-t">Chaîne de validation</div>
     ${chainHTML(pl)}
     <div class="dl" style="margin-top:14px">
       ${F("Chargé de Suivi et Encadrement Agence Régionale", ref('personnels', pl.saisi_par))}${F("Point focal banque/IMF", pointFocalBanque(p))}
       ${F("Créé le", pl.cree || '—')}
       ${F("Validation du bénéficiaire", pl.valide_benef ? badge('✔ Validé depuis l\'appli mobile', 'gr') : badge('En attente', 'am'))}
       ${F("Plan signé (PDF)", pl.fichier_signe ? `${ic('doc')} ${pl.fichier_signe}` : '—')}
       ${F("Montant total du plan", `<b class="mono">${money(tot)}</b>`)}${F("Montant du crédit", money((DB.budgets.find(b => b.projet_id === p.id) || {}).montant || p.montant))}
     </div>
     ${pl.note ? `<div class="sect-t">Note / observations</div><p style="margin:0;font-size:13px;color:var(--slate)">${pl.note}</p>` : ''}
     <div class="sect-t">Lignes de décaissement (${L.length})</div>
     ${numerosDuPlan(pl.id).map(num => numeroHTML(pl.id, num, L, p.gele ? 'lecture' : mode)).join('') || '<p style="color:var(--slate);font-size:13px;margin:0">Aucune ligne saisie.</p>'}
     ${L.length ? totalHTML(L) : ''}
     ${(peutSoumettre && restePlan > 0) ? `<div style="margin-top:12px"><button class="btn sm" id="addLigne">${ic('plus')}Ajouter une ligne</button></div>` : ''}
     ${(peutSoumettre && restePlan > 0 && L.length) ? `<p style="margin:12px 0 0;color:var(--orange-deep);font-size:12px">${ic('flag')} Il reste ${money(restePlan)} à répartir en lignes avant de pouvoir soumettre le plan à la validation.</p>` : ''}
     ${(peutSoumettre && restePlan <= 0 && L.length) ? `<p style="margin:12px 0 0;color:var(--slate);font-size:12px">${ic('check')} Montant du crédit atteint — aucune ligne supplémentaire ne peut être ajoutée.</p>` : ''}
     ${hist.length ? `<div class="sect-t">Historique des décisions</div>${hist.map(v => `<div class="obs-i"><b>${CHAINE_LIB[v.role_code] || v.role_code} — ${ref('personnels', v.acteur_id)}</b> <em>${v.date}</em><p>${badge(v.decision === 'VALIDE' ? 'Validé' : 'Ajourné', v.decision === 'VALIDE' ? 'gr' : 'rd')} ${v.motif || ''}</p></div>`).join('')}` : ''}
   </div>
   <div class="dfoot">
     <button class="btn" data-close>Fermer</button>
     <button class="btn ghost" data-proj>${ic('folder')} Voir le dossier</button>
     <button class="btn ghost" data-export>${ic('dl')} Exporter</button>
     ${(peutSoumettre && restePlan <= 0) ? `<button class="btn pri" data-soum>${ic('check')}Soumettre à la validation</button>` : ''}
     ${monTour ? `<button class="btn grn" data-val>${ic('check')}Valider</button><button class="btn danger" data-ajr>Ajourner</button>` : ''}
   </div>
 </div>`);
      $('#layer').appendChild(ov); $('#layer').appendChild(dr);
      const close = () => closeLayer(); ov.onclick = close; dr.querySelector('.x').onclick = close; dr.querySelector('[data-close]').onclick = close;
      dr.querySelector('[data-proj]').onclick = () => { close(); openProjet(p.id); };
      dr.querySelector('[data-export]').onclick = () => exporterPlanDecaissement(p.id);
      dr.querySelectorAll('[data-authn]').forEach(b => b.onclick = () => { close(); const [pid, n] = b.dataset.authn.split('|'); autoriserNumero(pid, +n, () => openPlan(id)); });
      dr.querySelectorAll('[data-execn]').forEach(b => b.onclick = () => { close(); const [pid, n] = b.dataset.execn.split('|'); executerNumero(pid, +n, () => openPlan(id)); });
      const al = dr.querySelector('#addLigne'); if (al) al.onclick = () => { close(); openLigneForm(pl.id, () => openPlan(id)); };
      const sb = dr.querySelector('[data-soum]'); if (sb) sb.onclick = () => { close(); soumettrePlan(pl); };
      const vb = dr.querySelector('[data-val]'); if (vb) vb.onclick = () => { close(); deciderPlan(pl, 'VALIDE'); };
      const ab = dr.querySelector('[data-ajr]'); if (ab) ab.onclick = () => { close(); deciderPlan(pl, 'AJOURNE'); };
    }

    /* ajout d'une ligne au plan */
    function openLigneForm(planId, apres) {
      const L = lignesDuPlan(planId);
      const pl = DB.plans_decaissement.find(x => x.id === planId);
      const p = DB.projets.find(x => x.id === pl.projet_id);
      const b = DB.budgets.find(x => x.projet_id === p.id);
      // les lignes du plan ne doivent jamais dépasser le montant du crédit accordé au dossier
      const plafond = (b && b.montant) || p.montant;
      const dejaSaisi = L.reduce((a, l) => a + l.montant, 0);
      const reste = Math.max(0, plafond - dejaSaisi);
      const ov = el(`<div class="ov"><div class="modal" style="max-width:520px"><div class="mh"><h3>Ajouter une ligne de décaissement</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <p style="margin:0 0 12px;color:var(--slate);font-size:12.5px">Montant du crédit <b class="mono">${money(plafond)}</b> · déjà saisi <b class="mono">${money(dejaSaisi)}</b> · reste disponible <b class="mono" style="color:var(--orange-deep)">${money(reste)}</b></p>
   <div class="frow"><div class="field half"><label>N°</label><input id="lNum" type="number" value="${L.length + 1}"></div>
     <div class="field half"><label>Montant (F) *</label><input id="lMt" type="number" placeholder="0" max="${reste}"></div></div>
   <div class="field"><label>Objet de la ligne *</label><input id="lLib" placeholder="Frais d'actes de sûreté"></div>
   <div class="frow"><div class="field half"><label>Date prévue</label><input id="lDate" type="date"></div>
     <div class="field half"><label>Mode de décaissement</label><select id="lMode"><option value="">—</option><option value="VIREMENT">Virement</option><option value="CHEQUE">Chèque</option></select></div></div>
   <div class="sect-t" style="margin:4px 0">Prestataire / fournisseur</div>
   <div class="field"><label>Ordre (prestataire ou banque)</label><input id="lOrdre" placeholder="Nom du prestataire ou de la banque"></div>
   <div class="frow"><div class="field half"><label>N° compte bancaire</label><input id="lCpte" placeholder="CI93 …"></div>
     <div class="field half"><label>Contact</label><input id="lContact" placeholder="+225 …"></div></div>
   <div class="field"><label>Observations</label><textarea id="lObs" rows="2"></textarea></div>
   <p style="margin:0;color:var(--slate);font-size:11.5px">Utilisez le même N° pour plusieurs lignes (ex. numéro 1 = frais d'actes de sûreté + assurance vie + frais bancaires) : le partenaire les autorisera et l'agence les exécutera en un seul bloc.</p>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}Ajouter</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const lib = ov.querySelector('#lLib').value.trim(), mt = +ov.querySelector('#lMt').value || 0;
        if (!lib || !mt) { toast("L'objet et le montant sont requis"); return; }
        if (mt > reste) { toast(`Le montant dépasse le reste disponible sur le plan (${money(reste)})`); return; }
        DB.lignes_plan.push({
          id: uid('lp'), plan_id: planId, num: +ov.querySelector('#lNum').value || L.length + 1,
          libelle: lib, montant: mt, date_prevue: ov.querySelector('#lDate').value, statut: 'PREVU',
          mode: ov.querySelector('#lMode').value, ordre: ov.querySelector('#lOrdre').value.trim(),
          fournisseur_compte: ov.querySelector('#lCpte').value.trim(), fournisseur_contact: ov.querySelector('#lContact').value.trim(),
          observations: ov.querySelector('#lObs').value.trim()
        });
        close(); toast('Ligne ajoutée'); (apres || vPlansDec)();
      };
    }

    /* création d'un plan pour un dossier approuvé et imputé */
    /* depuis un dossier : ouvre son plan de décaissement, ou propose de le créer */
    function ouvrirPlanDuDossier(pid) {
      const pl = planDuProjet(pid);
      if (pl) return openPlan(pl.id);
      openNouveauPlan(pid);
    }
    function openNouveauPlan(prechoix) {
      // n'accepte que les dossiers ayant atteint l'étape « Plan de décaissement » de leur parcours —
      // pour MPE/MEPS cela suppose l'imputation par le CSFM déjà faite (étape 3 du compte rendu)
      const eligibles = DB.projets.filter(p => !p.gele && !planDuProjet(p.id) && inScope('projets', p) && p.statut === 'PLAN_DECAISSEMENT' &&
        (DB.budgets.find(b => b.projet_id === p.id) || {}).approbation === 'APPROUVE' && p.dispositif_id !== 'wf-agr');
      if (!eligibles.length) { toast("Aucun dossier imputé n'attend un plan de décaissement"); return; }
      const ov = el(`<div class="ov"><div class="modal" style="max-width:520px"><div class="mh"><h3>Nouveau plan de décaissement</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <div class="field"><label>Dossier *</label><select id="npProj">${eligibles.map(p => `<option value="${p.id}" ${p.id === prechoix ? 'selected' : ''}>${p.code} — ${p.titre} (${ref('jeunes', p.jeune_id)})</option>`).join('')}</select></div>
   <div class="field"><label>Note / observations</label><textarea id="npNote" rows="3" placeholder="Conditions de décaissement, échelonnement retenu…"></textarea></div>
   <div class="field"><label>Plan signé par le bénéficiaire (PDF)</label><input id="npFile" placeholder="plan_decaissement_signe.pdf"></div>
   <div class="imp-modele">${ic('doc')} Modèle « plan de décaissement » <em>— à fournir par l'AEJ</em></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}Créer le plan</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const pid = ov.querySelector('#npProj').value; const p = DB.projets.find(x => x.id === pid);
        const pl = {
          id: uid('pd'), projet_id: pid, voie: p.gere_par === 'DIRECTION' ? 'DIRECTION' : 'AGENCE', saisi_par: SESSION.id,
          note: ov.querySelector('#npNote').value.trim(), fichier_signe: ov.querySelector('#npFile').value.trim(),
          valide_benef: false, statut: 'BROUILLON', cran: 0, cree: new Date().toISOString().slice(0, 10)
        };
        DB.plans_decaissement.push(pl);
        notify('PLAN_CREE', {
          titre: `Plan de décaissement saisi — ${p.code}`, icone: 'money', cls: 'bl', projet_id: pid, agence_id: p.agence_id,
          msg: `${p.titre} — plan partagé au bénéficiaire pour validation depuis l'application mobile.`
        });
        close(); toast('Plan créé — ajoutez les lignes de décaissement'); openPlan(pl.id);
      };
    }

    /* soumission du plan à la chaîne de validation */
    function soumettrePlan(pl) {
      const p = DB.projets.find(x => x.id === pl.projet_id); if (estGele(p, true)) return;
      const L = lignesDuPlan(pl.id);
      if (!L.length) { toast('Ajoutez au moins une ligne de décaissement'); return; }
      // le plan ne peut être soumis tant que ses lignes ne couvrent pas tout le montant du crédit
      const plafondSoum = (DB.budgets.find(b => b.projet_id === p.id) || {}).montant || p.montant;
      const totalSoum = L.reduce((a, l) => a + l.montant, 0);
      if (totalSoum < plafondSoum) { toast(`Toutes les lignes doivent être renseignées avant soumission — il reste ${money(plafondSoum - totalSoum)} à répartir sur le montant du crédit`); return; }
      const ch = chaineDe(pl);
      confirmValider("Soumettre le plan",
        `Le plan de ${p.code} (${L.length} ligne(s), ${money(L.reduce((a, l) => a + l.montant, 0))}) sera soumis à ${CHAINE_LIB[ch[1]] || ch[1]}, puis suivra la chaîne ${ch.slice(1).join(' → ')} avant transmission au partenaire financier.` +
        (pl.valide_benef ? '' : ' <b>Le bénéficiaire n\'a pas encore validé le plan depuis l\'application mobile.</b>'),
        "Soumettre", () => {
          pl.statut = 'EN_VALIDATION'; pl.cran = 1;
          if (p.statut === 'PLAN_DECAISSEMENT') avancer(p);
          notify('PLAN_SOUMIS', {
            titre: `Plan de décaissement soumis — ${p.code}`, icone: 'check', cls: 'or', projet_id: p.id, agence_id: p.agence_id,
            msg: `En attente de la décision de ${CHAINE_LIB[ch[1]] || ch[1]}.`
          });
          toast('Plan soumis à la validation'); route();
        });
    }

    /* décision d'un maillon de la chaîne */
    /* mutation d'une validation « VALIDE » — partagée entre la décision individuelle (deciderPlan)
       et la validation groupée (validerPlansEnMasse) */
    function appliquerValidation(pl, motif) {
      const p = DB.projets.find(x => x.id === pl.projet_id);
      const rc = roleCode(); const ch = chaineDe(pl);
      DB.validations.push({
        id: uid('vd'), plan_id: pl.id, role_code: rc, acteur_id: SESSION.id, decision: 'VALIDE', motif,
        date: new Date().toISOString().slice(0, 10)
      });
      pl.cran++;
      if (pl.cran >= ch.length) {
        pl.statut = 'TRANSMIS_PF';
        if (p.statut === 'VALIDATION') avancer(p);
        notify('PLAN_TRANSMIS_PF', {
          titre: `Plan transmis au partenaire — ${p.code}`, icone: 'build', cls: 'gr', projet_id: p.id,
          msg: `Validé par toute la chaîne — le partenaire financier peut autoriser les lignes de décaissement.`
        });
      } else {
        notify('PLAN_VALIDE', {
          titre: `Plan validé par ${rc} — ${p.code}`, icone: 'check', cls: 'bl', projet_id: p.id, agence_id: p.agence_id,
          msg: `En attente de ${CHAINE_LIB[ch[pl.cran]] || ch[pl.cran]}.`
        });
      }
    }
    function deciderPlan(pl, decision) {
      const p = DB.projets.find(x => x.id === pl.projet_id); if (estGele(p, true)) return;
      const rc = roleCode(); const ch = chaineDe(pl);
      // chaque cran de la chaîne ne peut être franchi que par le profil attendu
      const att = validateurAttendu(pl);
      if (att !== rc) { toast(att ? `Ce plan attend la décision de ${CHAINE_LIB[att] || att}` : "Ce plan n'est pas en cours de validation"); return; }
      const ov = el(`<div class="ov"><div class="modal" style="max-width:460px"><div class="mh"><h3>${decision === 'VALIDE' ? 'Valider' : 'Ajourner'} le plan — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <p style="margin:0 0 12px;color:var(--slate);font-size:13px">Vous intervenez en tant que <b>${CHAINE_LIB[rc] || rc}</b>.${decision === 'VALIDE' ? (pl.cran >= ch.length - 1 ? ' Cette validation transmet le dossier au partenaire financier.' : ` Le dossier passera ensuite à ${CHAINE_LIB[ch[pl.cran + 1]] || ch[pl.cran + 1]}.`) : ' Le plan retournera au saisisseur pour correction.'}</p>
   <div class="field"><label>${decision === 'VALIDE' ? 'Observation (facultatif)' : 'Motif de l\'ajournement *'}</label><textarea id="dMotif" rows="3"></textarea></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn ${decision === 'VALIDE' ? 'grn' : 'danger'}" data-s>${ic('check')}${decision === 'VALIDE' ? 'Valider' : 'Ajourner'}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const motif = ov.querySelector('#dMotif').value.trim();
        if (decision === 'AJOURNE' && !motif) { toast("Le motif de l'ajournement est requis"); return; }
        if (decision === 'AJOURNE') {
          DB.validations.push({
            id: uid('vd'), plan_id: pl.id, role_code: rc, acteur_id: SESSION.id, decision, motif,
            date: new Date().toISOString().slice(0, 10)
          });
          pl.statut = 'AJOURNE'; pl.cran = 0;
          notify('PLAN_AJOURNE', {
            titre: `Plan ajourné — ${p.code}`, icone: 'flag', cls: 'rd', projet_id: p.id, agence_id: p.agence_id,
            msg: `${CHAINE_LIB[rc] || rc} : ${motif}`
          });
          toast('Plan ajourné — retour au saisisseur');
        } else {
          appliquerValidation(pl, motif);
          toast(pl.statut === 'TRANSMIS_PF' ? 'Plan validé et transmis au partenaire financier' : `Validé — transmis à ${ch[pl.cran]}`);
        }
        close(); route();
      };
    }

    /* ---- onglets du partenaire : décaissements, remboursements, garanties ---- */
    function pfDecaissements() {
      // seul le partenaire financier saisit ou autorise un décaissement — les autres profils consultent
      const canE = can('pf_espace', 'e');

   <p style="margin:0 0 12px;color:var(--slate);font-size:12.5px">Le guichet AGR ne comporte pas de plan de décaissement : vous saisissez directement les lignes avec leurs justificatifs.</p>
   ${agr.map(p => {
        const b = DB.budgets.find(x => x.projet_id === p.id);
        const faits = DB.decaissements.filter(d => d.projet_id === p.id);
        const verse = faits.reduce((a, d) => a + d.montant, 0);

       <div class="in"><b>${p.code} — ${p.titre}</b><span>${ref('jeunes', p.jeune_id)} · ${ref('agences', p.agence_id)} · ${faits.length} décaissement(s) · ${money(verse)} sur ${money(b.montant)}</span></div>
       <div style="display:flex;gap:6px">
       ${solde ? badge('Soldé', 'gr') : (canE ? `<button class="btn sm pri" data-agr="${p.id}">Saisir un décaissement</button>` : '')}
       ${(canE && verse > 0) ? `<button class="btn sm" data-remb="${p.id}">${ic('repay')}Gérer les remboursements</button>` : ''}
       </div></div>`;
      }).join('')}
 </div></div>`: '';
      const host = el(`<div>${blocAgr}${plans.map(pl => {
        const p = DB.projets.find(x => x.id === pl.projet_id); const L = lignesDuPlan(pl.id);
        return `<div class="card" style="margin-bottom:14px"><div class="hd"><h3>${p.code} — ${p.titre}</h3><div class="sp"></div>
     ${p.gele ? badge('Prêt annulé', 'rd') : ''}<span class="tmuted" style="font-size:12.5px">${ref('agences', p.agence_id)}</span></div><div class="bd">
     <p style="margin:0 0 12px;color:var(--slate);font-size:12.5px">Autorisez les numéros conformément au plan validé — chaque numéro regroupe une ou plusieurs lignes. Le numéro suivant ne devient autorisable qu'une fois le précédent exécuté par l'agence régionale.</p>
     ${numerosDuPlan(pl.id).map(num => numeroHTML(pl.id, num, L, (p.gele || !canE) ? 'lecture' : 'pf')).join('')}
     ${L.length ? totalHTML(L) : ''}
   </div></div>`;
      }).join('') || `<div class="card"><div class="hd"><h3>Plans de décaissement transmis</h3></div><div class="bd"><div class="empty">${ic('money')}<b>Aucun plan transmis</b><span>Les guichets MPE, MEPS et Start-Up décaissent sur la base d'un plan validé par l'AEJ.</span></div></div></div>`}</div>`);
      wireNumeroButtons(host, vPfEspace);
      host.querySelectorAll('[data-agr]').forEach(b => b.onclick = () => openDecaissementAgr(b.dataset.agr));
      host.querySelectorAll('[data-remb]').forEach(b => b.onclick = () => gererRemboursements(b.dataset.remb));
      // journal complet des décaissements saisis, avec import de masse
      const barre = el(`<div class="pgt" style="margin-top:20px">
   <span class="count">Décaissements enregistrés</span><div class="sp"></div>
   ${roleCode() === 'PF' ? `<button class="btn sm" id="dcImp">${ic('dl')}Importer les décaissements (Excel)</button>` : ''}</div>`);
      const dcImp = barre.querySelector('#dcImp'); if (dcImp) dcImp.onclick = importDecaissements;
      host.appendChild(barre);
      host.appendChild(resourceView('decaissements'));
      return host;
    }

    /* Import en masse des décaissements — clé de rapprochement : le N° de dossier. */
    function importDecaissements() {
      if (roleCode() !== 'PF') { toast("Action réservée au partenaire financier"); return; }
      const eligibles = DB.projets.filter(p => !p.gele && (DB.budgets.find(b => b.projet_id === p.id) || {}).approbation === 'APPROUVE' && inScope('projets', p));
      if (!eligibles.length) { toast("Aucun dossier approuvé"); return; }
      openImportExcel({
        titre: "Importer les décaissements",
        soustitre: "Chaque ligne du fichier est rapprochée du dossier par son N° de dossier. Les décaissements importés alimentent le suivi financier et le tableau de bord.",
        colonnes: ["N° de dossier", "N° de décaissement", "Date", "Montant", "Bénéficiaire", "Justificatif"],
        modele: "Fichier Excel des décaissements",
        lignes: eligibles.map(p => {
          const b = DB.budgets.find(x => x.projet_id === p.id);
          const verse = DB.decaissements.filter(d => d.projet_id === p.id).reduce((a, d) => a + d.montant, 0);
          const reste = Math.max(0, b.montant - verse);
          return {
            titre: `${p.code} — ${p.titre}`,
            detail: `${ref('jeunes', p.jeune_id)} · crédit ${money(b.montant)} · déjà versé ${money(verse)} · reste ${money(reste)}`,
            tag: reste ? 'À décaisser' : 'Soldé', tagCls: reste ? 'am' : 'gr', _p: p, _b: b, _reste: reste
          };
        }),
        libelleAction: "Importer les décaissements",
        onRows: rows => {
          let n = 0;
          rows.forEach(r => {
            if (!r._reste) return;                       // dossier déjà soldé
            const faits = DB.decaissements.filter(d => d.projet_id === r._p.id);
            DB.decaissements.push({
              id: uid('dc'), budget_id: r._b.id, projet_id: r._p.id, tranche: faits.length + 1,
              montant: r._reste, date: new Date().toISOString().slice(0, 10),
              reference: 'VIR-' + Math.floor(Math.random() * 90000 + 10000),
              beneficiaire: r._p.titre, justificatif: 'bordereau_import.pdf', statut: 'VALIDE'
            });
            r._b.deblocage = 'DEBLOQUE';
            // pour l'AGR, le premier décaissement ouvre la phase de suivi terrain
            if (!faits.length && r._p.dispositif_id === 'wf-agr' && r._p.statut === 'DECAISSEMENT') avancer(r._p);
            n++;
          });
          if (!n) { toast('Tous les dossiers sélectionnés sont déjà soldés'); return; }
          notify('DECAISSEMENTS_IMPORTES', {
            titre: `${n} décaissement(s) importé(s)`, icone: 'money', cls: 'gr',
            msg: "Saisis par le partenaire financier — consultables dans le suivi des bénéficiaires."
          });
          toast(n + ' décaissement(s) importé(s)'); vPfEspace();
        }
      });
    }

    function importRemboursements() {
      if (roleCode() !== 'PF') { toast("Action réservée au partenaire financier"); return; }
      const eligibles = DB.projets.filter(p => { const b = DB.budgets.find(x => x.projet_id === p.id); return b && DB.decaissements.some(d => d.budget_id === b.id) && inScope('projets', p); });
      if (!eligibles.length) { toast("Aucun dossier éligible aux remboursements"); return; }
      openImportExcel({
        titre: "Importer les remboursements",
        soustitre: "Chaque ligne est rapprochée du dossier par son N° de dossier. Les échéances importées alimentent le suivi et les listes d'impayés.",
        colonnes: ["N° de dossier", "Date de début", "Date de fin", "Échéance", "Montant dû", "Montant remboursé", "Jours de retard"],
        modele: "Fichier Excel de suivi des remboursements",
        lignes: eligibles.map(p => {
          const b = DB.budgets.find(x => x.projet_id === p.id);
          const ech = Math.round(b.montant / (b.duree_remboursement || 24));
          return { titre: `${p.code} — ${p.titre}`, detail: `échéance mensuelle ${money(ech)} · ${b.duree_remboursement || 24} mois`, _p: p, _m: ech };
        }),
        libelleAction: "Importer les échéances",
        onRows: rows => {
          const d = new Date();
          rows.forEach(r => {
            const b = DB.budgets.find(x => x.projet_id === r._p.id);
            DB.remboursements.push({
              id: uid('rb'), projet_id: r._p.id,
              echeance: new Date(d.getFullYear(), d.getMonth(), 0).toISOString().slice(0, 10),
              date_debut: b.date_ouverture_compte || '', date_fin: '', du: r._m, paye: 0, statut: 'IMPAYE', jours_retard: 0
            });

          notify('REMB_SAISI', {
            titre: "Remboursements mis à jour par le partenaire", icone: 'repay', cls: 'bl',
            msg: `${rows.length} échéance(s) importée(s) — consultables dans la fiche de suivi des bénéficiaires.`
          });
          toast(rows.length + ' échéance(s) importée(s)'); route();
        }
      });
    }

    function rappelerGarantie(pid) {
      const p = DB.projets.find(x => x.id === pid);
      const b = DB.budgets.find(x => x.projet_id === pid) || {};
      const rb = DB.remboursements.filter(r => r.projet_id === pid);
      const reste = rb.reduce((a, r) => a + (r.du - r.paye), 0);
      const ov = el(`<div class="ov"><div class="modal" style="max-width:460px"><div class="mh"><h3>Rappel de garantie — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <p style="margin:0 0 12px;color:var(--slate);font-size:13px">${p.titre} — crédit de <b class="mono">${money(b.montant || p.montant)}</b>, reste dû <b class="mono" style="color:var(--red)">${money(reste)}</b>.</p>
   <div class="frow"><div class="field half"><label>Montant de la garantie appelée (F) *</label><input id="gMt" type="number" value="${Math.max(0, reste)}"></div>
     <div class="field half"><label>Date du rappel *</label><input id="gDate" type="date" value="${new Date().toISOString().slice(0, 10)}"></div></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn danger" data-s>${ic('check')}Enregistrer le rappel</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const mt = +ov.querySelector('#gMt').value || 0; if (!mt) { toast('Le montant est requis'); return; }
        DB.garanties.push({ id: uid('gr'), projet_id: pid, montant_appele: mt, date_rappel: ov.querySelector('#gDate').value, saisi_par: SESSION.id });
        notify('GARANTIE_APPELEE', {
          titre: `Rappel de garantie — ${p.code}`, icone: 'repay', cls: 'rd', projet_id: pid,
          msg: `${money(mt)} appelés par ${ref('organismes', p.organisme_id)} au-delà du 3ᵉ impayé.`
        });
        close(); toast('Rappel de garantie enregistré'); vPfEspace();
      };
    }

      }).join('');
      const wrap = el(`<div>
   <div class="card" style="margin-bottom:16px"><div class="hd"><h3>Dossiers approuvés à imputer</h3><div class="sp"></div>${badge(attente.length, 'am')}</div>

     <div class="bd">${faitsRows || '<div class="empty">Aucun dossier imputé</div>'}</div></div>
 </div>`);

    /* ---- classement des dossiers selon leurs impayés (partagé avec les remboursements) ---- */
    function classerImpayes() {
      const parProjet = {};
      DB.remboursements.filter(r => inScope('remboursements', r)).forEach(r => { (parProjet[r.projet_id] = parProjet[r.projet_id] || []).push(r); });
      const cats = { AJOUR: [], LEGER: [], LOURD: [] };
      Object.entries(parProjet).forEach(([pid, rows]) => {
        const p = DB.projets.find(x => x.id === pid); if (!p) return;
        const nbImp = rows.filter(r => r.statut === 'IMPAYE').length;
        const cat = nbImp === 0 ? 'AJOUR' : (nbImp <= 3 ? 'LEGER' : 'LOURD');
        cats[cat].push({
          pid, nbImp, retard: Math.max(0, ...rows.map(r => r.jours_retard || 0)),
          du: rows.reduce((a, r) => a + r.du, 0), paye: rows.reduce((a, r) => a + r.paye, 0), contentieux: !!p.contentieux
        });
      });
      return cats;
    }

        const rows = items.filter(x => !x.contentieux).map(x => {

          return `<div class="lgn"><div class="num">${ic('folder')}</div>

       ${(peut && amiable) ? `<button class="btn sm" data-act="${p.id}">${ic('plus')}Action amiable</button>` : ''}

     <div class="imp-modele" style="margin:0">${ic('build')} Les recouvrements sont assurés par la société <b>C02CI</b>, qui verse au nom du bénéficiaire <em>— l'interconnexion avec son outil reste à mettre en place</em></div>
