<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEJ · Plateforme des Guichets Opérationnels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --orange: #E7722B;
      --orange-deep: #C85E18;
      --orange-soft: #FBEADE;
      --green: #20A83A;
      --green-deep: #178A2E;
      --green-soft: #E3F6E7;
      --ink: #131C29;
      --ink-2: #1B2736;
      --ink-3: #243244;
      --slate: #5A6B80;
      --slate-2: #8595A8;
      --bg: #F3F5F8;
      --card: #FFFFFF;
      --line: #E5EAF1;
      --line-2: #EEF2F7;
      --red: #D6453B;
      --red-soft: #FBE7E5;
      --amber: #E0A106;
      --amber-soft: #FBF1D6;
      --blue: #2D6BD4;
      --blue-soft: #E5EDFB;
      --shadow: 0 1px 2px rgba(18, 28, 41, .05), 0 6px 20px rgba(18, 28, 41, .06);
      --shadow-lg: 0 12px 40px rgba(18, 28, 41, .18);
      --r: 11px;
      --r-sm: 8px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: Archivo, sans-serif;
      margin: 0;
      letter-spacing: -.01em;
      color: var(--ink)
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px
    }

    ::-webkit-scrollbar-thumb {
      background: #c9d3e0;
      border-radius: 20px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    [hidden] {
      display: none !important
    }

    svg {
      width: 16px;
      height: 16px
    }

    /* ---------- Brand mark ---------- */
    .flag {
      display: inline-flex;
      height: 1em;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .06)
    }

    .flag i {
      display: block;
      width: .42em;
      height: 100%
    }

    .flag i:nth-child(1) {
      background: #F77F00
    }

    .flag i:nth-child(2) {
      background: #fff
    }

    .flag i:nth-child(3) {
      background: #009A4E
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo .mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(150deg, var(--orange), var(--orange-deep));
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 4px 12px rgba(238, 123, 26, .35)
    }

    .logo .mark svg {
      width: 22px;
      height: 22px
    }

    .logo .wm {
      line-height: 1.05
    }

    .logo .wm b {
      font-family: Archivo;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .02em;
      display: block
    }

    .logo .wm b em {
      font-style: italic;
      color: var(--green);
      font-weight: 800
    }

    .logo .wm span {
      font-size: 9.5px;
      letter-spacing: .16em;
      color: var(--slate-2);
      text-transform: uppercase;
      font-weight: 600
    }

    /* ---------- Login ---------- */
    #login {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      z-index: 60
    }

    .login-brand {
      background: radial-gradient(1200px 600px at -10% -10%, #22314a 0, var(--ink) 60%);
      color: #fff;
      position: relative;
      overflow: hidden;
      padding: 52px;
      display: flex;
      flex-direction: column
    }

    .login-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      flex: 1;
      min-height: 0
    }

    .login-brand .stripes {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 14px;
      display: flex;
      flex-direction: column
    }

    .login-brand .stripes b {
      flex: 1
    }

    .login-brand .stripes b:nth-child(1) {
      background: var(--orange)
    }

    .login-brand .stripes b:nth-child(2) {
      background: #fff
    }

    .login-brand .stripes b:nth-child(3) {
      background: var(--green)
    }

    .login-brand .glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(238, 123, 26, .22), transparent 60%);
      right: -160px;
      bottom: -160px
    }

    .login-brand .logo .wm b {
      color: #fff;
      font-size: 17px
    }

    .login-brand .logo .wm span {
      color: rgba(255, 255, 255, .55)
    }

    .login-brand .mark {
      width: 44px;
      height: 44px
    }

    .login-hero h1 {
      color: #fff;
      font-size: 28px;
      line-height: 1.32;
      font-weight: 800;
      max-width: 21ch;
      letter-spacing: .01em
    }

    .login-hero p {
      color: rgba(255, 255, 255, .66);
      max-width: 44ch;
      margin-top: 16px;
      font-size: 15px
    }

    .login-hero .kchips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 26px
    }

    .login-hero .kchips span {
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 30px;
      color: rgba(255, 255, 255, .8)
    }

    .login-foot {
      font-size: 12px;
      color: rgba(255, 255, 255, .4)
    }

    .login-panel {
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px
    }

    .login-card {
      width: 100%;
      max-width: 430px
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 800
    }

    .login-card>p {
      color: var(--slate);
      margin: 6px 0 24px
    }

    .acct {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: .15s
    }

    .acct:hover {
      border-color: var(--orange);
      box-shadow: 0 4px 14px rgba(238, 123, 26, .12);
      transform: translateY(-1px)
    }

    .acct .av {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      font-family: Archivo;
      flex: none;
      font-size: 14px
    }

    .acct .in {
      flex: 1;
      min-width: 0
    }

    .acct .in b {
      font-size: 14px;
      display: block
    }

    .acct .in span {
      font-size: 12px;
      color: var(--slate)
    }

    .acct .go {
      color: var(--slate-2);
      font-size: 18px
    }

    .login-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--slate-2);
      text-align: center
    }

    /* ---------- App shell ---------- */
    #app {
      display: grid;
      grid-template-columns: 250px 1fr;
      grid-template-rows: 100vh;
      overflow: hidden
    }

    .side {
      background: var(--ink);
      color: #cdd7e4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative
    }

    .side::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(var(--orange), var(--orange) 33%, #fff 33%, #fff 66%, var(--green) 66%);
      opacity: .9
    }

    .side .brand {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .07)
    }

    .side .brand .logo .wm b {
      color: #fff
    }

    .side .brand .logo .wm span {
      color: rgba(255, 255, 255, .5)
    }

    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 20px
    }

    .nav .grp {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #5f7086;
      padding: 16px 10px 7px;
      font-weight: 700
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: 9px;
      color: #b7c3d3;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 2px;
      transition: .12s;
      position: relative
    }

    .nav a svg {
      width: 18px;
      height: 18px;
      flex: none;
      opacity: .85
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff
    }

    .nav a.on {
      background: linear-gradient(90deg, rgba(238, 123, 26, .22), rgba(238, 123, 26, .05));
      color: #fff
    }

    .nav a.on::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--orange)
    }

    .nav a .cnt {
      margin-left: auto;
      background: rgba(255, 255, 255, .1);
      color: #dbe4ef;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 20px;
      font-weight: 600
    }

    .side .who {
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      display: flex;
      align-items: center;
      gap: 10px
    }

    .side .who .av {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      flex: none;
      font-family: Archivo
    }

    .side .who .in {
      flex: 1;
      min-width: 0
    }

    .side .who .in b {
      color: #fff;
      font-size: 13px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .side .who .in span {
      font-size: 11px;
      color: #7f8fa4
    }

    .side .who button {
      background: transparent;
      border: none;
      color: #7f8fa4;
      padding: 6px;
      border-radius: 7px
    }

    .side .who button:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff
    }

    .main {
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(243, 245, 248, .86);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 26px;
      display: flex;
      align-items: center;
      gap: 16px
    }

    .top svg {
      width: 16px;
      height: 16px;
      flex: none
    }

    .top .crumb {
      font-size: 12px;
      color: var(--slate);
      display: flex;
      align-items: center;
      gap: 6px
    }

    .top .crumb svg {
      width: 13px;
      height: 13px;
      opacity: .7
    }

    .top .crumb a:hover {
      color: var(--orange-deep)
    }

    .top .crumb b {
      color: var(--ink)
    }

    .top .crumb svg {
      width: 13px;
      height: 13px;
      vertical-align: -2px;
      flex: none
    }

    .top .gsearch svg {
      width: 16px;
      height: 16px;
      flex: none
    }

    .top .maint svg {
      width: 15px;
      height: 15px;
      flex: none
    }

    .meta .m svg {
      width: 13px;
      height: 13px;
      vertical-align: -2px;
      flex: none
    }

    .top h1 {
      font-size: 19px;
      font-weight: 700
    }

    .top .sub {
      color: var(--slate);
      font-size: 12.5px;
      margin-top: 1px
    }

    .top .sp {
      flex: 1
    }

    .top .maint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--amber);
      background: var(--amber-soft);
      padding: 6px 11px;
      border-radius: 8px
    }

    .top .gsearch {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 12px;
      width: 230px;
      color: var(--slate)
    }

    .top .gsearch input {
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      width: 100%
    }

    .content {
      padding: 24px 26px 60px;
      width: 100%;
      overflow-x: auto
    }

    /* ---------- Generic UI ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      transition: .13s
    }

    .btn:hover {
      border-color: #cdd6e2;
      background: #fbfcfe
    }

    .btn svg {
      width: 16px;
      height: 16px
    }

    .btn.pri {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      box-shadow: 0 4px 12px rgba(238, 123, 26, .28)
    }

    .btn.pri:hover {
      background: var(--orange-deep);
      border-color: var(--orange-deep)
    }

    .btn.grn {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    .btn.grn:hover {
      background: var(--green-deep)
    }

    .btn.ghost {
      background: transparent;
      border-color: transparent
    }

    .btn.ghost:hover {
      background: #eef2f7
    }

    .btn.sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px
    }

    .btn.danger {
      color: var(--red);
      border-color: var(--red-soft);
      background: var(--red-soft)
    }

    .btn.danger:hover {
      background: #f7d9d6
    }

    .iconbtn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 8px;
      color: var(--slate);
      transition: .12s
    }

    .iconbtn:hover {
      color: var(--ink);
      border-color: #cdd6e2
    }

    .iconbtn.del:hover {
      color: var(--red);
      border-color: var(--red-soft);
      background: var(--red-soft)
    }

    .iconbtn svg {
      width: 15px;
      height: 15px
    }

    .iconbtn:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow)
    }

    .card .hd {
      padding: 15px 18px;
      border-bottom: 1px solid var(--line-2);
      display: flex;
      align-items: center;
      gap: 12px
    }

    .card .hd h3 {
      font-size: 14.5px;
      font-weight: 700
    }

    .card .hd .sp {
      flex: 1
    }

    .card .bd {
      padding: 18px
    }

    .grid {
      display: grid;
      gap: 16px
    }

    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .g4 {
      grid-template-columns: repeat(4, 1fr)
    }

    @media(max-width:1050px) {
      .g4 {
        grid-template-columns: repeat(2, 1fr)
      }

      .g3 {
        grid-template-columns: 1fr
      }

      .g2 {
        grid-template-columns: 1fr
      }
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px 17px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden
    }

    .kpi .ic {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      margin-bottom: 12px
    }

    .kpi .ic svg {
      width: 19px;
      height: 19px
    }

    .kpi .lab {
      font-size: 12px;
      color: var(--slate);
      font-weight: 500
    }

    .kpi .val {
      font-family: Archivo;
      font-weight: 800;
      font-size: 26px;
      margin-top: 2px;
      letter-spacing: -.02em
    }

    .kpi .val small {
      font-size: 13px;
      color: var(--slate-2);
      font-weight: 600
    }

    .kpi .dt {
      font-size: 11.5px;
      margin-top: 7px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .kpi .dt.up {
      color: var(--green)
    }

    .kpi .dt.dn {
      color: var(--red)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    .tbl-wrap {
      overflow-x: auto;
      border-radius: var(--r)
    }

    th {
      text-align: left;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--slate-2);
      font-weight: 700;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: #fafbfd
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-2);
      font-size: 13px;
      vertical-align: middle
    }

    tbody tr {
      transition: .1s
    }

    tbody tr:hover {
      background: #fafbfe
    }

    tbody tr:last-child td {
      border-bottom: none
    }

    td .act {
      display: flex;
      gap: 6px;
      justify-content: flex-end
    }

    .tprimary {
      font-weight: 600;
      color: var(--ink)
    }

    .tmuted {
      color: var(--slate);
      font-size: 12.5px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap
    }

    .badge.gr {
      background: var(--green-soft);
      color: var(--green-deep)
    }

    .badge.or {
      background: var(--orange-soft);
      color: var(--orange-deep)
    }

    .badge.bl {
      background: var(--blue-soft);
      color: var(--blue)
    }

    .badge.rd {
      background: var(--red-soft);
      color: var(--red)
    }

    .badge.am {
      background: var(--amber-soft);
      color: #8a6503
    }

    .badge.gy {
      background: #eef1f6;
      color: var(--slate)
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block
    }

    .pill-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate);
      transition: .12s
    }

    .chip:hover {
      border-color: #cdd6e2;
      color: var(--ink)
    }

    .chip.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--ink-3)
    }

    .field label .req {
      color: var(--red)
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--card);
      transition: .12s;
      outline: none
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(238, 123, 26, .12)
    }

    .field textarea {
      resize: vertical;
      min-height: 78px
    }

    .field .hint {
      font-size: 11.5px;
      color: var(--slate-2);
      margin-top: 5px
    }

    .frow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: none
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .switch .sl {
      position: absolute;
      inset: 0;
      background: #cdd6e2;
      border-radius: 20px;
      transition: .2s
    }

    .switch .sl::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2)
    }

    .switch input:checked+.sl {
      background: var(--green)
    }

    .switch input:checked+.sl::before {
      transform: translateX(18px)
    }

    /* ---------- Modal ---------- */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(19, 28, 41, .5);
      backdrop-filter: blur(3px);
      z-index: 80;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto
    }

    .modal {
      background: var(--card);
      border-radius: 15px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 560px;
      animation: pop .2s ease
    }

    .modal.wide {
      max-width: 820px
    }

    @keyframes pop {
      from {
        transform: translateY(12px) scale(.98);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .modal .mh {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line-2);
      display: flex;
      align-items: center;
      gap: 12px
    }

    .modal .mh h3 {
      font-size: 16px;
      font-weight: 700
    }

    .modal .mh .x {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border: none;
      background: #f1f4f8;
      border-radius: 8px;
      color: var(--slate);
      display: grid;
      place-items: center
    }

    .modal .mh .x:hover {
      background: #e6ebf2;
      color: var(--ink)
    }

    .modal .mb {
      padding: 22px;
      max-height: 64vh;
      overflow-y: auto
    }

    .modal .mf {
      padding: 15px 22px;
      border-top: 1px solid var(--line-2);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      background: #fafbfd;
      border-radius: 0 0 15px 15px
    }

    /* ---------- Drawer ---------- */
    .drawer-ov {
      position: fixed;
      inset: 0;
      background: rgba(19, 28, 41, .45);
      z-index: 80;
      animation: fade .15s
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 560px;
      max-width: 94vw;
      background: var(--bg);
      z-index: 81;
      box-shadow: var(--shadow-lg);
      overflow-y: auto;
      animation: slide .22s ease
    }

    @keyframes slide {
      from {
        transform: translateX(30px);
        opacity: .5
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .drawer .dh {
      position: sticky;
      top: 0;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 18px 22px;
      z-index: 2
    }

    .drawer .dh .x {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 8px;
      color: var(--slate);
      display: grid;
      place-items: center
    }

    .drawer .db {
      padding: 22px
    }

    /* ---------- Workflow stepper ---------- */
    .wf {
      position: relative;
      padding-left: 8px
    }

    .wf .cy {
      position: relative;
      padding: 0 0 6px 40px;
      margin-bottom: 6px
    }

    .wf .cy::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 34px;
      bottom: -6px;
      width: 2px;
      background: var(--line)
    }

    .wf .cy:last-child::before {
      display: none
    }

    .wf .cy .num {
      position: absolute;
      left: 0;
      top: 2px;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: Archivo;
      font-weight: 700;
      font-size: 13px;
      z-index: 1
    }

    .wf .cy.done .num {
      background: var(--green)
    }

    .wf .cy.cur .num {
      background: var(--orange);
      box-shadow: 0 0 0 4px var(--orange-soft)
    }

    .wf .cy.wf-info {
      opacity: .6
    }

    .wf .cy.wf-info .num {
      background: var(--slate-2)
    }

    .wf .cy.wf-info .cyc-card {
      background: #f4f6fa;
      box-shadow: none
    }

    .wf .cy.wf-info h4 {
      color: var(--slate)
    }

    .wf-startline {
      position: relative;
      margin: 4px 0 14px 40px;
      padding-top: 10px;
      border-top: 2px dashed var(--orange);
      display: flex
    }

    .wf-startline span {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--orange-deep);
      background: var(--orange-soft);
      border-radius: 20px;
      padding: 4px 12px;
      margin-top: -11px
    }

    .cyc-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .cyc-card .ch {
      padding: 13px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 8px;
      gap: 10px;
      cursor: pointer
    }

    .cyc-card .ch>div:first-child {
      min-width: 0
    }

    .cyc-card .ch h4 {
      font-size: 14px;
      font-weight: 700
    }

    .cyc-card .ch .code {
      font-size: 11px;
      color: var(--slate)
    }

    .cyc-card .cb {
      padding: 0 16px 16px;
      border-top: 1px solid var(--line-2)
    }

    .sub {
      border-left: 2px solid var(--line-2);
      padding: 12px 0 4px 16px;
      margin: 14px 0 0
    }

    .sub h5 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px
    }

    .meta .m {
      font-size: 11.5px;
      background: #f4f6fa;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      padding: 4px 9px;
      color: var(--slate);
      display: inline-flex;
      gap: 5px;
      align-items: center
    }

    .meta .m b {
      color: var(--ink);
      font-weight: 600
    }

    .wf-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 22px;
      align-items: start
    }

    @media(max-width:980px) {
      .wf-layout {
        grid-template-columns: 1fr
      }
    }

    .wf-side {
      position: sticky;
      top: 20px
    }

    .wf-side .hd {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .wf-side .hd h3 {
      font-size: 14.5px
    }

    .wf-side .totrow {
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--slate)
    }

    .wf-side-list {
      max-height: calc(100vh - 320px);
      min-height: 120px;
      overflow-y: auto;
      padding: 10px
    }

    .wf-mp {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: .12s
    }

    .wf-mp:hover {
      background: #f4f6fa
    }

    .wf-mp+.wf-mp {
      border-top: 1px solid var(--line-2)
    }

    .wf-mp .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none
    }

    .wf-mp .in {
      min-width: 0;
      flex: 1
    }

    .wf-mp .in b {
      display: block;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wf-mp .in span {
      font-size: 11px;
      color: var(--slate);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .wf-mp .amt {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
      flex: none;
      text-align: right
    }

    .kanban {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 14px;
      align-items: start
    }

    .kcol {
      background: #eef1f6;
      border-radius: var(--r);
      padding: 11px
    }

    .kcol .kh {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-3)
    }

    .kcol .kh .n {
      margin-left: auto;
      background: var(--card);
      border-radius: 20px;
      padding: 1px 8px;
      font-size: 11px;
      color: var(--slate)
    }

    .kcard {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 11px;
      margin-bottom: 9px;
      box-shadow: 0 1px 2px rgba(18, 28, 41, .04);
      cursor: pointer;
      transition: .12s
    }

    .kcard:hover {
      border-color: #cdd6e2;
      transform: translateY(-1px);
      box-shadow: var(--shadow)
    }

    .kcard b {
      font-size: 13px;
      display: block
    }

    .kcard .mono {
      font-size: 11px;
      color: var(--slate)
    }

    .kcard .kf {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      font-size: 11.5px;
      color: var(--slate)
    }

    .matrix {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0
    }

    .matrix th {
      position: sticky;
      top: 0
    }

    .matrix td.mod {
      font-weight: 600;
      color: var(--ink);
      background: #fafbfd
    }

    .matrix .cell {
      display: flex;
      gap: 5px;
      justify-content: center
    }

    .perm {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--slate-2);
      background: var(--card);
      cursor: pointer;
      transition: .1s;
      user-select: none
    }

    .perm.on {
      color: #fff;
      border-color: transparent
    }

    .perm.v.on {
      background: var(--slate)
    }

    .perm.c.on {
      background: var(--green)
    }

    .perm.e.on {
      background: var(--blue)
    }

    .perm.d.on {
      background: var(--red)
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      overflow-x: auto
    }

    .tabs button {
      border: none;
      background: transparent;
      padding: 11px 15px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--slate);
      border-bottom: 2.5px solid transparent;
      white-space: nowrap;
      margin-bottom: -1px
    }

    .tabs button:hover {
      color: var(--ink)
    }

    .tabs button.on {
      color: var(--orange-deep);
      border-color: var(--orange)
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--slate)
    }

    .empty svg {
      width: 40px;
      height: 40px;
      opacity: .4;
      margin-bottom: 12px
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 4px;
      font-family: Archivo
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      font-family: Archivo;
      flex: none
    }

    .uwrap {
      display: flex;
      align-items: center;
      gap: 10px
    }

    /* charts */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 170px;
      padding-top: 10px
    }

    .bars .b {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      height: 100%;
      justify-content: flex-end
    }

    .bars .b .bar {
      width: 100%;
      max-width: 38px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(var(--orange), var(--orange-deep));
      position: relative;
      transition: height .5s ease
    }

    .bars .b .bar.g {
      background: linear-gradient(var(--green), var(--green-deep))
    }

    .bars .b .bval {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink)
    }

    .bars .b .blab {
      font-size: 11px;
      color: var(--slate);
      text-align: center;
      line-height: 1.2
    }

    .hbars {
      display: flex;
      flex-direction: column;
      gap: 11px
    }

    .hbar {
      display: grid;
      grid-template-columns: 130px 1fr 52px;
      align-items: center;
      gap: 12px;
      font-size: 12.5px
    }

    .hbar .track {
      background: #eef1f6;
      border-radius: 20px;
      height: 11px;
      overflow: hidden
    }

    .hbar .fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--orange), var(--green));
      transition: width .5s
    }

    .hbar .v {
      text-align: right;
      font-weight: 700;
      font-family: 'IBM Plex Mono'
    }

    .hbar .lb {
      color: var(--slate);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 9px;
      animation: pop .2s
    }

    .toast svg {
      width: 17px;
      height: 17px;
      color: var(--green)
    }

    .pgt {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 14px 0
    }

    .pgt .sp {
      flex: 1
    }

    .count {
      font-size: 12.5px;
      color: var(--slate)
    }

    .searchbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 12px;
      min-width: 200px
    }

    .searchbox input {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      width: 100%
    }

    .selct {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      font-family: inherit;
      font-size: 13px;
      background: var(--card);
      color: var(--ink);
      font-weight: 600
    }

    .deny {
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: var(--r);
      padding: 44px;
      text-align: center;
      color: var(--slate)
    }

    .deny svg {
      width: 34px;
      height: 34px;
      color: var(--slate-2);
      margin-bottom: 10px
    }

    .infoline {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .infoline .it label {
      font-size: 11px;
      color: var(--slate-2);
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 700;
      display: block;
      margin-bottom: 3px
    }

    .infoline .it b {
      font-size: 14px
    }

    .timeline {
      position: relative;
      padding-left: 22px
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--line)
    }

    .tl {
      position: relative;
      padding-bottom: 16px
    }

    .tl::before {
      content: "";
      position: absolute;
      left: -19px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--card);
      border: 2.5px solid var(--orange)
    }

    .tl.g::before {
      border-color: var(--green)
    }

    .tl .tt {
      font-size: 13px;
      font-weight: 600
    }

    .tl .td {
      font-size: 11.5px;
      color: var(--slate)
    }

    @media(max-width:820px) {
      #login {
        grid-template-columns: 1fr
      }

      .login-brand {
        display: none
      }

      .top .gsearch {
        display: none
      }
    }

    /* ===== HORIZONTAL MENU (override sidebar) ===== */
    #app {
      display: flex;
      flex-direction: column;
      grid-template-columns: none;
      height: 100vh
    }

    .side {
      display: none !important
    }

    .main {
      height: auto;
      flex: 1;
      min-height: 0
    }

    .topnav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--ink);
      color: #cdd7e4;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 20px;
      height: 60px;
      box-shadow: 0 2px 14px rgba(18, 28, 41, .14)
    }

    .topnav::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--orange) 0 33.3%, #fff 33.3% 66.6%, var(--green) 66.6%)
    }

    .topnav .brand-logo {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-right: 14px;
      margin-right: 6px;
      border-right: 1px solid rgba(255, 255, 255, .1);
      height: 38px
    }

    .topnav .brand-logo img {
      height: 34px;
      width: auto;
      display: block;
      background: #fff;
      border-radius: 7px;
      padding: 4px 7px
    }

    .topnav .brand-logo .tt {
      line-height: 1.05
    }

    .topnav .brand-logo .tt b {
      font-family: Archivo;
      font-weight: 800;
      color: #fff;
      font-size: 13px;
      display: block;
      letter-spacing: .02em
    }

    .topnav .brand-logo .tt span {
      font-size: 9px;
      letter-spacing: .14em;
      color: #8595a8;
      text-transform: uppercase;
      font-weight: 600
    }

    .hnav {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      height: 100%
    }

    .hnav .nitem {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center
    }

    .hnav a,
    .hnav button.ntrig {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      color: #b9c4d3;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      background: transparent;
      border: none;
      transition: .12s;
      white-space: nowrap
    }

    .hnav a svg,
    .hnav button.ntrig svg {
      width: 17px;
      height: 17px;
      opacity: .85
    }

    .hnav a:hover,
    .hnav button.ntrig:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff
    }

    .hnav a.on,
    .hnav button.ntrig.on {
      background: linear-gradient(180deg, rgba(231, 114, 43, .28), rgba(231, 114, 43, .12));
      color: #fff
    }

    .hnav .cnt {
      background: rgba(255, 255, 255, .14);
      color: #e5ebf3;
      font-size: 11px;
      padding: 0 7px;
      border-radius: 20px;
      font-weight: 700;
      line-height: 18px
    }

    .hnav .chevd {
      width: 14px;
      height: 14px;
      opacity: .7;
      transition: .15s
    }

    .hnav .nitem.open .chevd {
      transform: rotate(180deg)
    }

    .dropdown {
      position: absolute;
      top: 52px;
      left: 0;
      min-width: 236px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 7px;
      display: none;
      flex-direction: column;
      gap: 1px;
      z-index: 50;
      animation: pop .14s ease
    }

    .hnav .nitem.open .dropdown {
      display: flex
    }

    .dropdown a {
      display: flex;
      align-items: center;
      gap: 11px;
      height: auto;
      padding: 9px 11px;
      border-radius: 8px;
      color: var(--ink-3);
      font-size: 13.5px;
      font-weight: 500
    }

    .dropdown a svg {
      width: 17px;
      height: 17px;
      color: var(--slate)
    }

    .dropdown a:hover {
      background: #f3f5f9;
      color: var(--ink)
    }

    .dropdown a.on {
      background: var(--orange-soft);
      color: var(--orange-deep)
    }

    .dropdown a.on svg {
      color: var(--orange-deep)
    }

    .dropdown a .cnt {
      margin-left: auto;
      background: #eef1f6;
      color: var(--slate);

      margin: 4px 0 0;
      color: var(--ink-3)
    }

    .dfoot {
      position: sticky;
      bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      gap: 9px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    @media(max-width:560px) {
      .dl {
        grid-template-columns: 1fr
      }
    }

    /* ===== CONTENU RESPONSIVE (mobile / petits écrans) ===== */
    @media(max-width:760px) {
      .content {
        padding: 16px 14px 44px
      }

      .top {
        flex-wrap: wrap;
        row-gap: 10px
      }

      .top .gsearch {
        width: auto;
        flex: 1 1 100%;
        order: 3
      }

      .frow {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:480px) {

      .g2,
      .g3,
      .g4 {
        grid-template-columns: 1fr
      }

      .kpi {
        padding: 13px 14px
      }
    }

    /* -- graphe groupé emplois par secteur -- */
    .gbars {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      height: 180px;
      padding-top: 10px;
      overflow-x: auto
    }

    .gb {
      flex: 1;
      min-width: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
      justify-content: flex-end
    }

    .gb-cols {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 100%;
      width: 100%;
      justify-content: center
    }

    .gb-c {
      width: 20px;
      background: linear-gradient(var(--orange), var(--orange-deep));
      border-radius: 4px 4px 0 0;
      position: relative;
      transition: height .5s;
      min-height: 8px
    }

    .gb-c.sal {
      background: linear-gradient(var(--blue), #1e50a8)
    }

    .gb-c span {
      position: absolute;
      top: -17px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink)
    }

    .gb-l {
      font-size: 11px;
      color: var(--slate);
      text-align: center;
      line-height: 1.2;
      font-weight: 500
    }

    .gleg {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--slate);
      font-weight: 600
    }

    .gleg span {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .gleg i {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: inline-block
    }

    /* -- menu utilisateur -- */
    .usr-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(255, 255, 255, .06);
      border: none;
      border-radius: 7px;
      padding: 4px 8px 4px 5px;
      color: #fff
    }

    .usr-btn:hover {
      background: rgba(255, 255, 255, .12)
    }

    .usr-btn .av {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      font-family: Archivo;
      flex: none
    }

    .usr-btn .in {
      line-height: 1.15;
      text-align: left
    }

    .usr-btn .in b {
      color: #fff;
      font-size: 12.5px;
      display: block;
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .usr-btn .in span {
      font-size: 10.5px;
      color: #8595a8;
      font-weight: 600
    }

    .usr-btn .chevd {
      width: 14px;
      height: 14px;
      color: #8595a8
    }

    .usr-menu {
      padding: 7px
    }

    .um-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 9px 12px;
      border-bottom: 1px solid var(--line-2);
      margin-bottom: 6px
    }

    .um-head .av {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-family: Archivo;
      flex: none
    }

    .um-head b {
      display: block;
      font-size: 13px;
      color: var(--ink)
    }

    .um-head span {
      font-size: 11.5px;
      color: var(--slate);
      word-break: break-all
    }

    .um-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: none;
      border: none;
      padding: 9px 10px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink-3);
      text-align: left
    }

    .um-item:hover {
      background: #f3f5f9;
      color: var(--ink)
    }

    .um-item svg {
      width: 17px;
      height: 17px;
      color: var(--slate)
    }

    /* -- séparateur comptes démo -- */
    .lc-demo-sep {
      grid-column: 1/-1;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--slate-2);
      margin: 8px 0 2px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .lc-demo-sep::before,
    .lc-demo-sep::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line)
    }

    .lc-demo-sep:first-child {
      margin-top: 0
    }

    /* -- bascule « afficher tous les comptes » -- */
    .lc-demo-plus {
      grid-column: 1/-1;
      margin-top: 8px;
      background: transparent;
      border: 1px dashed var(--line);
      border-radius: var(--r-sm);
      padding: 9px;
      color: var(--slate);
      font-size: 12px;
      font-weight: 600;
      transition: .13s
    }

    .lc-demo-plus:hover {
      border-color: var(--orange);
      color: var(--orange-deep);
      border-style: solid
    }

    /* -- espace bénéficiaire : tâches -- */
    .tasklist {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      transition: .12s
    }

    .task:hover {
      border-color: var(--orange);
      box-shadow: var(--shadow)
    }

    .task .ti {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex: none
    }

    .task .ti svg {
      width: 19px;
      height: 19px
    }

    .task .tc {
      flex: 1
    }

    .task .tc b {
      display: block;
      font-size: 13.5px;
      color: var(--ink)
    }

    .task .tc span {
      font-size: 12px;
      color: var(--slate)
    }

    .task .tgo {
      width: 18px;
      height: 18px;
      color: var(--slate-2)
    }

    /* -- indicateurs : atteinte des cibles -- */
    .ind-row {
      padding: 11px 0;
      border-bottom: 1px solid var(--line-2)
    }

    .ind-row:last-child {
      border-bottom: none
    }

    .ind-h {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
      font-size: 13px
    }

    .ind-h b {
      color: var(--ink);
      font-weight: 600
    }

    .ind-row .track {
      height: 8px;
      background: var(--line-2);
      border-radius: 5px;
      overflow: hidden
    }

    .ind-row .track .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--orange-deep));
      border-radius: 5px;
      transition: width .6s
    }

    .ind-row .track .fill.g {
      background: linear-gradient(90deg, var(--green), var(--green-deep))
    }

    .ind-row .track .fill.r {
      background: linear-gradient(90deg, #e0736b, var(--red))
    }

    .taux {
      font-family: 'IBM Plex Mono';
      font-weight: 700;
      color: var(--orange-deep)
    }

    .taux.g {
      color: var(--green-deep)
    }

    .taux.r {
      color: var(--red)
    }

    .track.sm {
      height: 6px;
      background: var(--line-2);
      border-radius: 5px;
      overflow: hidden;
      min-width: 70px
    }

    .track.sm .fill {
      height: 100%;
      background: var(--orange);
      border-radius: 5px
    }

    .track.sm .fill.g {
      background: var(--green)
    }

    .track.sm .fill.r {
      background: var(--red)
    }

    .taux-cell {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .q-ind {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--green-deep);
      background: var(--green-soft);
      padding: 1px 6px;
      border-radius: 4px
    }

    /* ---------- Procédures DFP : import Excel, chaîne de validation, guichets ---------- */
    .imp-drop {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px dashed var(--line);
      border-radius: var(--r);
      padding: 16px;
      background: #fbfcfe;
      margin-bottom: 14px
    }

    .imp-drop svg {
      width: 24px;
      height: 24px;
      color: var(--orange);
      flex: none
    }

    .imp-drop b {
      display: block;
      font-size: 13.5px
    }

    .imp-drop span {
      font-size: 12px;
      color: var(--slate)
    }

    .imp-cols {
      font-size: 12px;
      margin-bottom: 12px
    }

    .imp-cols>b {
      display: block;
      color: var(--slate);
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .imp-cols>div {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .imp-cols span {
      background: var(--line-2);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 11px;
      color: var(--slate)
    }

    .imp-modele {
      font-size: 12px;
      color: var(--orange-deep);
      background: var(--orange-soft);
      border-radius: var(--r-sm);
      padding: 8px 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px
    }

    .imp-modele em {
      color: var(--slate);
      font-style: normal
    }

    .imp-modele svg {
      width: 14px;
      height: 14px;
      flex: none
    }

    .imp-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 260px;
      overflow-y: auto
    }

    .imp-row {
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1.5px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      cursor: pointer;
      transition: .13s
    }

    .imp-row:hover {
      border-color: var(--orange)
    }

    .imp-row input {
      width: 16px;
      height: 16px;
      flex: none;
      accent-color: var(--orange)
    }

    .imp-row .in {
      flex: 1;
      min-width: 0
    }

    .imp-row .in b {
      display: block;
      font-size: 13px
    }

    .imp-row .in span {
      font-size: 11.5px;
      color: var(--slate)
    }

    /* chaîne de validation hiérarchique */
    .chain {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin: 10px 0 4px;
      align-items: stretch
    }

    .chain .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 10px;
      border: 1.5px solid var(--line);
      background: var(--card);
      font-size: 12px;
      position: relative;
      flex: none
    }

    .chain .step:first-child {
      border-radius: var(--r-sm) 0 0 var(--r-sm)
    }

    .chain .step:last-child {
      border-radius: 0 var(--r-sm) var(--r-sm) 0
    }

    .chain .step+.step {
      border-left: none
    }

    .chain .step .n {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--line-2);
      color: var(--slate);
      flex: none
    }

    .chain .step b {
      font-weight: 600;
      color: var(--slate)
    }

    .chain .step.done {
      background: var(--green-soft);
      border-color: #c7ebd0
    }

    .chain .step.done .n {
      background: var(--green);
      color: #fff
    }

    .chain .step.done b {
      color: var(--green-deep)
    }

    .chain .step.cur {
      background: var(--orange-soft);
      border-color: #f3cfb3
    }

    .chain .step.cur .n {
      background: var(--orange);
      color: #fff
    }

    .chain .step.cur b {
      color: var(--orange-deep)
    }

    .chain .step.ko {
      background: var(--red-soft);
      border-color: #f2c9c5
    }

    .chain .step.ko .n {
      background: var(--red);
      color: #fff
    }

    .chain .step.ko b {
      color: var(--red)
    }

    /* lignes de décaissement — autoriser / exécuter */
    .lgn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
      background: var(--card)
    }

    .lgn .num {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      font-family: Archivo;
      flex: none
    }

    .lgn.done .num {
      background: var(--green)
    }

    .lgn.auth .num {
      background: var(--amber)
    }

    .lgn .in {
      flex: 1;
      min-width: 0
    }

    .lgn .in b {
      display: block;
      font-size: 13.5px
    }

    .lgn .in span {
      font-size: 11.5px;
      color: var(--slate)
    }

    .lgn .amt {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      white-space: nowrap
    }

    .lgn .btn[disabled] {
      opacity: .45;
      cursor: not-allowed
    }

    /* bloc numéro (plan de décaissement) : le numéro se traite en bloc, les lignes filles sont indicatives */
    .lgn-grp {
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
      overflow: hidden;
      background: var(--card)
    }

    .lgn-grp .lgn {
      border: none;
      border-radius: 0;
      margin-bottom: 0
    }

    .lgn-grp.done .lgn .num {
      background: var(--green)
    }

    .lgn-grp.auth .lgn .num {
      background: var(--amber)
    }

    .sub-lgn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px 7px 48px;
      border-top: 1px solid var(--line-2)
    }

    .sub-lgn .in {
      flex: 1;
      min-width: 0
    }

    .sub-lgn .in b {
      display: block;
      font-size: 12.5px
    }

    .sub-lgn .in span {
      font-size: 11px;
      color: var(--slate)
    }

    .sub-lgn .amt {
      font-family: 'IBM Plex Mono';
      font-size: 11.5px;
      white-space: nowrap;
      min-width: 84px;
      text-align: right;
      color: var(--slate)
    }

    .sub-lgn .amt.pri {
      color: var(--ink);
      font-weight: 600
    }

    .lgn.total {
      background: var(--line-2);
      font-weight: 700
    }

    /* sélecteur de guichets (page d'accueil) */
    .gsel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px
    }

    .gcard {
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      background: var(--card);
      padding: 20px;
      cursor: pointer;
      transition: .15s;
      box-shadow: var(--shadow)
    }

    .gcard:hover {
      border-color: var(--orange);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(238, 123, 26, .14)
    }

    .gcard .ico {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      margin-bottom: 14px
    }

    .gcard .ico svg {
      width: 22px;
      height: 22px;
      color: #fff
    }

    .gcard h3 {
      font-size: 16px;
      margin-bottom: 4px
    }

    .gcard .code {
      font-family: 'IBM Plex Mono';
      font-size: 11.5px;
      color: var(--slate-2);
      margin-bottom: 12px
    }

    .gcard .st {
      display: flex;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line-2)
    }

    .gcard .st div span {
      display: block;
      font-size: 11px;
      color: var(--slate)
    }

    .gcard .st div b {
      font-size: 15px;
      font-family: Archivo
    }

    /* barre de relais : étape courante, acteur attendu, action */
    .relais {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg);
      border: 1px solid var(--line);
      border-left: 3px solid var(--slate-2);
      border-radius: var(--r-sm);
      padding: 13px 16px;
      margin-bottom: 16px
    }

    .relais.moi {
      background: var(--orange-soft);
      border-color: #f0d3ba;
      border-left-color: var(--orange)
    }

    .relais .rl-in {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
      flex-wrap: wrap
    }

    .rl-etape {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none
    }

    .rl-etape .rl-n {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: Archivo;
      font-weight: 700;
      font-size: 13px;
      flex: none
    }

    .relais.moi .rl-etape .rl-n {
      background: var(--orange)
    }

    .rl-etape b {
      display: block;
      font-size: 13.5px;
      line-height: 1.25
    }

    .rl-etape span {
      display: block;
      font-size: 11px;
      color: var(--slate);
      font-family: 'IBM Plex Mono'
    }

    .rl-quoi {
      min-width: 0
    }

    .rl-quoi b {
      display: block;
      font-size: 12.5px;
      color: var(--ink)
    }

    .relais.moi .rl-quoi b {
      color: var(--orange-deep)
    }

    .rl-quoi span {
      display: block;
      font-size: 12px;
      color: var(--slate);
      margin-top: 1px
    }

    .rl-main {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 12.5px;
      color: var(--slate);
      font-weight: 600;
      min-width: 0;
      max-width: 100%
    }

    .rl-main svg {
      width: 15px;
      height: 15px;
      flex: none
    }

    .rl-fin {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--green-deep)
    }

    .rl-fin svg {
      width: 15px;
      height: 15px
    }

    /* colonne « À faire » : profil attendu quand ce n'est pas le nôtre */
    .attente {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--slate-2);
      white-space: nowrap
    }

    .attente svg {
      width: 13px;
      height: 13px;
      flex: none;
      opacity: .8
    }

    td .btn.sm.pri {
      white-space: nowrap
    }

    /* relevé de la position GPS sur le terrain */
    .geo-btn {
      width: 100%;
      justify-content: center
    }

    .geo-btn:disabled {
      opacity: .6;
      cursor: progress
    }

    .geo-note {
      font-size: 11.5px;
      color: var(--slate);
      margin-top: 7px;
      line-height: 1.4
    }

    .geo-note.ok {
      color: var(--green-deep);
      font-weight: 600
    }

    .geo-note.ko {
      color: var(--red);
      font-weight: 600
    }

    /* dossier gelé (annulation du prêt) */
    .kcard.gele {
      opacity: .62;
      border-left: 3px solid var(--red)
    }

    .gel-banner {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--red-soft);
      color: var(--red);
      border-radius: var(--r-sm);
      padding: 10px 13px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 14px
    }

    .gel-banner svg {
      width: 16px;
      height: 16px;
      flex: none
    }

    /* résultats de la recherche globale */
    .gs-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 420px;
      max-height: 460px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-lg);
      z-index: 70;
      padding: 8px
    }

    .gs-wrap {
      position: relative
    }

    .gs-h {
      font-size: 10.5px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--slate-2);
      font-weight: 700;
      padding: 8px 10px 5px
    }

    .gs-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 10px;
      border-radius: var(--r-sm);
      cursor: pointer
    }

    .gs-item:hover {
      background: var(--line-2)
    }

    .gs-item .in {
      flex: 1;
      min-width: 0
    }

    .gs-item .in b {
      display: block;
      font-size: 13px
    }

    .gs-item .in span {
      font-size: 11.5px;
      color: var(--slate)
    }

    .gs-empty {
      padding: 22px 10px;
      text-align: center;
      color: var(--slate-2);
      font-size: 13px
    }

    /* antécédents du bénéficiaire */
    .ant-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line-2);
      font-size: 13px
    }

    .ant-row:last-child {
      border-bottom: none
    }

    .ant-row .lb {
      flex: 1;
      color: var(--slate)
    }
  </style>
</head>

    function ref(res, id) {

      if (res === 'budgets') { return budgetLabel(it); }
      if (res === 'plans_decaissement') { return 'Plan — ' + ref('projets', it.projet_id); }
      return it[map[res]] || '—';
    }
    function projetLabel(p) { const j = DB.jeunes.find(x => x.id === p.jeune_id); return `${p.code} — ${p.titre}${j ? ` (${j.prenoms} ${j.nom})` : ''}`; }
    function budgetLabel(b) { const p = DB.projets.find(x => x.id === b.projet_id); return `Financement ${p ? p.code : ''} — ${p ? p.titre : ''} · ${money(b.montant)}`; }
    /* ---- cloisonnement par agence : un chef/conseiller d'agence ne voit que ses dossiers ---- */

    // un partenaire financier ne voit que les dossiers qui lui ont été transmis

    function projOrg(pid) { const p = DB.projets.find(x => x.id === pid); return p ? p.organisme_id : null; }
    function jeuneOrg(jid) { const p = DB.projets.find(x => x.jeune_id === jid); return p ? p.organisme_id : null; }
    function inScope(resKey, row) {
      const ag = agencyScopeId(); const org = organismeScopeId();
      if (!ag && !org) return true;
      switch (resKey) {
        case 'projets': return (!ag || row.agence_id === ag) && (!org || row.organisme_id === org);
        case 'jeunes': return DB.projets.some(p => p.jeune_id === row.id && (!ag || p.agence_id === ag) && (!org || p.organisme_id === org));

        case 'lots': return (!ag || DB.projets.some(p => p.lot_id === row.id && p.agence_id === ag)) && (!org || row.organisme_id === org);
