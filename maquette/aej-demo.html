    const STATUTS = [
      { k: 'SOUMISSION', label: "Soumission", cls: 'gy', etape: 2 },
      { k: 'ANALYSE', label: "Analyse / Instruction", cls: 'bl', etape: 3 },
      { k: 'CERTIFICATION', label: "Certification", cls: 'am', etape: 4 },
      { k: 'FINANCEMENT', label: "Financement", cls: 'or', etape: 5 },
      { k: 'DECAISSEMENT', label: "Décaissement", cls: 'or', etape: 6 },
      { k: 'SUIVI', label: "Suivi exploitation", cls: 'bl', etape: 7 },
      { k: 'REMBOURSEMENT', label: "Remboursement", cls: 'gr', etape: 8 }
    ];
    const statut = k => STATUTS.find(s => s.k === k) || { label: k, cls: 'gy' };

    /* --------------------------------------------------------------------
       ÉTAPES PAR GUICHET — les trois procédures du compte rendu DFP n'ont pas
       le même nombre de cycles : le parcours d'un dossier dépend de son guichet.
       Le numéro d'étape correspond au numéro de cycle du workflow correspondant.
       -------------------------------------------------------------------- */
    const ETAPES_MPE_MEPS = [
      // pas d'étape de récupération distincte : dès que la liste est disponible, le dossier
      // attend directement sa transmission au partenaire (action du SDRF ci-dessous)
      { k: 'RECUPERATION', label: "À transmettre", cls: 'gy', etape: 1 },
      { k: 'TRANSMISSION', label: "Transmis au partenaire", cls: 'bl', etape: 2 },
      { k: 'IMPUTATION', label: "Imputation agence", cls: 'am', etape: 3 },
      { k: 'PLAN_DECAISSEMENT', label: "Plan de décaissement", cls: 'or', etape: 4 },
      { k: 'VALIDATION', label: "Chaîne de validation", cls: 'or', etape: 5 },
      { k: 'TRAITEMENT_PF', label: "Traitement partenaire", cls: 'bl', etape: 6 },
      { k: 'DECAISSEMENT', label: "Décaissement / remboursement", cls: 'gr', etape: 7 },
      { k: 'SUIVI', label: "Suivi terrain", cls: 'gr', etape: 8 }
    ];
    const ETAPES_STARTUP = [
      // idem AGR/MPE/MEPS : pas d'étape de récupération distincte, le dossier certifié
      // attend directement sa transmission au partenaire
      { k: 'RECUPERATION', label: "À transmettre", cls: 'gy', etape: 1 },
      { k: 'TRANSMISSION', label: "Transmis au partenaire", cls: 'bl', etape: 2 },
      { k: 'PLAN_DECAISSEMENT', label: "Plans & conventions", cls: 'or', etape: 3 },
      { k: 'VALIDATION', label: "Chaîne de validation", cls: 'or', etape: 4 },
      { k: 'TRAITEMENT_PF', label: "Traitement partenaire", cls: 'bl', etape: 5 },
      { k: 'DECAISSEMENT', label: "Décaissement / remboursement", cls: 'gr', etape: 6 },
      { k: 'SUIVI', label: "Suivi terrain", cls: 'gr', etape: 7 }
    ];
    /* AGR — le numéro correspond au cycle du workflow. Les cycles 1 à 6 (préparation,
       sensibilisation, enrôlement, présélection, formation, récupération de la liste)
       restent informatifs : l'exécution dans le système démarre directement à l'ajout
       du plan d'affaires par l'agence régionale, cycle 7. */
    const ETAPES_AGR = [
      { k: 'PLAN_AFFAIRES', label: "Plan d'affaires", cls: 'am', etape: 7 },
      { k: 'TRANSMISSION', label: "À transmettre", cls: 'bl', etape: 8 },
      { k: 'TRAITEMENT_PF', label: "Chez le partenaire", cls: 'or', etape: 9 },
      { k: 'DECAISSEMENT', label: "Décaissement / remboursement", cls: 'gr', etape: 10 },
      { k: 'SUIVI', label: "Suivi terrain", cls: 'gr', etape: 11 }
    ];
    const ETAPES = { 'wf-agr': ETAPES_AGR, 'wf-mpe': ETAPES_MPE_MEPS, 'wf-meps': ETAPES_MPE_MEPS, 'wf-startup': ETAPES_STARTUP };
    /* liste des étapes d'un guichet — repli sur STATUTS pour un guichet créé à la volée */
    function etapesDe(dispositifId) { return ETAPES[dispositifId] || STATUTS; }
    /* union de toutes les étapes, pour les listes déroulantes et les filtres transverses */
    const TOUS_STATUTS = (() => {
      const m = new Map();
      [ETAPES_AGR, ETAPES_MPE_MEPS, ETAPES_STARTUP, STATUTS].forEach(L => L.forEach(s => { if (!m.has(s.k)) m.set(s.k, s); }));
      return [...m.values()];
    })();
    /* étape courante d'un dossier, résolue dans le référentiel de SON guichet
       (les clés DECAISSEMENT / SUIVI existent dans plusieurs guichets avec des rangs différents) */
    function statutDe(p) {
      if (!p) return { label: '—', cls: 'gy' };
      return etapesDe(p.dispositif_id).find(s => s.k === p.statut) || statut(p.statut);
    }
    /* étape suivante dans le parcours du guichet du dossier */
    function etapeSuivante(p) {
      const L = etapesDe(p.dispositif_id); const i = L.findIndex(s => s.k === p.statut);
      return (i >= 0 && i < L.length - 1) ? L[i + 1] : null;
    }
    /* fait avancer un dossier d'un cran dans son propre parcours */
    function avancer(p) {
      const nx = etapeSuivante(p); if (!nx) return null;
      p.statut = nx.k; p.etape = nx.etape; return nx;
    }

    /* qui doit agir sur le numéro en cours du plan de décaissement d'un dossier en DECAISSEMENT :
       le partenaire financier tant que le numéro est PREVU, l'agence régionale une fois autorisé.
       planDuProjet/lignesDuPlan/numerosDuPlan sont définis plus bas dans le fichier — référence
       différée sans risque puisque cette fonction n'est appelée qu'au rendu, bien après leur déclaration. */
    function numeroEnCoursDecaissement(p) {
      const pl = planDuProjet(p.id); if (!pl) return null;
      const L = lignesDuPlan(pl.id); if (!L.length) return null;
      const num = numerosDuPlan(pl.id).find(n => L.filter(l => l.num === n).some(l => l.statut !== 'EXECUTE'));
      if (num === undefined) {
        // le statut « Décaissement / remboursement » couvre les deux — une fois toutes les lignes
        // exécutées, le relais bascule sur le suivi des remboursements par le partenaire financier
        return {
          roles: ['PF'], qui: "le partenaire financier", action: "Gérer les remboursements", court: "Remboursements",
          fn: 'gererRemboursements', quoi: "Saisir les échéances de remboursement du bénéficiaire et suivre les impayés."
        };
      }
      const grp = L.filter(l => l.num === num);
      return grp.every(l => l.statut === 'PREVU')
        ? {
          roles: ['PF'], qui: "le partenaire financier", action: `Autoriser le décaissement ${num}`, court: "Autoriser",
          fn: 'ouvrirPlanDuDossier', quoi: `Autoriser le décaissement ${num} du plan de décaissement.`
        }
        : {
          roles: ['CAR', 'CIP'], qui: "l'agence régionale", action: `Exécuter le décaissement ${num}`, court: "Exécuter",
          fn: 'ouvrirPlanDuDossier', quoi: `Exécuter le décaissement ${num}, autorisé par le partenaire, avec date et justificatif.`
        };
    }

    /* AGR : crédit intégralement décaissé — au-delà, l'action attendue du partenaire
       bascule de « décaisser » vers « gérer les remboursements ». */
    function agrSolde(p) { const b = DB.budgets.find(x => x.projet_id === p.id); return !!b && b.deblocage === 'DEBLOQUE'; }
    /* vrai dès qu'au moins un décaissement a été enregistré pour ce dossier AGR — déclenche
       l'accès aux remboursements même si le crédit n'est pas encore intégralement déblocable */
    function aUnDecaissement(p) { const b = DB.budgets.find(x => x.projet_id === p.id); return !!b && DB.decaissements.some(d => d.budget_id === b.id); }
    /* --------------------------------------------------------------------
       RELAIS — à chaque étape, quel profil doit agir et avec quelle action.
       Structuré par guichet : MPE/MEPS et Start-Up pourront y être ajoutés
       sans rien refactorer.
       -------------------------------------------------------------------- */
    const RELAIS = {
      'wf-agr': {
        // le workflow AGR démarre directement à l'ajout du plan d'affaires — la récupération
        // de la liste des projets sélectionnés n'est pas une étape interactive pour ce guichet
        // le plan d'affaires est d'abord joint par le CIP/AC, puis doit être validé par le chef
        // d'agence régionale (CAR) avant de pouvoir être transmis au chef de service (SDRF)
        PLAN_AFFAIRES: {
          roles: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? ['CAR'] : ['CIP', 'AC'],
          qui: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? "le chef d'agence régionale" : "l'agence régionale",
          action: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? "Valider le plan d'affaires" : "Joindre le plan d'affaires",
          court: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? "Valider" : "Joindre le plan",
          fn: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? 'validerPlanAffairesCar' : 'joindrePlanAffaires',
          quoi: p => (p.plan_affaires && !p.plan_affaires_valide_car) ? "Le chef d'agence régionale valide le plan d'affaires joint avant transmission au chef de service." : "L'agence régionale attache le plan d'affaires du promoteur au dossier."
        },
        TRANSMISSION: {
          roles: ['SDRF'], qui: "le chef de service dév. des ressources de financement",
          action: "Composer un lot de transmission", court: "Transmettre", route: '#transmission',
          quoi: "Répartir le dossier dans un lot Excel et le transmettre au partenaire financier."
        },
        TRAITEMENT_PF: {
          roles: ['PF'], qui: "le partenaire financier",
          action: "Traiter le dossier", court: "Traiter", fn: 'openTraitementPf',
          quoi: "Le partenaire ouvre le compte, accorde ou rejette le crédit et joint la convention."
        },
        DECAISSEMENT: {
          roles: ['PF'], qui: "le partenaire financier",
          action: "Saisir un décaissement", court: "Décaisser", fn: 'openDecaissementAgr',
          quoi: "Le partenaire saisit les lignes de décaissement avec leurs justificatifs.",
          /* action secondaire : dès le 1er décaissement, les remboursements peuvent
             commencer en parallèle — le partenaire peut saisir les deux en même temps */
          actions: p => aUnDecaissement(p) ? [{
            court: "Remboursements", fn: 'gererRemboursements', roles: ['PF'],
            label: "Gérer les remboursements", quoi: "Saisir les échéances de remboursement et suivre les impayés."
          }] : []
        },
        // à ce statut, deux actions coexistent en parallèle :
        //   • agence (CIP/CAR) : enregistrer une visite de suivi terrain
        //   • partenaire financier (PF) : saisir un décaissement (si crédit non soldé)
        //     ET/OU gérer les remboursements (dès le 1er décaissement)
        // Les deux flux sont indépendants — on n'attend pas que l'un soit terminé pour l'autre.
        SUIVI: {
          roles: p => aUnDecaissement(p) ? ['CIP', 'CAR', 'PF'] : ['CIP', 'CAR'],
          qui: p => (aUnDecaissement(p) && roleCode() === 'PF') ? "le partenaire financier" : "l'agence régionale",
          action: p => (aUnDecaissement(p) && roleCode() === 'PF') ? "Gérer les remboursements" : "Enregistrer une visite de suivi",
          court: p => (aUnDecaissement(p) && roleCode() === 'PF') ? "Remboursements" : "Visite de suivi",
          fn: p => (aUnDecaissement(p) && roleCode() === 'PF') ? 'gererRemboursements' : 'openVisiteSuivi',
          quoi: p => (aUnDecaissement(p) && roleCode() === 'PF') ? "Saisir les échéances de remboursement du bénéficiaire et suivre les impayés." : "Visite terrain : état du projet, difficultés, recommandations, GPS et photos.",
          /* action secondaire du PF en suivi : décaisser si le crédit n'est pas encore
             intégralement déblocable — les deux actions sont disponibles simultanément */
          actions: p => (!agrSolde(p) && aUnDecaissement(p) && roleCode() === 'PF') ?
            [{
              court: "Décaisser", fn: 'openDecaissementAgr', roles: ['PF'],
              label: "Saisir un décaissement", quoi: "Le partenaire saisit les lignes de décaissement avec leurs justificatifs."
            }] : []
        }
      }
    };
    /* MPE / MEPS — mêmes étapes pour les deux guichets. La chaîne de validation a un acteur
       qui change à chaque cran : les rôles sont donc calculés à partir du plan en cours. */
    RELAIS['wf-mpe'] = {
      RECUPERATION: {
        roles: ['SDRF'], qui: "le chef de service dév. des ressources de financement",
        action: "Composer un lot de transmission", court: "Transmettre", route: '#transmission',
        quoi: "Répartir le dossier dans un lot Excel et le transmettre au partenaire financier."
      },
      TRANSMISSION: {
        roles: ['PF'], qui: "le partenaire financier",
        action: "Traiter le dossier", court: "Traiter", fn: 'openTraitementPf',
        quoi: "Le partenaire ouvre le compte, accorde ou rejette le crédit et joint la convention."
      },
      IMPUTATION: {
        roles: ['CSFM'], qui: "le chef de service financement et monitoring",
        action: "Imputer le dossier", court: "Imputer", route: '#imputation',
        quoi: "Affecter le dossier à une agence selon la localisation, ou le conserver à la Direction."
      },
      PLAN_DECAISSEMENT: {
        roles: p => DB.projets.find(x => x.id === p.id)?.gere_par === 'DIRECTION' ? ['AGENT_DIR'] : ['CIP', 'AC'],
        qui: p => p.gere_par === 'DIRECTION' ? "un agent de la Direction" : "le conseiller en insertion professionnelle",
        action: p => planDuProjet(p.id) ? "Compléter le plan de décaissement" : "Saisir le plan de décaissement",
        court: "Plan de décaissement", fn: 'ouvrirPlanDuDossier',
        quoi: "Saisir les tranches, joindre le plan signé, puis le soumettre à la validation."
      },
      // un plan ajourné retourne au saisisseur (CIP/AC ou agent de la Direction, selon le guichet) —
      // sans ce cas particulier, la chaîne de validation ne rend plus personne responsable du dossier
      // (validateurAttendu renvoie null hors statut EN_VALIDATION) et il disparaît du « À faire » de tous.
      VALIDATION: {
        roles: p => {
          const pl = planDuProjet(p.id);
          if (pl && pl.statut === 'AJOURNE') { const r = (RELAIS[p.dispositif_id] || {}).PLAN_DECAISSEMENT; return r ? ((typeof r.roles === 'function' ? r.roles(p) : r.roles) || []) : []; }
          const v = validateurAttendu(pl); return v ? [v] : [];
        },
        qui: p => {
          const pl = planDuProjet(p.id);
          if (pl && pl.statut === 'AJOURNE') { const r = (RELAIS[p.dispositif_id] || {}).PLAN_DECAISSEMENT; return r ? (typeof r.qui === 'function' ? r.qui(p) : r.qui) : "le saisisseur du plan"; }
          const v = validateurAttendu(pl); return v ? (CHAINE_LIB[v] || v) : "la chaîne de validation";
        },
        action: p => planDuProjet(p.id)?.statut === 'AJOURNE' ? "Corriger et resoumettre le plan" : "Examiner le plan de décaissement",
        court: p => planDuProjet(p.id)?.statut === 'AJOURNE' ? "Corriger" : "Examiner", fn: 'ouvrirPlanDuDossier',
        quoi: p => planDuProjet(p.id)?.statut === 'AJOURNE' ? "Le plan a été ajourné par la chaîne de validation — corrigez-le puis soumettez-le à nouveau." : "Valider ou ajourner le plan, puis le transmettre au maillon suivant."
      },
      TRAITEMENT_PF: {
        roles: ['PF'], qui: "le partenaire financier",
        action: "Autoriser une tranche", court: "Autoriser", fn: 'ouvrirPlanDuDossier',
        quoi: "Autoriser les lignes de décaissement, une par une, dans l'ordre du plan validé."
      },
      // une fois le premier numéro autorisé, le dossier passe en DECAISSEMENT — mais ce statut
      // couvre tout le va-et-vient qui suit (PF autorise, agence exécute, PF autorise le numéro
      // suivant…) : le relais doit donc regarder l'état réel du numéro en cours, pas juste le statut
      DECAISSEMENT: {
        roles: p => { const t = numeroEnCoursDecaissement(p); return t ? t.roles : []; },
        qui: p => { const t = numeroEnCoursDecaissement(p); return t ? t.qui : "l'agence régionale"; },
        action: p => { const t = numeroEnCoursDecaissement(p); return t ? t.action : "Exécuter la tranche autorisée"; },
        court: p => { const t = numeroEnCoursDecaissement(p); return t ? t.court : "Exécuter" },
        fn: p => { const t = numeroEnCoursDecaissement(p); return t ? t.fn : 'ouvrirPlanDuDossier'; },
        quoi: p => { const t = numeroEnCoursDecaissement(p); return t ? t.quoi : "Exécuter les lignes autorisées par le partenaire, avec date et justificatif."; }
      },
      SUIVI: {
        roles: ['CIP', 'CAR'], qui: "l'agence régionale",
        action: "Enregistrer une visite de suivi", court: "Visite de suivi", fn: 'openVisiteSuivi',
        quoi: "Visite terrain : état du projet, difficultés, recommandations, GPS et photos."
      }
    };
    RELAIS['wf-meps'] = RELAIS['wf-mpe'];
    /* Projets structurants / Start-Up — pas d'imputation ; les conventions de prêt sont
       ajoutées par le service Risques, Garanties et Contentieux pendant la saisie du plan. */
    RELAIS['wf-startup'] = {
      RECUPERATION: RELAIS['wf-mpe'].RECUPERATION,
      TRANSMISSION: RELAIS['wf-mpe'].TRANSMISSION,
      PLAN_DECAISSEMENT: {
        roles: ['CIP', 'AC', 'CSRGC'], qui: "le conseiller en insertion professionnelle et le service Garanties",

        court: "Plan & convention", fn: 'ouvrirPlanDuDossier',
        quoi: "Saisir les tranches ; en parallèle, le service Risques, Garanties et Contentieux joint la convention de prêt signée."
      },
      VALIDATION: RELAIS['wf-mpe'].VALIDATION,

      DECAISSEMENT: RELAIS['wf-mpe'].DECAISSEMENT,
      SUIVI: RELAIS['wf-mpe'].SUIVI
    };
    // le dossier p9 est resté à la Direction (non imputé à une agence), p10 et p12 sont déjà en agence
    (() => {
      const p9 = DB.projets.find(p => p.id === 'p9'); Object.assign(p9, { impute: true, gere_par: 'DIRECTION' });
      if (p9.statut === 'IMPUTATION') avancer(p9);
    })();
    /* le relais attendu pour un dossier, ou null si son guichet n'est pas encore décrit */
    function relaisDe(p) { return p ? ((RELAIS[p.dispositif_id] || {})[p.statut] || null) : null; }
    /* les rôles attendus — la liste peut dépendre du dossier (ex. le cran courant de la chaîne) */
    function rolesAttendus(p) {
      const r = relaisDe(p); if (!r) return [];
      return (typeof r.roles === 'function' ? r.roles(p) : r.roles) || [];
    }
    /* le profil connecté est-il celui qu'on attend sur ce dossier ? */
    function cestMonTour(p) {
      const r = relaisDe(p);
      if (!r || !SESSION || SESSION.kind === 'benef' || p.gele) return false;
      if (!inScope('projets', p)) return false;   // une agence n'agit que sur les dossiers de sa zone
      // l'administrateur consulte le circuit de financement, il n'agit pas à la place des acteurs métier
      return rolesAttendus(p).includes(roleCode());
    }
    /* libellé lisible des profils attendus : « l'agence régionale », « le partenaire financier »… */
    function acteursAttendus(p) {
      const r = relaisDe(p); if (!r) return '';
      const qui = typeof r.qui === 'function' ? r.qui(p) : r.qui;
      return qui || rolesAttendus(p).map(c => CHAINE_LIB[c] || (DB.roles.find(x => x.code === c) || {}).libelle || c).join(' ou ');
    }
    /* intitulé du bouton — peut lui aussi dépendre de l'état du dossier */
    function actionAttendue(p) {
      const r = relaisDe(p); if (!r) return '';
      return typeof r.action === 'function' ? r.action(p) : r.action;
    }
    /* le dossier est-il arrivé au bout de son parcours ? */
    const parcoursTermine = p => { const L = etapesDe(p.dispositif_id); return L[L.length - 1].k === p.statut; };
    /* dossiers en attente d'une action du profil connecté */
    function mesDossiersEnAttente(dispositifId) {
      return DB.projets.filter(p => (!dispositifId || p.dispositif_id === dispositifId) && inScope('projets', p) && cestMonTour(p));
    }

    /* Les dossiers AGR du jeu de données initial suivaient l'ancien manuel (soumission →
       analyse → certification → financement). On les répartit sur les 5 étapes du workflow AGR
       dans le système (le plan d'affaires est le point de départ), en veillant à ce qu'aucune
       étape ne soit vide : chaque acteur du circuit a ainsi un dossier qui l'attend dès
       l'ouverture de la démonstration. */
    const _AGR_DEMO = {
      p13: 'PLAN_AFFAIRES',  // l'agence doit joindre le plan d'affaires
      p1: 'PLAN_AFFAIRES',  // idem — deux dossiers en attente côté agence
      p2: 'TRANSMISSION',   // prêt à partir en lot
      p14: 'TRAITEMENT_PF',  // chez le partenaire
      p6: 'DECAISSEMENT',   // décaissements en cours
      p7: 'SUIVI',          // en exploitation, visites de suivi
      p15: 'SUIVI',          // en exploitation, remboursements à jour (démo portefeuille recouvrement)
      p16: 'SUIVI'           // en exploitation, dossier déjà sorti du portefeuille (démo contentieux + garantie)
    };
    DB.projets.filter(p => p.dispositif_id === 'wf-agr').forEach(p => {
      const k = _AGR_DEMO[p.id];
      if (k) { const e = ETAPES_AGR.find(x => x.k === k); p.statut = k; p.etape = e.etape; }
      else if (!ETAPES_AGR.some(x => x.k === p.statut)) { const e0 = ETAPES_AGR[0]; p.statut = e0.k; p.etape = e0.etape; }
      // le plan d'affaires n'est joint qu'à partir de l'étape 8 (transmission)
      if (p.id === 'p1') { p.plan_affaires = 'plan_affaires_dossier_p1.pdf'; p.plan_affaires_valide_car = false; } else if (p.etape < 8) p.plan_affaires = '';
    });
    /* cohérence des données rattachées : un dossier qui n'est pas encore parti chez le partenaire
       ne peut avoir ni lot, ni budget, ni décaissement, ni visite de suivi. */
    DB.projets.filter(p => p.dispositif_id === 'wf-agr' && p.etape < 9).forEach(p => {
      p.lot_id = null;
      DB.budgets = DB.budgets.filter(b => b.projet_id !== p.id);
      DB.decaissements = DB.decaissements.filter(d => d.projet_id !== p.id);
      DB.suivis = DB.suivis.filter(s => s.projet_id !== p.id);
      DB.remboursements = DB.remboursements.filter(r => r.projet_id !== p.id);
    });
    // le dossier en cours d'instruction chez le partenaire : parti dans un lot, décision attendue
    (() => {
      const p14 = DB.projets.find(p => p.id === 'p14'); if (!p14) return;
      p14.lot_id = 'lot-agr';
      DB.lots.push({
        id: 'lot-agr', reference: "LOT-AGR-2024-018", dispositif_id: 'wf-agr', organisme_id: 'or1',
        fichier_repartition: "repartition_agr_dec2024.xlsx", courrier_fichier: "courrier_transmission_0138.pdf",
        courrier_reference: "CRT-2024-0138", courrier_titre: "Transmission lot AGR — Décembre 2024",
        date_transmission: "2024-12-20", taux_couverture: 80, duree_differe: 3, duree_remboursement: 24,
        reference_convention: "CONV-UNA-2024-0072", statut: 'TRANSMIS', cree_par: 'u-sdrf', cree: "2024-12-19"
      });
      DB.budgets.push({
        id: 'b14', projet_id: 'p14', reference_courrier: "CRT-2024-0138",
        titre_courrier: "Transmission lot AGR — Décembre 2024", date_transmission: "2024-12-20",
        taux_couverture: 80, duree_differe: 3, reference_convention: "CONV-UNA-2024-0072",
        montant: p14.montant, approbation: 'EN_ATTENTE', duree_remboursement: 24, convention: 'EN_COURS', deblocage: 'NON'
      });
    })();

    /* un plan soumis implique que le dossier est entré dans la chaîne de validation */
    DB.plans_decaissement.filter(pl => pl.statut === 'EN_VALIDATION').forEach(pl => {
      const p = DB.projets.find(x => x.id === pl.projet_id);
      if (p && p.statut === 'PLAN_DECAISSEMENT') {
        const e = etapesDe(p.dispositif_id).find(s => s.k === 'VALIDATION');
        if (e) { p.statut = e.k; p.etape = e.etape; }
      }
    });

    /* Les dossiers MPE/MEPS du jeu de données initial suivaient l'ancien manuel PRCO 4
       (instruction → certification). On les repositionne sur le parcours arrêté en réunion DFP. */
    DB.projets.filter(p => ['wf-mpe', 'wf-meps'].includes(p.dispositif_id))
      .forEach(p => {
        if (p.id === 'p4') { p.statut = 'TRANSMISSION'; p.etape = 2; }
        else if (p.id === 'p5') { p.statut = 'IMPUTATION'; p.etape = 3; p.impute = false; }
        else if (p.id === 'p8') { p.statut = 'PLAN_DECAISSEMENT'; p.etape = 4; }
        else if (p.id === 'p11') { p.statut = 'VALIDATION'; p.etape = 5; }
        else { p.statut = 'RECUPERATION'; p.etape = 1; p.impute = false; }
        p.statut_selection = p.statut_selection || 'Retenu';
        p.statut_formation = p.statut_formation || 'Formé';
      });
    (() => {
      const p10 = DB.projets.find(p => p.id === 'p10');
      if (p10) { p10.dispositif_id = 'wf-startup'; p10.statut = 'PLAN_DECAISSEMENT'; p10.etape = 3; }
    })();
    // p4 est parti dans un lot et attend la décision du partenaire financier
    (() => {
      const p4 = DB.projets.find(p => p.id === 'p4'); if (!p4 || DB.budgets.some(b => b.projet_id === 'p4')) return;
      p4.lot_id = 'lot2';
      DB.budgets.push({
        id: 'b4', projet_id: 'p4', reference_courrier: "CRT-2024-0127", titre_courrier: "Transmission lot MEPS — Décembre 2024",
        date_transmission: "2024-12-04", taux_couverture: 75, duree_differe: 6, reference_convention: "CONV-OBA-2024-0061",
        montant: p4.montant, approbation: 'EN_ATTENTE', duree_remboursement: 36, convention: 'EN_COURS', deblocage: 'NON'
      });
    })();



    /* ====================================================================
       DOSSIERS DÉMO ÉLIGIBLES À LA TRANSMISSION — AU MOINS 5 PAR GUICHET
       ==================================================================== */
    (() => {
      // S'assurer que p2 (AGR) a un plan d'affaires joint pour être transmissible
      const p2 = DB.projets.find(p => p.id === 'p2');
      if (p2) { p2.statut = 'TRANSMISSION'; p2.etape = 8; p2.plan_affaires = 'plan_affaires_p2.pdf'; p2.lot_id = null; }

      // S'assurer que p3 (MEPS) est à l'étape RECUPERATION sans lot pour être transmissible
      const p3 = DB.projets.find(p => p.id === 'p3');
      if (p3) { p3.statut = 'RECUPERATION'; p3.etape = 1; p3.lot_id = null; }

      const PROJETS_TRANSMISSIBLES = [
        // AGR (4 complémentaires + p2 = 5 transmissibles)
        { id: 'p_t_agr_1', code: 'MP-3001-AGR', titre: "Élevage de poules pondeuses", jeune_id: 'j13', dispositif_id: 'wf-agr', agence_id: 'ag1', organisme_id: 'or1', montant: 950000, statut: 'TRANSMISSION', etape: 8, cree: "2025-01-20", plan_affaires: 'plan_affaires_3001.pdf' },
        { id: 'p_t_agr_2', code: 'MP-3002-AGR', titre: "Atelier de transformation de manioc", jeune_id: 'j14', dispositif_id: 'wf-agr', agence_id: 'ag2', organisme_id: 'or1', montant: 700000, statut: 'TRANSMISSION', etape: 8, cree: "2025-01-22", plan_affaires: 'plan_affaires_3002.pdf' },
        { id: 'p_t_agr_3', code: 'MP-3003-AGR', titre: "Vente de céréales & vivres frais", jeune_id: 'j15', dispositif_id: 'wf-agr', agence_id: 'ag3', organisme_id: 'or1', montant: 600000, statut: 'TRANSMISSION', etape: 8, cree: "2025-01-25", plan_affaires: 'plan_affaires_3003.pdf' },
        { id: 'p_t_agr_4', code: 'MP-3004-AGR', titre: "Atelier de menuiserie métallique", jeune_id: 'j16', dispositif_id: 'wf-agr', agence_id: 'ag4', organisme_id: 'or1', montant: 900000, statut: 'TRANSMISSION', etape: 8, cree: "2025-01-28", plan_affaires: 'plan_affaires_3004.pdf' },

        // MPE (4 complémentaires + p8 = 5 transmissibles)
        { id: 'p_t_mpe_1', code: 'MP-3005-MPE', titre: "Boulangerie artisanale moderne", jeune_id: 'j8', dispositif_id: 'wf-mpe', agence_id: 'ag1', organisme_id: 'or2', montant: 4200000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-10" },
        { id: 'p_t_mpe_2', code: 'MP-3006-MPE', titre: "Imprimerie & sérigraphie numérique", jeune_id: 'j9', dispositif_id: 'wf-mpe', agence_id: 'ag2', organisme_id: 'or2', montant: 3800000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-12" },
        { id: 'p_t_mpe_3', code: 'MP-3007-MPE', titre: "Fabrique de pavés & parpaings", jeune_id: 'j5', dispositif_id: 'wf-mpe', agence_id: 'ag3', organisme_id: 'or3', montant: 5000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-15" },
        { id: 'p_t_mpe_4', code: 'MP-3008-MPE', titre: "Unité de froid & conservation de poisson", jeune_id: 'j12', dispositif_id: 'wf-mpe', agence_id: 'ag4', organisme_id: 'or2', montant: 4500000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-18" },

        // MEPS (4 complémentaires + p3 = 5 transmissibles)
        { id: 'p_t_meps_1', code: 'MP-3009-MEPS', titre: "Centrale de distribution phytosanitaire", jeune_id: 'j3', dispositif_id: 'wf-meps', agence_id: 'ag4', organisme_id: 'or2', montant: 18000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-11" },
        { id: 'p_t_meps_2', code: 'MP-3010-MEPS', titre: "Complexe agro-pastoral de Korhogo", jeune_id: 'j4', dispositif_id: 'wf-meps', agence_id: 'ag3', organisme_id: 'or3', montant: 30000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-14" },

        { id: 'p_t_meps_4', code: 'MP-3012-MEPS', titre: "Laboratoire d'analyse de sols agricoles", jeune_id: 'j17', dispositif_id: 'wf-meps', agence_id: 'ag2', organisme_id: 'or1', montant: 15000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-19" },

        // Start-Up (4 complémentaires + p11 = 5 transmissibles)
        { id: 'p_t_stup_1', code: 'MP-3013-STUP', titre: "Plateforme Logistique & Géolocalisation IoT", jeune_id: 'j11', dispositif_id: 'wf-startup', agence_id: 'ag1', organisme_id: 'or1', montant: 35000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-13" },
        { id: 'p_t_stup_2', code: 'MP-3014-STUP', titre: "Solution FinTech de paiement mobile rural", jeune_id: 'j12', dispositif_id: 'wf-startup', agence_id: 'ag4', organisme_id: 'or2', montant: 50000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-15" },
        { id: 'p_t_stup_3', code: 'MP-3015-STUP', titre: "Application DroneAgri cartographie de cultures", jeune_id: 'j8', dispositif_id: 'wf-startup', agence_id: 'ag2', organisme_id: 'or1', montant: 28000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-17" },
        { id: 'p_t_stup_4', code: 'MP-3016-STUP', titre: "Marketplace solaire & kits photovoltaïques", jeune_id: 'j13', dispositif_id: 'wf-startup', agence_id: 'ag3', organisme_id: 'or3', montant: 40000000, statut: 'RECUPERATION', etape: 1, cree: "2025-01-20" }
      ];

      PROJETS_TRANSMISSIBLES.forEach(p => {
        if (!DB.projets.some(x => x.id === p.id)) {
          DB.projets.push(p);
        }
      });
    })();

    /* ====================================================================
       RESOURCE REGISTRY — data-driven CRUD (tables + forms)
       f: fields  {k,label,type,ref,opts,req,hint,half}
       c: columns {k,label,r(render)}
       ==================================================================== */
    const badge = (txt, cls) => `<span class="badge ${cls}">${txt}</span>`;
    const RES = {
      roles: {

    /* ====================================================================
       UI HELPERS — toast, modal, form, confirm, drawer
       ==================================================================== */
    function toast(msg) { const t = el(`<div class="toast">${ic('check')}${msg}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
    function closeLayer() { $('#layer').innerHTML = ''; }
    /* Relevé de la position GPS — partagé par la fiche de visite guidée et le formulaire générique.
       En cas d'échec, les champs restent saisissables : l'agent n'est jamais bloqué. */
    function brancherGeoloc(btn, inLat, inLng, note) {
      if (!btn || !inLat || !inLng) return;
      const dire = (txt, cls) => { if (note) { note.className = 'geo-note' + (cls ? ' ' + cls : ''); note.textContent = txt; } };
      btn.onclick = () => {
        if (!navigator.geolocation) { dire("La géolocalisation n'est pas disponible sur cet appareil.", 'ko'); return; }
        const initial = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = ic('clock') + 'Localisation en cours…';
        dire('Recherche du signal GPS…');
        const fini = () => { btn.disabled = false; btn.innerHTML = initial; };
        navigator.geolocation.getCurrentPosition(
          pos => {
            inLat.value = pos.coords.latitude.toFixed(6); inLng.value = pos.coords.longitude.toFixed(6);
            fini(); dire(`Position relevée · précision ${Math.round(pos.coords.accuracy)} m`, 'ok');
          },
          err => {
            fini(); dire(err.code === 1 ? "Autorisation refusée — saisissez les coordonnées à la main."
              : err.code === 3 ? "Délai dépassé — réessayez ou saisissez les coordonnées à la main."
                : "Position indisponible — saisissez les coordonnées à la main.", 'ko');
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      };
    }

    function fieldHTML(f, val, obj) {
      const id = 'fld_' + f.k; const req = f.req ? '<span class="req">*</span>' : '';
      let inner = '';
      if (f.type === 'textarea') inner = `<textarea id="${id}">${val ?? ''}</textarea>`;
      else if (f.type === 'switch') inner = `<label class="switch"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}><span class="sl"></span></label>`;
      else if (f.type === 'select') {
        let opts = '<option value="">— Choisir —</option>';
        if (f.ref) {
          let list = DB[f.ref] || [];
          if (f.refFiltre) list = list.filter(o => o.id === val || f.refFiltre(o));
          if (f.oneProjetOnly) list = list.filter(o => o.id === val || !DB.projets.some(p => p.jeune_id === o.id && p.id !== obj?.id));
          list.forEach(o => { const lb = f.ref === 'projets' ? projetLabel(o) : (f.ref === 'budgets' ? budgetLabel(o) : (o.libelle || o.titre || o.raison_sociale || o.nom || (o.prenoms ? (o.prenoms + ' ' + o.nom) : '') || o.matricule || o.id)); opts += `<option value="${o.id}" ${o.id === val ? 'selected' : ''}>${lb}</option>`; });
        }
        else if (f.opts) { f.opts.forEach(o => opts += `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`); }
        inner = `<select id="${id}">${opts}</select>`;
      } else if (f.type === 'geo') {
        const [la, lo] = String(val ?? '').split(',').map(x => x.trim());
        inner = `<div class="frow" style="margin:0">
       <div class="field half" style="margin:0"><input id="${id}_lat" inputmode="decimal" placeholder="Latitude" value="${la || ''}"></div>
       <div class="field half" style="margin:0"><input id="${id}_lng" inputmode="decimal" placeholder="Longitude" value="${lo || ''}"></div>
     </div>
     <button type="button" class="btn sm geo-btn" data-geo="${id}" style="margin-top:8px">${ic('pin')}Utiliser ma position actuelle</button>
     <div class="geo-note" id="${id}_note">Saisissez les coordonnées, ou relevez-les si vous êtes sur le site.</div>`;
      } else inner = `<input id="${id}" type="${f.type || 'text'}" value="${val ?? ''}">`;
      return `<div class="field${f.half ? ' half' : ''}"><label for="${id}">${f.label} ${req}</label>${inner}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
    }
    function buildFields(fields, obj) {
      // group half-width into rows
      let html = ''; let buf = [];
      const flush = () => { if (!buf.length) return; if (buf.length === 1) { html += buf[0]; } else { for (let i = 0; i < buf.length; i += 2) { html += `<div class="frow">${buf[i] || ''}${buf[i + 1] || ''}</div>`; } } buf = []; };
      fields.forEach(f => { const v = obj ? obj[f.k] : (f.type === 'switch' ? true : ''); if (f.half) { buf.push(fieldHTML(f, v, obj)); } else { flush(); html += fieldHTML(f, v, obj); } });
      flush(); return html;
    }
    function readFields(fields) {
      const o = {}; fields.forEach(f => {
        if (f.type === 'geo') {
          const la = $('#fld_' + f.k + '_lat'), lo = $('#fld_' + f.k + '_lng'); if (!la || !lo) return;
          const a = la.value.trim(), b = lo.value.trim();
          o[f.k] = (a && b) ? `${a}, ${b}` : ''; o._geoIncomplet = o._geoIncomplet || (!!a !== !!b);
          return;
        }
        const n = $('#fld_' + f.k); if (!n) return;
        o[f.k] = f.type === 'switch' ? n.checked : f.type === 'number' ? (n.value ? +n.value : null) : n.value;
      });
      return o;
    }
    function openForm(resKey, id) {
      const R = RES[resKey]; const isEdit = !!id; const obj = isEdit ? DB[R.res].find(x => x.id === id) : null;
      const ov = el(`<div class="ov"><div class="modal"><div class="mh"><h3>${isEdit ? 'Modifier' : 'Nouveau'} ${R.sing}</h3><button class="x">${ic('x')}</button></div><div class="mb">${buildFields(R.f, obj)}</div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${isEdit ? 'Enregistrer' : 'Créer'}</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      // boutons « Utiliser ma position actuelle » des champs de type geo
      ov.querySelectorAll('[data-geo]').forEach(b => {
        const base = b.dataset.geo;
        brancherGeoloc(b, ov.querySelector('#' + base + '_lat'), ov.querySelector('#' + base + '_lng'), ov.querySelector('#' + base + '_note'));
      });
      ov.querySelector('[data-s]').onclick = () => {
        const data = readFields(R.f);
        if (data._geoIncomplet) { toast("Renseignez la latitude et la longitude, ou laissez les deux vides"); return; }
        delete data._geoIncomplet;
        const miss = R.f.filter(f => f.req && !data[f.k]);
        if (miss.length) { toast('Champs requis : ' + miss.map(m => m.label).join(', ')); return; }
        if (!isEdit && R.valider) { const err = R.valider(data); if (err) { toast(err); return; } }
        if (isEdit) { Object.assign(obj, data); } else { data.id = uid(R.res); DB[R.res].push(data); }
        if (R.after) R.after(isEdit ? obj : data, isEdit);
        toast(R.sing[0].toUpperCase() + R.sing.slice(1) + (isEdit ? ' modifié' : ' créé'));
        close(); route();
      };
    }
    function confirmDelete(resKey, id) {
      const R = RES[resKey]; const obj = DB[R.res].find(x => x.id === id);

    /* une notification concerne l'utilisateur courant si son profil est ciblé et,
       pour un profil cloisonné, si le dossier relève de son agence */
    function notifPourMoi(n) {
      if (!SESSION || SESSION.kind === 'benef') return false;
      const rc = roleCode();
      if (rc !== 'ADMIN' && !n.cibles.includes(rc)) return false;
      const ag = agencyScopeId();
      if (ag && n.agence_id && n.agence_id !== ag) return false;
      return true;

    /* horodatage relatif, dans le même esprit que les libellés existants de la cloche */
    function ilYA(iso) {
      const d = Math.max(0, Date.now() - new Date(iso));
      const mn = Math.floor(d / 6e4); if (mn < 1) return "à l'instant";
      if (mn < 60) return `il y a ${mn} min`;
      const h = Math.floor(mn / 60); if (h < 24) return `il y a ${h} h`;
      const j = Math.floor(h / 24); return j === 1 ? 'hier' : `il y a ${j} j`;
    }

    /* « Annulation du prêt » : le dossier est figé, plus aucune action n'est possible. */
    function estGele(p, avecMessage) {

      return true;

   ${soustitre ? `<p style="margin:0 0 14px;color:var(--slate);font-size:13px">${soustitre}</p>` : ''}
   <div class="imp-drop">${ic('doc')}<div><b>Déposer le fichier Excel</b><span>Clé de rapprochement : <b class="mono">N° de dossier</b></span></div></div>
   ${colonnes.length ? `<div class="imp-cols"><b>Colonnes attendues</b><div>${colonnes.map(c => `<span class="mono">${c}</span>`).join('')}</div></div>` : ''}
   ${modele ? `<div class="imp-modele">${ic('doc')} Modèle « ${modele} » <em>— à fournir par l'AEJ</em></div>` : ''}
   <div class="sect-t">Lignes reconnues dans le fichier (${lignes.length})</div>
   <div class="imp-list">${rows || '<div class="empty">Aucune ligne à importer</div>'}</div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn pri" data-s>${ic('check')}${libelleAction}</button></div></div></div>`);

    /* ---- RECHERCHE GLOBALE (nom, téléphone ou N° de dossier) ----

    function rechercheGlobale(q) {
      const t = q.trim().toLowerCase(); if (t.length < 2) return null;
      const norm = s => (s || '').toLowerCase().replace(/[\s.\-+()]/g, '');
      const nt = norm(t);
      const jeunes = DB.jeunes.filter(j => inScope('jeunes', j) && (
        `${j.prenoms} ${j.nom}`.toLowerCase().includes(t) || `${j.nom} ${j.prenoms}`.toLowerCase().includes(t) ||
        norm(j.telephone).includes(nt) || (j.matricule || '').toLowerCase().includes(t) || (j.num_piece || '').toLowerCase().includes(t)));
      const projets = DB.projets.filter(p => inScope('projets', p) && (
        (p.code || '').toLowerCase().includes(t) || p.titre.toLowerCase().includes(t) ||
        jeunes.some(j => j.id === p.jeune_id)));
      return { jeunes: jeunes.slice(0, 6), projets: projets.slice(0, 6) };
    }

    /* ---- generic resource view ---- */
    function pagerHTML(page, pages, total, size, from, to) {
      if (pages <= 1) return `<div class="pager"><span class="info">${total} élément(s)</span><select data-size>${[6, 12, 24].map(s => `<option value="${s}" ${s === size ? 'selected' : ''}>${s} / page</option>`).join('')}</select></div>`;
      let nums = ''; const add = p => nums += `<button data-go="${p}" class="${p === page ? 'on' : ''}">${p}</button>`; const gap = () => nums += '<span class="gap">…</span>';
      const set = new Set([1, 2, pages - 1, pages, page - 1, page, page + 1]); let last = 0;
      for (let p = 1; p <= pages; p++) { if (set.has(p) && p >= 1 && p <= pages) { if (p - last > 1) gap(); add(p); last = p; } }
      return `<div class="pager">
   <span class="info">${from}–${to} sur ${total}</span>
   <select data-size>${[6, 12, 24].map(s => `<option value="${s}" ${s === size ? 'selected' : ''}>${s} / page</option>`).join('')}</select>
   <button data-go="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹</button>${nums}<button data-go="${page + 1}" ${page >= pages ? 'disabled' : ''}>›</button>
 </div>`;
    }
    function resourceView(resKey, opts = {}) {
      const R = RES[resKey]; const M = MODULES.find(m => m.k === R.mod);

      if (q) rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(q));
      const total = rows.length; const pages = Math.max(1, Math.ceil(total / size));
      let page = Math.min(Math.max(1, opts.page || 1), pages);
      const from = total ? (page - 1) * size + 1 : 0, to = Math.min(page * size, total);
      const pageRows = rows.slice((page - 1) * size, page * size);
      // certaines ressources réservent la création/édition/suppression à un rôle précis
      // (ex. « garanties » : seul le partenaire financier) — ce droit remplace celui du module,
      // il ne fait pas que le restreindre : PF doit pouvoir créer même s'il n'a que la lecture
      // sur le module « recouvrement » (qui sert aussi aux actions amiables du CSFM/CSRGC)
      const canC = R.seul ? R.seul.includes(roleCode()) : can(R.mod, 'c');
      const canE = R.seul ? R.seul.includes(roleCode()) : can(R.mod, 'e');
      const canD = R.seul ? R.seul.includes(roleCode()) : can(R.mod, 'd');
      const cols = R.c;
      const hasActCol = (canE || canD || resKey === 'projets');
      const head = cols.map(c => `<th>${c.label || ''}</th>`).join('') + (hasActCol ? '<th style="text-align:right">Actions</th>' : '');
      const body = pageRows.map(r => {
        const tds = cols.map(c => `<td>${c.r ? c.r(r) : (r[c.k] ?? '')}</td>`).join('');
        let act = '';
        if (hasActCol) {
          const expPlanBtn = (resKey === 'projets' && planDuProjet(r.id)) ? `<button class="iconbtn" data-exp-plan="${r.id}" title="Exporter le plan de décaissement">${ic('dl')}</button>` : '';

      }).join('');

   <div class="pgt">
     <div class="searchbox">${ic('search')}<input id="qbox" placeholder="Rechercher un ${R.sing}…" value="${opts.q || ''}"></div>

     <div class="sp"></div>
     ${(canC && !opts.hideAdd) ? `<button class="btn pri" id="addBtn">${ic('plus')}Nouveau ${R.sing}</button>` : ''}
   </div>
   <div class="card"><div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="20"><div class="empty">${ic(M.icon)}<b>Aucun résultat</b><span>Aucun ${R.sing} ne correspond.</span></div></td></tr>`}</tbody></table></div>${total ? pagerHTML(page, pages, total, size, from, to) : ''}</div>
 </div>`);
      // bouton d'action du relais, posé directement sur la ligne
      wrap.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); lancerAction(b.dataset.act); });
      wrap.querySelectorAll('[data-act-sec]').forEach(b => b.onclick = e => { e.stopPropagation(); const fn = window[b.dataset.fn]; if (fn) fn(b.dataset.actSec); });

      wrap.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmDelete(resKey, b.dataset.del));

      const rerender = (o) => { const nw = resourceView(resKey, { q: opts.q || '', size, page, filtre: opts.filtre, hideAdd: opts.hideAdd, ...o }); wrap.replaceWith(nw); return nw; };
      wrap.querySelectorAll('[data-go]').forEach(b => b.onclick = () => rerender({ page: +b.dataset.go }));
      const sel = wrap.querySelector('[data-size]'); if (sel) sel.onchange = () => rerender({ size: +sel.value, page: 1 });

        return `<div class="tl2 ${cls}"><span class="pt"></span><h5>${c.code} · ${c.t}</h5><div class="d">${txt}</div></div>`;
      }).join('');
      const workflow = `<div class="sect-t">Progression dans les ${wf.cycles.length} cycles (workflow_instance)</div><div class="tl2wrap">${tl}</div>`;
      // ---- Pièces tab
      const docs = DB.documents.filter(x => x.micro_projet_id === id);
      const docList = DOCTYPES.map(t => {

      }).join('');
      const pieces = `<div class="sect-t">Pièces du dossier (documents)</div>${docList}
   ${canDoc ? `<div class="field" style="margin-top:14px"><label>Ajouter une pièce reçue</label><div style="display:flex;gap:8px"><select id="docSel" style="flex:1">${DOCTYPES.map(t => `<option>${t}</option>`).join('')}</select><button class="btn grn sm" id="docAdd">${ic('plus')}Ajouter</button></div></div>` : ''}`;
      // ---- Observations tab
      const obs = DB.observations.filter(x => x.micro_projet_id === id);
      const obsList = obs.length ? obs.map(o => `<div class="obs-i"><b>${ref('personnels', o.auteur_id)}</b> <em>${o.created || ''}</em><p>${o.observation}</p></div>`).join('') : '<p style="color:var(--slate);font-size:13px">Aucune observation.</p>';
      const observ = `<div class="sect-t">Observations des agents</div><div id="obsList">${obsList}</div>
   ${canObs ? `<div class="field" style="margin-top:12px"><label>Nouvelle observation</label><textarea id="obsTxt" rows="2" placeholder="Votre remarque sur le dossier…"></textarea></div><div style="display:flex;justify-content:flex-end"><button class="btn grn sm" id="obsAdd">${ic('plus')}Ajouter</button></div>` : ''}`;
      const ov = el(`<div class="drawer-ov"></div>`);
      const dr = el(`<div class="drawer">
   <div class="dh" style="display:flex;align-items:center;gap:12px"><div><div style="font-size:11px;color:var(--slate)"><span class="mono">${p.code}</span> · ${p.type_projet || 'INDIVIDUEL'} · ${d.code}</div><h1 style="font-size:17px">${p.titre}</h1><div style="font-size:12px;color:var(--slate)">${j.prenoms} ${j.nom} · ${ref('secteurs', j.secteur_id)}</div></div><div class="sp" style="flex:1"></div>${badge(s.label, s.cls)}<button class="x">${ic('x')}</button></div>
   <div class="mtabs"><button class="on" data-mt="mt-i">Dossier</button><button data-mt="mt-w">Parcours workflow</button><button data-mt="mt-d">Pièces</button><button data-mt="mt-o">Observations</button><button class="btn sm ghost" data-ant style="margin-left:auto;align-self:center;font-size:12px">${ic('users')} Antécédents</button></div>
   <div class="db">
     ${barreRelais(p)}
     <div class="mtab on" id="mt-i">${dossier}</div>
     <div class="mtab" id="mt-w">${workflow}</div>
     <div class="mtab" id="mt-d">${pieces}</div>
     <div class="mtab" id="mt-o">${observ}</div>
   </div>
   <div class="dfoot">
     <button class="btn" data-close>Fermer</button>
     <button class="btn ghost" data-synop>${ic('doc')} Fiche synoptique</button>
          ${plan ? `<button class="btn ghost" data-plan>${ic('money')} Plan de décaissement</button>` : ''}
     ${(roleCode() === 'PF' && DB.decaissements.some(d => d.projet_id === id)) ? `<button class="btn ghost" data-remb>${ic('repay')} Gérer les remboursements</button>` : ''}
     ${peutConvention ? `<button class="btn grn" data-conv>${ic('doc')}Convention de prêt signée</button>` : ''}
     ${peutAnnuler ? `<button class="btn danger" data-annul>${ic('lock')}Annulation du prêt</button>` : ''}
   </div>
 </div>`);
      $('#layer').appendChild(ov); $('#layer').appendChild(dr);
      const close = () => closeLayer(); ov.onclick = close; dr.querySelector('.x').onclick = close; dr.querySelector('[data-close]').onclick = close;
      dr.querySelector('[data-synop]').onclick = () => openFicheSynoptique(id);
      dr.querySelector('[data-ant]').onclick = () => { close(); openAntecedents(p.jeune_id); };
      brancherRelais(dr, p, close);
      const pb = dr.querySelector('[data-plan]'); if (pb) pb.onclick = () => { close(); openPlan(plan.id); };
      const rbBtn = dr.querySelector('[data-remb]'); if (rbBtn) rbBtn.onclick = () => { close(); gererRemboursements(id); };
      const ab = dr.querySelector('[data-annul]'); if (ab) ab.onclick = () => { close(); annulerPret(p.id); };
      const cb = dr.querySelector('[data-conv]'); if (cb) cb.onclick = () => { close(); ajouterConvention(p.id); };
      dr.querySelectorAll('[data-mt]').forEach(t => t.onclick = () => { dr.querySelectorAll('.mtabs button').forEach(x => x.classList.toggle('on', x === t)); dr.querySelectorAll('.mtab').forEach(m => m.classList.toggle('on', m.id === t.dataset.mt)); });
      const docAdd = dr.querySelector('#docAdd'); if (docAdd) docAdd.onclick = () => { const t = dr.querySelector('#docSel').value; DB.documents.push({ id: uid('doc'), micro_projet_id: id, type_document: t, fichier: 'piece.pdf' }); toast('Pièce « ' + t + ' » ajoutée'); close(); openProjet(id); };
      const obsAdd = dr.querySelector('#obsAdd'); if (obsAdd) obsAdd.onclick = () => { const t = dr.querySelector('#obsTxt').value.trim(); if (!t) { toast('Saisissez une observation'); return; } DB.observations.push({ id: uid('ob'), micro_projet_id: id, auteur_id: SESSION.id, observation: t, created: new Date().toISOString().slice(0, 10) }); toast('Observation enregistrée'); close(); openProjet(id); };
    }
    /* ---- CONVENTIONS DE PRÊT SIGNÉES (service Risques, Garanties et Contentieux) ----
       « En même temps que les plans de décaissement sont ajoutés par les agences régionales,
         le chef de service contentieux et garantie ajoute pour chaque dossier les conventions
         de prêts signées. Cette information est notifiée à l'ensemble des utilisateurs. » */
    function ajouterConvention(pid) {
      const p = DB.projets.find(x => x.id === pid);
      let b = DB.budgets.find(x => x.projet_id === pid);
      if (!b) { b = { id: uid('b'), projet_id: pid, montant: p.montant, approbation: 'EN_ATTENTE', convention: 'EN_COURS', deblocage: 'NON' }; DB.budgets.push(b); }
      const ov = el(`<div class="ov"><div class="modal" style="max-width:480px"><div class="mh"><h3>Convention de prêt — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <p style="margin:0 0 14px;color:var(--slate);font-size:13px">${p.titre} — ${ref('jeunes', p.jeune_id)} · ${ref('organismes', p.organisme_id)}<br>Ajout en parallèle de la saisie du plan de décaissement par l'agence régionale.</p>
   <div class="frow"><div class="field half"><label>Réf. de la convention</label><input id="cvRef" value="${b.reference_convention || ''}"></div>
     <div class="field half"><label>Date de signature</label><input id="cvDate" type="date" value="${new Date().toISOString().slice(0, 10)}"></div></div>
   <div class="field"><label>Convention de prêt signée (PDF) *</label><input id="cvFile" value="${b.piece_convention || ''}" placeholder="convention_pret_${p.code}.pdf"></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn grn" data-s>${ic('check')}Enregistrer la convention</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const f = ov.querySelector('#cvFile').value.trim();
        if (!f) { toast('Le fichier de la convention signée est requis'); return; }
        b.piece_convention = f; b.convention = 'SIGNEE';
        b.reference_convention = ov.querySelector('#cvRef').value.trim() || b.reference_convention;
        p.convention_signee = ov.querySelector('#cvDate').value;
        notify('CONVENTION_AJOUTEE', {
          titre: `Convention de prêt signée — ${p.code}`, icone: 'doc', cls: 'gr', projet_id: pid,
          msg: `Ajoutée par le service Risques, Garanties et Contentieux${b.reference_convention ? ` — réf. ${b.reference_convention}` : ''}.`
        });
        close(); toast('Convention de prêt enregistrée'); route();
      };
    }

    /* ---- BARRE DE RELAIS ----
       Bande unique en tête du dossier : à quelle étape il est, qui doit agir maintenant,
       et le bouton de l'action — uniquement pour le profil concerné. */
    function barreRelais(p) {
      if (p.gele) return `<div class="gel-banner">${ic('lock')} Prêt annulé — la procédure est arrêtée et toute action est gelée sur ce dossier${p.motif_gel ? ` (${p.motif_gel})` : ''}.</div>`;
      const s = statutDe(p), r = relaisDe(p);
      const wf = WORKFLOWS[p.dispositif_id];
      const cycle = wf && wf.cycles.find(c => c.n === p.etape);
      const entete = `<div class="rl-etape"><span class="rl-n">${p.etape}</span>
   <div><b>${s.label}</b><span>${cycle ? cycle.code + ' · ' + cycle.t : 'Étape ' + p.etape}</span></div></div>`;
      if (!r) return `<div class="relais"><div class="rl-in">${entete}</div>
   ${parcoursTermine(p)
          ? `<div class="rl-fin">${ic('check')} Parcours terminé pour ce dossier</div>`
          : `<span class="rl-main">${ic('clock')} Aucune action attendue à cette étape</span>`}</div>`;
      const moi = cestMonTour(p);
      const quoi = typeof r.quoi === 'function' ? r.quoi(p) : r.quoi;
      /* actions parallèles déclarées dans le relais (PF AGR : décaisser + rembourser simultanément) */
      const actionsSecond = moi ? ((typeof r.actions === 'function' ? r.actions(p) : r.actions) || []).filter(a => a.roles.includes(roleCode())) : [];
      const btnsSecondaires = actionsSecond.map((a, i) => `<button class="btn" data-relais-sec="${i}">${a.label || a.court}</button>`).join('');
      return `<div class="relais${moi ? ' moi' : ''}">
   <div class="rl-in">${entete}
     <div class="rl-quoi"><b>${moi ? 'À vous de jouer' : 'En attente de ' + acteursAttendus(p)}</b><span>${quoi}</span></div>
   </div>
   ${moi
          ? `<div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn pri" data-relais>${ic('check')}${actionAttendue(p)}</button>${btnsSecondaires}</div>`
          : `<span class="rl-main">${ic('clock')} La main est à ${acteursAttendus(p)}</span>`}
 </div>`;
    }
    /* branche le bouton principal + les boutons d'actions parallèles de la barre de relais */
    function brancherRelais(dr, p, close) {
      const b = dr.querySelector('[data-relais]'); if (b) b.onclick = () => { close(); lancerAction(p.id); };
      /* boutons secondaires — chacun déclenche directement sa fn sans passer par lancerAction */
      dr.querySelectorAll('[data-relais-sec]').forEach(btn => {
        const idx = +btn.dataset.relaisSec;
        const rel = relaisDe(p); if (!rel) return;
        const acts = (typeof rel.actions === 'function' ? rel.actions(p) : rel.actions) || [];
        const a = acts[idx]; if (!a) return;
        btn.onclick = () => { close(); const fn = window[typeof a.fn === 'function' ? a.fn(p) : a.fn]; if (fn) fn(p.id); };
      });
    }
    /* déclenche l'action attendue sur un dossier — partagé par le tiroir et la liste */
    function lancerAction(pid) {
      const p = DB.projets.find(x => x.id === pid); if (!p) return;
      const r = relaisDe(p); if (!r) return;
      if (estGele(p, true)) return;
      if (r.route) { window._tgui = p.dispositif_id; location.hash = r.route; return; }
      const fnName = typeof r.fn === 'function' ? r.fn(p) : r.fn;
      const fn = window[fnName]; if (typeof fn === 'function') fn(p.id);
    }
    /* intitulé compact pour la colonne « À faire » de la liste */
    function actionCourte(p) {
      const r = relaisDe(p); if (!r) return '';
      return (typeof r.court === 'function' ? r.court(p) : r.court) || actionAttendue(p);
    }

    /* ---- ANNULATION DU PRÊT ----
       « Ajout sur l'interface du chef de service développement et réseaux d'un bouton
         "annulation du prêt". Ce bouton arrête la procédure et gèle toute action pour
         le dossier ; une notification est envoyée à tous les utilisateurs y compris le
         partenaire financier, qui est le principal intéressé. » (compte rendu DFP) */
    function annulerPret(pid) {
      const p = DB.projets.find(x => x.id === pid);
      const ov = el(`<div class="ov"><div class="modal" style="max-width:480px"><div class="mh"><h3>Annulation du prêt — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">
   <div class="gel-banner">${ic('lock')} Cette action arrête la procédure et gèle définitivement toute opération sur le dossier.</div>
   <p style="margin:0 0 12px;color:var(--slate);font-size:13px">${p.titre} — ${ref('jeunes', p.jeune_id)} · ${ref('organismes', p.organisme_id)}<br>Transmission, validation, autorisation, exécution et saisie des remboursements seront bloquées. Tous les utilisateurs, partenaire financier compris, seront notifiés.</p>
   <div class="field"><label>Motif de l'annulation *</label><textarea id="anMotif" rows="3" placeholder="Renonciation du promoteur, projet non viable, pièce non fournie…"></textarea></div>
 </div><div class="mf"><button class="btn ghost" data-c>Annuler</button><button class="btn danger" data-s>${ic('lock')}Confirmer l'annulation du prêt</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => closeLayer();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('[data-s]').onclick = () => {
        const m = ov.querySelector('#anMotif').value.trim();
        if (!m) { toast("Le motif de l'annulation est requis"); return; }
        p.gele = true; p.motif_gel = m;
        notify('PRET_ANNULE', {
          titre: `Prêt annulé — ${p.code}`, icone: 'lock', cls: 'rd', projet_id: pid,
          msg: `${p.titre} — procédure arrêtée par ${SESSION.prenoms} ${SESSION.nom} : ${m}. Le partenaire financier ${ref('organismes', p.organisme_id)} est informé.`
        });
        close(); toast(`${p.code} — prêt annulé, dossier gelé`); route();
      };
    }

    /* ---- FICHE SYNOPTIQUE (synthèse imprimable d'un dossier) ---- */
    function openFicheSynoptique(id) {
      const p = DB.projets.find(x => x.id === id); const j = DB.jeunes.find(x => x.id === p.jeune_id);
      const d = DB.dispositifs.find(x => x.id === p.dispositif_id); const wf = WORKFLOWS[d.id]; const s = statutDe(p);
      const b = DB.budgets.find(x => x.projet_id === id);
      const rb = DB.remboursements.filter(x => x.projet_id === id);
      const du = rb.reduce((a, r) => a + r.du, 0), paye = rb.reduce((a, r) => a + r.paye, 0);
      const impayes = rb.filter(r => r.statut === 'IMPAYE').length;
      const dec = DB.decaissements.filter(x => x.projet_id === id);
      const montantDec = dec.filter(x => x.statut === 'VALIDE').reduce((a, x) => a + x.montant, 0);
      const suivi = DB.suivis.filter(x => x.projet_id === id).slice().sort((a, b) => b.date.localeCompare(a.date))[0];
      const F = (k, v) => `<div class="f"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      const html = `<div class="sect-t">Identification</div><div class="dl">
     ${F("Code dossier", `<span class="mono">${p.code}</span>`)}${F("Guichet", d.libelle + ' (' + d.code + ')')}
     ${F("Promoteur", j.prenoms + ' ' + j.nom)}${F("Matricule AEJ", `<span class="mono">${j.matricule}</span>`)}
     ${F("CIN", j.num_piece || '—')}${F("Téléphone", `<span class="mono">${j.telephone}</span>`)}
     ${F("Localisation", ref('communes', j.commune_id))}${F("Adresse", j.adresse || '—')}
     ${F("Agence régionale", ref('agences', p.agence_id))}${F("Secteur d'activité", ref('secteurs', j.secteur_id))}
   </div>
   <div class="sect-t">Sélection & formation</div><div class="dl">
     ${F("Statut de la sélection", p.statut_selection || '—')}${F("Statut de la formation", p.statut_formation || '—')}
     ${F("Date de formation", p.date_formation || '—')}${F("Prestataire", p.prestataire || '—')}
   </div>
   <div class="sect-t">Financement</div><div class="dl">
     ${F("Montant sollicité", money(p.montant))}${F("Partenaire financier", ref('organismes', p.organisme_id))}
     ${F("Approbation", b ? badge({ APPROUVE: 'Approuvé', EN_ATTENTE: 'En attente', REJETE: 'Rejeté' }[b.approbation] || b.approbation, { APPROUVE: 'gr', EN_ATTENTE: 'am', REJETE: 'rd' }[b.approbation] || 'gy') : '—')}
     ${F("Montant décaissé", money(montantDec))}
     ${F("Total dû / remboursé", money(du) + ' / ' + money(paye))}${F("Échéances impayées", impayes)}
     ${F("Statut actuel", badge(s.label, s.cls))}
   </div>
   <div class="sect-t">Suivi terrain</div><div class="dl">
     ${F("Dernière visite", suivi ? suivi.date : "Aucune visite enregistrée")}
     ${suivi ? F("État de l'activité", badge(suivi.etat_activite, { "Bonne marche": 'gr', "En exploitation": 'bl', "En difficulté": 'am', "Sinistrée": 'rd' }[suivi.etat_activite] || 'gy')) : ''}
     ${suivi && suivi.gps ? F("Position GPS", `<span class="mono">${suivi.gps}</span>`) : ''}
   </div>
   <div class="sect-t">Progression dans le workflow</div>
   <p style="margin:0;font-size:13px;color:var(--slate)">Étape ${p.etape} / ${wf.cycles.length} — « ${wf.cycles[p.etape - 1]?.t || ''} »</p>`;
      const ov = el(`<div class="ov" style="z-index:90"><div class="modal" style="max-width:640px"><div class="mh"><h3>Fiche synoptique — ${p.code}</h3><button class="x">${ic('x')}</button></div><div class="mb">${html}</div><div class="mf"><button class="btn ghost" data-c>Fermer</button><button class="btn pri" id="fsPrint">${ic('doc')} Imprimer</button></div></div></div>`);
      $('#layer').appendChild(ov);
      const close = () => ov.remove();
      ov.querySelector('.x').onclick = close; ov.querySelector('[data-c]').onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
      ov.querySelector('#fsPrint').onclick = () => window.print();
    }

    /* ---- FINANCEMENTS ---- */
    function vFinancements() {

      const bar = el(`<div class="tabs">
   <button data-t="budgets" class="${tab === 'budgets' ? 'on' : ''}">Budgets accordés</button>
   <button data-t="depenses" class="${tab === 'depenses' ? 'on' : ''}">Dépenses</button></div>`);

    /* ---- REMBOURSEMENTS ---- */
    function vRemboursements() {
      setTop("Remboursements", "Échéances, encaissements et impayés.");
      const du = DB.remboursements.reduce((a, r) => a + r.du, 0), paye = DB.remboursements.reduce((a, r) => a + r.paye, 0);
      const imp = DB.remboursements.filter(r => r.statut === 'IMPAYE').length;
      const kpis = `<div class="grid g4" style="margin-bottom:16px">
   <div class="kpi"><div class="lab">Total dû</div><div class="val">${money(du).replace(' F', '')} <small>F</small></div></div>
   <div class="kpi"><div class="lab">Total remboursé</div><div class="val" style="color:var(--green)">${money(paye).replace(' F', '')} <small>F</small></div></div>
   <div class="kpi"><div class="lab">Taux de recouvrement</div><div class="val">${du ? Math.round(paye / du * 100) : 0}%</div></div>
   <div class="kpi"><div class="lab">Échéances impayées</div><div class="val" style="color:var(--red)">${imp}</div></div></div>`;
      // listes de suivi des impayés par dossier : à jour / ≤3 échéances / >3 échéances
      const cats = classerImpayes();
      const listCard = (titre, cls, items, vide) => {
        const rows = items.map(x => {
          const p = DB.projets.find(pp => pp.id === x.pid); if (!p) return '';
          return `<div class="acct" data-p="${p.id}" style="cursor:pointer"><div class="in"><b>${p.titre}</b><span>${p.code} · ${ref('agences', p.agence_id)}${x.nbImp ? ` · ${x.nbImp} échéance(s) impayée(s)` : ''}${x.retard ? ` · ${x.retard} j de retard` : ''}</span></div></div>`;
        }).join('');
        return `<div class="card"><div class="hd"><h3>${titre}</h3><div class="sp"></div>${badge(items.length, cls)}</div><div class="bd">${rows || `<div class="empty">${vide}</div>`}</div></div>`;
      };
      const listesHTML = `<div class="grid g3" style="margin-bottom:16px">
   ${listCard("À jour", 'gr', cats.AJOUR, "Aucun dossier à jour")}
   ${listCard("≤ 3 échéances impayées", 'am', cats.LEGER, "Aucun dossier concerné")}
   ${listCard("> 3 échéances impayées", 'rd', cats.LOURD, "Aucun dossier concerné")}
 </div>`;
      const host = el(`<div>${kpis}${listesHTML}</div>`);
      host.querySelectorAll('[data-p]').forEach(t => t.onclick = () => openProjet(t.dataset.p));
      host.appendChild(resourceView('remboursements'));
      $('#view').innerHTML = ''; $('#view').appendChild(host);
    }

    /* ---- Suivi des remboursements d'UN dossier — relais du partenaire financier une fois
       toutes les tranches décaissées (le statut « Décaissement / remboursement » couvre les deux) ---- */
    function gererRemboursements(pid) {
      const p = DB.projets.find(x => x.id === pid); if (!p) return;
      const j = DB.jeunes.find(x => x.id === p.jeune_id);
      const b = DB.budgets.find(x => x.projet_id === pid) || {};
      const mt = b.montant || p.montant || 0;
      const d = DB.dispositifs.find(x => x.id === p.dispositif_id) || {};

      const dispLbl = st.dispositif ? (DB.dispositifs.find(d => d.id === st.dispositif)?.libelle || '—') : 'Tous les guichets';
      const regLbl = st.region ? (DB.regions.find(r => r.id === st.region)?.libelle || '—') : 'Toutes les régions';
      const statLbl = st.statut ? (TOUS_STATUTS.find(s => s.k === st.statut)?.label || '—') : 'Toutes les étapes';
      const maxM = Math.max(...rows.map(r => r.m), 1);
      const avgM = totalN ? totalM / totalN : 0;
      const barRows = rows.map((r, i) => `<div class="fbar"><span class="fbar-lb">${r.k}</span><div class="fbar-track"><div class="fbar-fill" style="width:${(r.m / maxM * 100).toFixed(1)}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div><span class="fbar-v">${(r.m / 1e6).toFixed(2)}M</span></div>`).join('') || '<div class="fempty">Aucune donnée</div>';
      const tblRows = rows.map((r, i) => `<tr><td><span class="fsw" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>${r.k}</td><td class="mono">${r.n}</td><td class="mono">${money(r.m)}</td><td class="mono">${totalM ? Math.round(r.m / totalM * 100) : 0}%</td></tr>`).join('');
      return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Fiche de synthèse — ${R.label}</title>
 <style>

 </style></head><body>
 <div class="toolbar no-print"><b>Aperçu — fiche de synthèse</b><button class="gh" onclick="window.close()">Fermer</button><button class="pri" onclick="window.print()">Imprimer / Exporter en PDF</button></div>
 <div class="sheet">
   <div class="fhead">
     <div class="org"><img src="${LOGO_FULL}" alt="logo"><div><b>${c.nom_structure}</b><span>${c.nom_systeme}</span></div></div>
     <div class="meta"><span class="tag">Fiche de synthèse</span><h1>${R.label}</h1><div class="sub">Générée le ${dateLong} à ${heure} · par ${auteur}${role ? ' — ' + role : ''}</div></div>
   </div>
   <div class="ffilters">
     <div><label>Guichet</label><b>${dispLbl}</b></div>
     <div><label>Région</label><b>${regLbl}</b></div>
